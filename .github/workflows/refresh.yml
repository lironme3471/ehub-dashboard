name: Refresh eHub Dashboard

on:
  schedule:
    # 06:00 UTC daily (09:00 Israel time)
    - cron: "0 6 * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

jobs:
  refresh:
    # self-hosted runner uses corporate network → Salesforce auth works
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install dependencies
        run: |
          cd generate
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Generate dashboard
        env:
          SF_USERNAME:        ${{ secrets.SF_USERNAME }}
          SF_PASSWORD:        ${{ secrets.SF_PASSWORD }}
          SF_SECURITY_TOKEN:  ${{ secrets.SF_SECURITY_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          source generate/.venv/bin/activate
          python generate/generate.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ehub-dashboard.html
          # only commit if the file actually changed
          git diff --cached --quiet || git commit -m "data refresh $(date -u +%Y-%m-%d)"
          git push
