// Pure-JS SHA-256 (works on file:// and all contexts, no HTTPS required)
function sha256Sync(ascii) {
  function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
  const mathPow = Math.pow;
  const maxWord = mathPow(2, 32);
  let result = '';
  const words = [];
  const asciiBitLength = ascii.length * 8;
  let hash = [], k = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (mathPow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (mathPow(candidate, 1/3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = ((asciiBitLength / maxWord) | 0);
  words[words.length] = (asciiBitLength | 0);
  for (let j = 0; j < words.length;) {
    const w = words.slice(j, j += 16);
    const oldHash = hash.slice(0);
    for (let i = 0; i < 64; i++) {
      const wi = w[i];
      const s0 = rightRotate(w[i-15]||0, 7) ^ rightRotate(w[i-15]||0, 18) ^ ((w[i-15]||0) >>> 3);
      const s1 = rightRotate(w[i-2]||0, 17) ^ rightRotate(w[i-2]||0, 19) ^ ((w[i-2]||0) >>> 10);
      w[i] = (wi !== undefined ? wi : (w[i-16]||0) + s0 + (w[i-7]||0) + s1) | 0;
      const S1 = rightRotate(hash[4], 6) ^ rightRotate(hash[4], 11) ^ rightRotate(hash[4], 25);
      const ch = (hash[4] & hash[5]) ^ (~hash[4] & hash[6]);
      const temp1 = hash[7] + S1 + ch + k[i] + w[i];
      const S0 = rightRotate(hash[0], 2) ^ rightRotate(hash[0], 13) ^ rightRotate(hash[0], 22);
      const maj = (hash[0] & hash[1]) ^ (hash[0] & hash[2]) ^ (hash[1] & hash[2]);
      const temp2 = S0 + maj;
      hash = [(temp1 + temp2) | 0, hash[0], hash[1], hash[2], (hash[3] + temp1) | 0, hash[4], hash[5], hash[6]];
    }
    hash = hash.map((x, i) => (x + oldHash[i]) | 0);
  }
  hash.forEach(e => {
    for (let i = 7; i >= 0; i--) { result += ((e >>> (i * 4)) & 15).toString(16); }
  });
  return result;
}

async function sha256(msg) {
  // Try Web Crypto first (HTTPS/localhost), fall back to pure-JS
  try {
    if (typeof crypto !== 'undefined' && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  } catch(e) {}
  return sha256Sync(msg);
}

const HASH = 'fa34e5bac87849343e48ccec9965e86629502a7f0c7c9f1e18abaa8a2240e673';
async function checkPw() {
  const v = document.getElementById('pw-input').value;
  const h = await sha256(v);
  if (h === HASH) {
    sessionStorage.setItem('ehub_auth','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('pw-err').textContent='Incorrect password.';
  }
}

// Sort field helper
function goLiveSort(d) {
  const s = d.goLive.status;
  if (s === 'Live') return 'A';
  if (s === 'Delayed') return 'B' + (d.goLive.date || 'Z');
  if (s === 'ETA') return 'C' + (d.goLive.date || 'Z');
  return 'D';
}

// Populate filter dropdowns
function populateFilters() {
  const regions = [...new Set(DEALS.map(d=>d.region).filter(Boolean))].sort();
  const sel = document.getElementById('fRegion');
  regions.forEach(r => { const o=document.createElement('option'); o.value=o.text=r; sel.appendChild(o); });
}

// Sorting state
let sortCol = 'closeDate', sortDir = -1;
function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = col==='closeDate'?-1:1; }
  render();
}

// Go-live HTML
function glHtml(g) {
  if (g.status === 'Live') return '<span class="gl-live">✓ Live</span>';
  if (g.status === 'Delayed') return `<span class="gl-delayed">⚠ Delayed<br><small>${g.date||''}</small></span>`;
  if (g.status === 'ETA') return `<span class="gl-eta">→ ETA ${g.date||''}</span>`;
  return '<span class="gl-tbd">— TBD</span>';
}

// Hub badge
function hubHtml(h) {
  if (h === 'RT + Offline') return '<span class="hub-badge hub-both">RT + Offline</span>';
  if (h === 'Offline') return '<span class="hub-badge hub-offline">Offline</span>';
  return '<span class="hub-badge hub-rt">Real-Time</span>';
}

// Integration badges
function intHtml(arr) {
  if (!arr || !arr.length) return '<span style="color:#ccc">—</span>';
  return arr.map(i => {
    if (i==='SmartReach') return '<span class="int-badge int-sr">SmartReach</span>';
    if (i==='Ticketing') return '<span class="int-badge int-tk">Ticketing</span>';
    if (i==='AMC') return '<span class="int-badge int-amc">AMC</span>';
    return '';
  }).join(' ');
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const fReg = document.getElementById('fRegion').value;
  const fHub = document.getElementById('fHub').value;
  const fStatus = document.getElementById('fStatus').value;
  const fInt = document.getElementById('fIntegration').value;

  let filtered = DEALS.filter(d => {
    if (search && !d.name.toLowerCase().includes(search) && !d.topParent.toLowerCase().includes(search) && !d.account.toLowerCase().includes(search)) return false;
    if (fReg && d.region !== fReg) return false;
    if (fHub && d.hub !== fHub) return false;
    if (fStatus && d.goLive.status !== fStatus) return false;
    if (fInt === 'None' && d.integrations.length > 0) return false;
    if (fInt && fInt !== 'None' && !d.integrations.includes(fInt)) return false;
    return true;
  });

  // Sort
  filtered.sort((a,b) => {
    let av = sortCol === 'goLiveSort' ? goLiveSort(a) : (a[sortCol]??'');
    let bv = sortCol === 'goLiveSort' ? goLiveSort(b) : (b[sortCol]??'');
    if (av === null || av === undefined) av = '';
    if (bv === null || bv === undefined) bv = '';
    if (typeof av === 'number' && typeof bv === 'number') return sortDir*(av-bv);
    return sortDir * String(av).localeCompare(String(bv));
  });

  // Update KPIs (over all deals, not just filtered)
  const allFiltered = DEALS.filter(d => {
    if (search && !d.name.toLowerCase().includes(search) && !d.topParent.toLowerCase().includes(search) && !d.account.toLowerCase().includes(search)) return false;
    if (fReg && d.region !== fReg) return false;
    if (fHub && d.hub !== fHub) return false;
    if (fStatus && d.goLive.status !== fStatus) return false;
    if (fInt === 'None' && d.integrations.length > 0) return false;
    if (fInt && fInt !== 'None' && !d.integrations.includes(fInt)) return false;
    return true;
  });

  document.getElementById('kpi-total').textContent = allFiltered.length;
  document.getElementById('kpi-live').textContent = allFiltered.filter(d=>d.goLive.status==='Live').length;
  document.getElementById('kpi-delayed').textContent = allFiltered.filter(d=>d.goLive.status==='Delayed').length;
  document.getElementById('kpi-eta').textContent = allFiltered.filter(d=>d.goLive.status==='ETA').length;
  document.getElementById('kpi-tbd').textContent = allFiltered.filter(d=>d.goLive.status==='TBD').length;

  // Group by topParent, ordered by most recent closeDate in group
  const groups = {};
  filtered.forEach(d => {
    if (!groups[d.topParent]) groups[d.topParent] = [];
    groups[d.topParent].push(d);
  });

  // Find most recent closeDate per group for group-level sort
  const groupOrder = Object.keys(groups).sort((a,b) => {
    const aMax = groups[a].map(d=>d.closeDate).sort().reverse()[0] || '';
    const bMax = groups[b].map(d=>d.closeDate).sort().reverse()[0] || '';
    return bMax.localeCompare(aMax);
  });

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    document.getElementById('noResults').style.display = 'block';
  } else {
    document.getElementById('noResults').style.display = 'none';
    groupOrder.forEach(gName => {
      const gDeals = groups[gName];
      // Group header
      const htr = document.createElement('tr');
      htr.className = 'group-header';
      htr.innerHTML = `<td colspan="10">▸ ${gName} &nbsp;<span style="font-weight:400;opacity:.8">(${gDeals.length} deal${gDeals.length>1?'s':''})</span></td>`;
      tbody.appendChild(htr);

      gDeals.forEach(d => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${d.account}</td>
          <td><a class="deal-link" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view" target="_blank">${d.name}</a></td>
          <td>${d.type}</td>
          <td>${intHtml(d.integrations)}</td>
          <td>${hubHtml(d.hub)}</td>
          <td>${d.closeDate}</td>
          <td>${d.agents != null ? d.agents.toLocaleString() : '—'}</td>
          <td>${d.region||'—'}</td>
          <td>${glHtml(d.goLive)}</td>
          <td>${d.owner}</td>
        `;
        tbody.appendChild(tr);
      });
    });
  }
}

function init() {
  const now = new Date();
  const ds = now.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('dateBanner').textContent = `Dashboard generated on ${ds} — data reflects Salesforce as of that date.`;
  populateFilters();
  render();
  // If already authed on load
}

// Auto-init if already authenticated
if (sessionStorage.getItem('ehub_auth')==='1') {
  window.addEventListener('DOMContentLoaded', init);
}
