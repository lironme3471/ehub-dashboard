const HASH = '0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw-input').value;
  const h = await sha256(val);
  if (h === HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('gate-error').style.display = 'block';
  }
}

if (sessionStorage.getItem('ehub_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function goLiveCategory(gl) {
  if (!gl || gl === 'TBD') return 'TBD';
  if (gl === 'Live') return 'Live';
  if (gl.startsWith('Delayed')) return 'Delayed';
  if (gl.startsWith('ETA')) return 'ETA';

}

function getFilteredDeals() {
  const q = document.getElementById('search').value.toLowerCase();
  const fReg = document.getElementById('f-region').value;
  const fHub = document.getElementById('f-hub').value;
  const fGl = document.getElementById('f-golive').value;
  const fInt = document.getElementById('f-int').value;

  return DEALS.filter(d => {
    if (q && !d.acct.toLowerCase().includes(q) && !d.name.toLowerCase().includes(q) && !d.top.toLowerCase().includes(q)) return false;
    if (fReg && d.region !== fReg) return false;
    if (fHub && d.hub !== fHub) return false;
    if (fGl && goLiveCategory(d.goLive) !== fGl) return false;
    if (kpiFilter && goLiveCategory(d.goLive) !== kpiFilter) return false;
    if (fInt && !d.ints.includes(fInt)) return false;
    return true;
  });
}

function sortDeals(deals) {
  if (!sortCol) return deals;
  return [...deals].sort((a, b) => {
    let av, bv;
    if (sortCol === 'top') { av = a.top; bv = b.top; }
    else if (sortCol === 'name') { av = a.name; bv = b.name; }
    else if (sortCol === 'type') { av = a.type || ''; bv = b.type || ''; }
    else if (sortCol === 'hub') { av = a.hub; bv = b.hub; }
    else if (sortCol === 'close') { av = a.close; bv = b.close; }
    else if (sortCol === 'agents') { av = a.agents ?? -1; bv = b.agents ?? -1; }
    else if (sortCol === 'region') { av = a.region || ''; bv = b.region || ''; }
    else if (sortCol === 'golive') { av = a.goLive; bv = b.goLive; }
    else if (sortCol === 'owner') { av = a.owner; bv = b.owner; }
    else return 0;
    if (typeof av === 'number') return sortDir * (av - bv);
    return sortDir * String(av).localeCompare(String(bv));
  });
}

function groupByTop(deals) {
  // Group, then order groups by most recent close date desc
  const map = {};
  deals.forEach(d => {
    if (!map[d.top]) map[d.top] = [];
    map[d.top].push(d);
  });
  const groups = Object.entries(map).map(([top, rows]) => ({
    top,
    rows,
    latest: rows.reduce((mx, r) => r.close > mx ? r.close : mx, '')
  }));
  groups.sort((a, b) => b.latest.localeCompare(a.latest));
  return groups;
}

function hubBadge(hub) {
  if (hub === 'RT + Offline') return `<span class="hub-both">RT + Offline</span>`;
  if (hub === 'Offline') return `<span class="hub-off">Offline</span>`;
  return `<span class="hub-rt">Real-Time</span>`;
}

function intBadges(ints) {
  return ints.map(i => {
    if (i === 'SmartReach') return `<span class="badge badge-sr">SmartReach</span>`;
    if (i === 'Ticketing') return `<span class="badge badge-tk">Ticketing</span>`;
    if (i === 'AMC') return `<span class="badge badge-amc">AMC</span>`;
    return '';
  }).join('');
}

function goLiveCell(gl) {
  const cat = goLiveCategory(gl);
  if (cat === 'Live') return `<span class="go-live-live">✔ Live</span>`;
  if (cat === 'Delayed') return `<span class="go-live-delayed">⚠ ${gl}</span>`;
  if (cat === 'ETA') return `<span class="go-live-eta">🕐 ${gl}</span>`;
  return `<span class="go-live-tbd">TBD</span>`;
}

function render() {
  const filtered = getFilteredDeals();
  const tbody = document.getElementById('tbody');

  // Update KPI highlights
  const cats = {Live:0, Delayed:0, ETA:0, TBD:0};
  filtered.forEach(d => { cats[goLiveCategory(d.goLive)]++; });
  document.querySelectorAll('.kpi').forEach(el => {
    el.classList.toggle('active', el.dataset.cat === kpiFilter);
  });
  // Update KPI numbers (total = filtered)
  document.querySelector('[data-cat="total"] .kpi-num').textContent = filtered.length;
  document.querySelector('[data-cat="Live"] .kpi-num').textContent = cats.Live;
  document.querySelector('[data-cat="Delayed"] .kpi-num').textContent = cats.Delayed;
  document.querySelector('[data-cat="ETA"] .kpi-num').textContent = cats.ETA;
  document.querySelector('[data-cat="TBD"] .kpi-num').textContent = cats.TBD;

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr><td colspan="10" class="empty">No deals match current filters.</td></tr>`;
    return;
  }

  let html = '';
  if (sortCol) {
    // Flat sorted
    const sorted = sortDeals(filtered);
    sorted.forEach(d => { html += dealRow(d); });
  } else {
    // Grouped
    const groups = groupByTop(filtered);
    groups.forEach(g => {
      html += `<tr class="group-header"><td colspan="10">${escH(g.top)} <span style="color:#999;font-weight:400">(${g.rows.length} deal${g.rows.length>1?'s':''})</span></td></tr>`;
      // Sort rows within group by close date desc
      g.rows.sort((a,b) => b.close.localeCompare(a.close));
      g.rows.forEach(d => { html += dealRow(d); });
    });
  }
  tbody.innerHTML = html;
}

function dealRow(d) {
  const sfUrl = `https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view`;
  return `<tr>
    <td>${escH(d.acct)}</td>
    <td><a class="deal-link" href="${sfUrl}" target="_blank" rel="noopener">${escH(d.name)}</a></td>
    <td>${escH(d.type||'')}</td>
    <td>${intBadges(d.ints)}</td>
    <td>${hubBadge(d.hub)}</td>
    <td>${d.close}</td>
    <td>${d.agents != null ? d.agents.toLocaleString() : '—'}</td>
    <td>${escH(d.region||'')}</td>
    <td>${goLiveCell(d.goLive)}</td>
    <td>${escH(d.owner)}</td>
  </tr>`;
}

function escH(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setSort(col) {
  if (sortCol === col) { sortDir *= -1; }
  else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  const idx = ['top','name','type',null,'hub','close','agents','region','golive','owner'].indexOf(col);
  if (idx >= 0) {
    const ths = document.querySelectorAll('thead th');
    if (ths[idx]) {
      ths[idx].classList.add('sorted');
      ths[idx].querySelector('.sort-arrow').textContent = sortDir === 1 ? '↑' : '↓';
    }
  }
  render();
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('f-region').value = '';
  document.getElementById('f-hub').value = '';
  document.getElementById('f-golive').value = '';
  document.getElementById('f-int').value = '';
  sortCol = null; sortDir = 1;
  kpiFilter = null;
  document.querySelectorAll('thead th .sort-arrow').forEach(a => a.textContent = '↕');
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  render();
}

// ─── INIT ────────────────────────────────────────────────────────────────────
function init() {
  // Banner
  document.getElementById('banner').textContent =
    `Dashboard generated on 2026-07-23 — data reflects Salesforce as of that date.`;

  // KPI bar
  const kpiDefs = [
    {cat:'total', label:'Total Deals'},
    {cat:'Live', label:'Live'},
    {cat:'Delayed', label:'Delayed'},
    {cat:'ETA', label:'ETA'},
    {cat:'TBD', label:'TBD'},
  ];
  const kpiBar = document.getElementById('kpi-bar');
  kpiDefs.forEach(k => {
    const el = document.createElement('div');
    el.className = 'kpi';
    el.dataset.cat = k.cat;
    el.innerHTML = `<div class="kpi-num">0</div><div class="kpi-label">${k.label}</div>`;
    if (k.cat !== 'total') {
      el.onclick = () => {
        kpiFilter = kpiFilter === k.cat ? null : k.cat;
        render();
      };
    }
    kpiBar.appendChild(el);
  });

  // Region dropdown
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const sel = document.getElementById('f-region');
  regions.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o); });

  render();
}

init();
</script>
