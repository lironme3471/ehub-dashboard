:root{--blue:#3694FC;--charcoal:#21212B;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}

body{font-family:'Be Vietnam Pro',sans-serif;background:#f4f6fa;color:var(--charcoal);}
#gate{position:fixed;inset:0;background:#21212b;display:flex;align-items:center;justify-content:center;z-index:1000;}
#gate .card{background:#fff;border-radius:14px;padding:40px 44px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
#gate .logo{font-size:30px;font-weight:700;margin-bottom:6px;}
#gate .logo span{color:var(--blue);}
#gate p{color:#666;font-size:13px;margin-bottom:18px;}
#gate input{width:100%;padding:11px 14px;border:1.5px solid #d9dce3;border-radius:8px;font-size:14px;font-family:inherit;outline:none;}
#gate input:focus{border-color:var(--blue);}
#gate button{width:100%;margin-top:12px;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;}
#gate button:hover{background:#2478d8;}
#gate .err{color:var(--coral);font-size:12px;margin-top:10px;min-height:15px;}
#app{display:none;max-width:1500px;margin:0 auto;padding:24px;}
header{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
header .logo{font-size:26px;font-weight:700;}
header .logo span{color:var(--blue);}
header h1{font-size:19px;font-weight:600;}
.banner{background:#fff7d6;border:1px solid #f0dd8a;color:#7a6410;padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 1px 4px rgba(33,33,43,.08);border-top:3px solid var(--blue);}
.kpi .num{font-size:26px;font-weight:700;}
.kpi .lbl{font-size:12px;color:#777;margin-top:2px;text-transform:uppercase;letter-spacing:.5px;}
.kpi.live{border-top-color:#22c55e;}.kpi.delayed{border-top-color:var(--coral);}
.kpi.eta{border-top-color:var(--indigo);}.kpi.tbd{border-top-color:#9ca3af;}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #d9dce3;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;outline:none;}
.filters input{flex:1;min-width:220px;}
.filters input:focus,.filters select:focus{border-color:var(--blue);}
.tablewrap{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(33,33,43,.08);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1150px;}
thead th{background:var(--charcoal);color:#fff;text-align:left;padding:11px 12px;font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;}
thead th .arrow{font-size:10px;opacity:.7;margin-left:4px;}
tbody td{padding:10px 12px;border-bottom:1px solid #eef0f4;vertical-align:top;}
tr.group td{background:#e8f1fd;font-weight:600;color:var(--charcoal);font-size:13px;padding:9px 12px;border-bottom:1px solid #d5e5fb;}
tr.group .cnt{color:#5a7a9e;font-weight:500;font-size:12px;}
td a{color:var(--blue);text-decoration:none;font-weight:500;}
td a:hover{text-decoration:underline;}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.hub-rt{background:rgba(54,148,252,.14);color:#1d6fd1;}
.hub-off{background:rgba(54,234,208,.2);color:#0c8f7a;}
.hub-both{background:rgba(97,0,255,.1);color:var(--indigo);}

.st-delayed{background:#ffe4ec;color:#d6335f;}
.st-eta{background:#efe6ff;color:var(--indigo);}
.st-tbd{background:#eef0f2;color:#6b7280;}
.empty{padding:30px;text-align:center;color:#888;font-size:14px;}

let sortKey=null,sortDir=1;
function sortBy(k){if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=1;}render();}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function hubBadge(h){const c=h==="RT + Offline"?"hub-both":(h==="Offline"?"hub-off":"hub-rt");return '<span class="badge '+c+'">'+esc(h)+'</span>';}
function intBadges(a){return a.map(i=>{const c=i==="SmartReach"?"int-sr":(i==="Ticketing"?"int-tk":"int-amc");return '<span class="badge '+c+'">'+esc(i)+'</span>';}).join("");}
function stBadge(d){return '<span class="badge st-'+d.statusClass+'">'+esc(d.status)+'</span>';}
function filtered(){
  const q=document.getElementById("fSearch").value.toLowerCase(),
        rg=document.getElementById("fRegion").value,
        hb=document.getElementById("fHub").value,
        st=document.getElementById("fStatus").value,
        ig=document.getElementById("fInteg").value;
  return DEALS.filter(d=>
    (!q||d.account.toLowerCase().includes(q)||d.deal.toLowerCase().includes(q))&&
    (!rg||d.region===rg)&&(!hb||d.hub===hb)&&(!st||d.statusClass===st)&&
    (!ig||d.integrations.includes(ig)));
}
function render(){
  const rows=filtered(),tb=document.getElementById("tbody");
  document.getElementById("kTotal").textContent=rows.length;
  document.getElementById("kLive").textContent=rows.filter(d=>d.statusClass==="live").length;
  document.getElementById("kDelayed").textContent=rows.filter(d=>d.statusClass==="delayed").length;
  document.getElementById("kEta").textContent=rows.filter(d=>d.statusClass==="eta").length;
  document.getElementById("kTbd").textContent=rows.filter(d=>d.statusClass==="tbd").length;
  document.querySelectorAll(".arrow").forEach(e=>e.textContent="");
  if(sortKey){const a=document.getElementById("ar-"+sortKey);if(a)a.textContent=sortDir>0?"▲":"▼";}
  if(!rows.length){tb.innerHTML='<tr><td colspan="10" class="empty">No deals match the current filters.</td></tr>';return;}
  let htmlOut="";
  const rowHtml=d=>'<tr>'+
    '<td>'+esc(d.account)+'</td>'+
    '<td><a href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+d.id+'/view" target="_blank">'+esc(d.deal)+'</a></td>'+
    '<td>'+esc(d.type)+'</td>'+
    '<td>'+intBadges(d.integrations)+'</td>'+
    '<td>'+hubBadge(d.hub)+'</td>'+
    '<td>'+esc(d.close)+'</td>'+
    '<td>'+(d.agents==null?"—":d.agents)+'</td>'+
    '<td>'+esc(d.region||"—")+'</td>'+
    '<td>'+stBadge(d)+'</td>'+
    '<td>'+esc(d.owner)+'</td>'+
    '</tr>';
  if(sortKey){
    const key=d=>sortKey==="integ"?d.integrations.join(","):(sortKey==="agents"?(d.agents==null?-1:d.agents):(d[sortKey]==null?"":d[sortKey]));
    rows.sort((a,b)=>{const x=key(a),y=key(b);return (x<y?-1:x>y?1:0)*sortDir;});
    rows.forEach(d=>htmlOut+=rowHtml(d));
  }else{
    const groups={};
    rows.forEach(d=>{(groups[d.group]=groups[d.group]||[]).push(d);});
    const ordered=Object.entries(groups).map(([g,ds])=>({g,ds,latest:ds.map(x=>x.close).sort().slice(-1)[0]}))
      .sort((a,b)=>b.latest.localeCompare(a.latest));
    ordered.forEach(({g,ds})=>{
      ds.sort((a,b)=>b.close.localeCompare(a.close));
      htmlOut+='<tr class="group"><td colspan="10">'+esc(g)+' <span class="cnt">&mdash; '+ds.length+' deal'+(ds.length>1?"s":"")+'</span></td></tr>';
      ds.forEach(d=>htmlOut+=rowHtml(d));
    });
  }
  tb.innerHTML=htmlOut;
}
(function(){
  const rs=[...new Set(DEALS.map(d=>d.region).filter(Boolean))].sort();
  const sel=document.getElementById("fRegion");
  rs.forEach(r=>{const o=document.createElement("option");o.textContent=r;sel.appendChild(o);});
  render();
})();
