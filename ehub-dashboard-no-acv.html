<style>
  :root {
    --nice-blue: #3694FC;
    --charcoal: #21212B;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f5f7; color: var(--charcoal);
  }
  #gate {
    position: fixed; inset: 0; background: rgba(33,33,43,0.97);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 36px 40px; width: 360px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center;
  }
  #gate h2 { margin-top: 0; color: var(--charcoal); }
  #gate input {
    width: 100%; padding: 10px 12px; margin: 14px 0; border: 1px solid #ccc;
    border-radius: 6px; font-size: 14px;
  }
  #gate button {
    background: var(--nice-blue); color: #fff; border: none; padding: 10px 20px;
    border-radius: 6px; cursor: pointer; font-size: 14px; width: 100%;
  }
  #gate .err { color: var(--coral); font-size: 13px; min-height: 18px; }
  #app { display: none; max-width: 1400px; margin: 0 auto; padding: 20px; }
  .banner {
    background: #FFF3C4; border: 1px solid #E8C547; color: #665200;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;
  }
  h1 { font-size: 22px; margin: 0 0 16px 0; color: var(--charcoal); }
  .kpis { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .kpi {
    background: #fff; border-radius: 10px; padding: 14px 20px; min-width: 110px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); text-align: center;
  }
  .kpi .num { font-size: 24px; font-weight: 700; color: var(--charcoal); }
  .kpi .lbl { font-size: 12px; color: #666; margin-top: 4px; }
  .filters {
    display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;
  }
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
  }
  .filters button {
    padding: 8px 14px; border: 1px solid var(--nice-blue); background: #fff;
    color: var(--nice-blue); border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  thead th {
    background: var(--charcoal); color: #fff; padding: 10px 8px; text-align: left;
    font-size: 12px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { background: #33334a; }
  tbody td { padding: 8px; font-size: 13px; border-bottom: 1px solid #eee; vertical-align: top; }
  tbody tr:hover { background: #f8f9fb; }
  .group-row td {
    background: #eef3fb; font-weight: 700; font-size: 13px; color: var(--charcoal);
    padding: 8px 10px;
  }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-weight: 600; color: #fff; margin: 1px 2px 1px 0;
  }
  .hub-rt { background: var(--nice-blue); }
  .hub-off { background: var(--teal); color: #21212B; }
  .hub-both { background: var(--indigo); }
  .int-sr { background: #FF8C3A; }
  .int-tk { background: #9B51E0; }
  .int-amc { background: #3BB54A; }
  .gl-live { background: #3BB54A; }
  .gl-delayed { background: var(--coral); }
  .gl-eta { background: var(--nice-blue); }
  .gl-tbd { background: #9aa0a6; }
  a.deal-link { color: var(--nice-blue); text-decoration: none; }
  a.deal-link:hover { text-decoration: underline; }
  .no-results td { text-align: center; padding: 20px; color: #888; }
</style>
</head>

<div id="gate">
  <div class="card">
    <h2>eHub Dashboard</h2>
    <p style="font-size:13px;color:#666;">Enter password to continue</p>
    <input type="password" id="pwInput" placeholder="Password" autofocus>
    <div class="err" id="pwErr"></div>
    <button onclick="checkPassword()">Unlock</button>
  </div>
</div>

<div id="app">
  <h1>eHub Closed Won Dashboard</h1>
  <div class="banner">Dashboard generated on October 15, 2026 — data reflects Salesforce as of that date.</div>

  <div class="kpis" id="kpis"></div>

  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search account or deal name...">
    <select id="regionFilter"><option value="">All Regions</option></select>
    <select id="hubFilter"><option value="">All Hub Types</option></select>
    <select id="statusFilter"><option value="">All Go-Live Status</option></select>
    <select id="integFilter"><option value="">All Integrations</option></select>
    <button onclick="resetView()">Reset / Group by Account</button>
  </div>

  <table>
    <thead>
      <tr>
        <th data-col="Account">Account</th>
        <th data-col="DealName">Deal Name</th>
        <th data-col="Type">Type</th>
        <th data-col="Integration">Integration</th>
        <th data-col="Hub">Hub</th>
        <th data-col="CloseDate">Close Date</th>
        <th data-col="Agents">Agents</th>
        <th data-col="Region">Region</th>
        <th data-col="GoLive">Go-Live</th>
        <th data-col="Owner">Owner</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const SF_BASE = "https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

async function checkPassword() {
  const pw = document.getElementById("pwInput").value;
  const hash = await sha256(pw);
  if (hash === STORED_HASH) {
    sessionStorage.setItem("ehub_noacv_unlocked", "1");
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    initApp();
  } else {
    document.getElementById("pwErr").textContent = "Incorrect password.";
  }
}

document.getElementById("pwInput").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});

try {
  if (sessionStorage.getItem("ehub_noacv_unlocked") === "1") {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    window.addEventListener("DOMContentLoaded", initApp);
  }
} catch(e) {}

let currentSort = null; // {col, dir}
let flatMode = false;

function fmtDate(s) {
  if (!s) return "";
  const d = new Date(s + "T00:00:00");
  return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

function goLiveLabel(r) {
  if (r.GoLiveStatus === "Live") return {text:"Live", cls:"gl-live"};
  if (r.GoLiveStatus === "Delayed") return {text:"Delayed → " + fmtDate(r.GoLiveDate), cls:"gl-delayed"};
  if (r.GoLiveStatus === "ETA") return {text:"ETA " + fmtDate(r.GoLiveDate), cls:"gl-eta"};
  return {text:"TBD", cls:"gl-tbd"};
}

function hubBadge(hub) {
  if (hub === "RT + Offline") return '<span class="badge hub-both">RT + Offline</span>';
  if (hub === "Offline") return '<span class="badge hub-off">Offline</span>';
  return '<span class="badge hub-rt">Real-Time</span>';
}

function integBadges(list) {
  const map = {SmartReach:"int-sr", Ticketing:"int-tk", AMC:"int-amc"};
  return list.map(i => `<span class="badge ${map[i]}">${i}</span>`).join("") || "";
}

function populateFilters() {
  const regions = [...new Set(DATA.map(r => r.Region).filter(Boolean))].sort();
  const hubs = [...new Set(DATA.map(r => r.Hub))].sort();
  const statuses = [...new Set(DATA.map(r => r.GoLiveStatus))].sort();
  const integs = [...new Set(DATA.flatMap(r => r.Integration))].sort();
  const fill = (id, arr) => {
    const sel = document.getElementById(id);
    arr.forEach(v => { const o = document.createElement("option"); o.value=v; o.textContent=v; sel.appendChild(o); });
  };
  fill("regionFilter", regions);
  fill("hubFilter", hubs);
  fill("statusFilter", statuses);
  fill("integFilter", integs);
}

function applyFilters(rows) {
  const search = document.getElementById("searchBox").value.toLowerCase();
  const region = document.getElementById("regionFilter").value;
  const hub = document.getElementById("hubFilter").value;
  const status = document.getElementById("statusFilter").value;
  const integ = document.getElementById("integFilter").value;
  return rows.filter(r => {
    if (search && !(r.Account.toLowerCase().includes(search) || r.DealName.toLowerCase().includes(search))) return false;
    if (region && r.Region !== region) return false;
    if (hub && r.Hub !== hub) return false;
    if (status && r.GoLiveStatus !== status) return false;
    if (integ && !r.Integration.includes(integ)) return false;
    return true;
  });
}

function goLiveSortKey(r) {
  // rank: Live=0, Delayed/ETA merged by date=1, TBD=2
  if (r.GoLiveStatus === "Live") return [0, ""];
  if (r.GoLiveStatus === "TBD") return [2, ""];
  return [1, r.GoLiveDate || "9999-99-99"];
}

function renderRow(r) {
  const gl = goLiveLabel(r);
  return `<tr>
    <td>${r.Account}</td>
    <td><a class="deal-link" href="${SF_BASE}${r.Id}/view" target="_blank">${r.DealName}</a></td>
    <td>${r.Type || ""}</td>
    <td>${integBadges(r.Integration)}</td>
    <td>${hubBadge(r.Hub)}</td>
    <td>${fmtDate(r.CloseDate)}</td>
    <td>${r.Agents != null ? r.Agents : ""}</td>
    <td>${r.Region || ""}</td>
    <td><span class="badge ${gl.cls}">${gl.text}</span></td>
    <td>${r.Owner || ""}</td>
  </tr>`;
}

function render() {
  const filtered = applyFilters(DATA);
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>`;
    return;
  }

  if (flatMode && currentSort) {
    let sorted = [...filtered];
    const {col, dir} = currentSort;
    sorted.sort((a,b) => {
      let av, bv;
      if (col === "GoLive") {
        av = goLiveSortKey(a); bv = goLiveSortKey(b);
        if (av[0] !== bv[0]) return (av[0]-bv[0]) * (dir==="asc"?1:-1);
        return av[1].localeCompare(bv[1]) * (dir==="asc"?1:-1);
      }
      av = a[col]; bv = b[col];
      if (col === "Integration") { av = (av||[]).join(","); bv = (bv||[]).join(","); }
      av = av==null? "": av; bv = bv==null? "": bv;
      if (typeof av === "number" && typeof bv === "number") return (av-bv)*(dir==="asc"?1:-1);
      return String(av).localeCompare(String(bv)) * (dir==="asc"?1:-1);
    });
    sorted.forEach(r => tbody.insertAdjacentHTML("beforeend", renderRow(r)));
    return;
  }

  // grouped by TopParent, groups ordered by most recent close date desc
  const groups = {};
  filtered.forEach(r => {
    const key = r.TopParent || r.Account;
    if (!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  const groupKeys = Object.keys(groups).sort((a,b) => {
    const maxA = Math.max(...groups[a].map(r => new Date(r.CloseDate).getTime()));
    const maxB = Math.max(...groups[b].map(r => new Date(r.CloseDate).getTime()));
    return maxB - maxA;
  });
  groupKeys.forEach(key => {
    const grows = groups[key].sort((a,b) => new Date(b.CloseDate) - new Date(a.CloseDate));
    tbody.insertAdjacentHTML("beforeend", `<tr class="group-row"><td colspan="10">${key} (${grows.length} deal${grows.length>1?'s':''})</td></tr>`);
    grows.forEach(r => tbody.insertAdjacentHTML("beforeend", renderRow(r)));
  });
}

function renderKPIs() {
  const total = DATA.length;
  const live = DATA.filter(r => r.GoLiveStatus === "Live").length;
  const delayed = DATA.filter(r => r.GoLiveStatus === "Delayed").length;
  const eta = DATA.filter(r => r.GoLiveStatus === "ETA").length;
  const tbd = DATA.filter(r => r.GoLiveStatus === "TBD").length;
  const kpis = document.getElementById("kpis");
  const items = [["Total Deals", total], ["Live", live], ["Delayed", delayed], ["ETA", eta], ["TBD", tbd]];
  kpis.innerHTML = items.map(([lbl,num]) => `<div class="kpi"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`).join("");
}

function resetView() {
  flatMode = false;
  currentSort = null;
  document.getElementById("searchBox").value = "";
  document.getElementById("regionFilter").value = "";
  document.getElementById("hubFilter").value = "";
  document.getElementById("statusFilter").value = "";
  document.getElementById("integFilter").value = "";
  render();
}

function initApp() {
  renderKPIs();
  populateFilters();
  render();
  document.getElementById("searchBox").addEventListener("input", render);
  ["regionFilter","hubFilter","statusFilter","integFilter"].forEach(id => {
    document.getElementById(id).addEventListener("change", render);
  });
  document.querySelectorAll("thead th").forEach(th => {
    th.addEventListener("click", () => {
      const col = th.getAttribute("data-col");
      if (currentSort && currentSort.col === col) {
        currentSort.dir = currentSort.dir === "asc" ? "desc" : "asc";
      } else {
        currentSort = {col, dir: "asc"};
      }
      flatMode = true;
      render();
    });
  });
}

if (sessionStorage.getItem && sessionStorage.getItem("ehub_noacv_unlocked") !== "1") {
  // gate stays visible, nothing to init yet
}
</script>
