<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Closed Won Dashboard</title>
<style>
  :root{
    --nice-blue:#3694FC; --charcoal:#21212B; --indigo:#6100FF; --teal:#36EAD0; --coral:#FF5B8A;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f4f5f7;color:var(--charcoal);}
  #gate-overlay{position:fixed;inset:0;background:rgba(33,33,43,0.92);display:flex;align-items:center;justify-content:center;z-index:9999;}
  #gate-card{background:#fff;border-radius:12px;padding:40px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center;}
  #gate-card h2{margin-top:0;color:var(--charcoal);}
  #gate-card input{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:6px;margin:12px 0;}
  #gate-card button{width:100%;padding:10px;font-size:15px;background:var(--nice-blue);color:#fff;border:none;border-radius:6px;cursor:pointer;}
  #gate-card button:hover{opacity:.9;}
  #gate-error{color:var(--coral);font-size:13px;min-height:18px;}
  #app{display:none;padding:24px;max-width:1500px;margin:0 auto;}
  .banner{background:#FFE58A;color:#5c4400;padding:10px 16px;border-radius:8px;font-size:14px;margin-bottom:18px;text-align:center;font-weight:600;}
  h1{font-size:22px;margin-bottom:4px;}
  .kpis{display:flex;gap:14px;margin:18px 0;flex-wrap:wrap;}
  .kpi{flex:1;min-width:130px;background:#fff;border-radius:10px;padding:14px 16px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-top:4px solid var(--nice-blue);}
  .kpi .num{font-size:26px;font-weight:700;color:var(--charcoal);}
  .kpi .lbl{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.03em;}
  .kpi.live{border-color:#2fbf71;} .kpi.delayed{border-color:var(--coral);} .kpi.eta{border-color:var(--nice-blue);} .kpi.tbd{border-color:#999;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;background:#fff;padding:12px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .filters input, .filters select{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:13px;}
  .filters input{flex:1;min-width:180px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  th{background:var(--charcoal);color:#fff;padding:10px 8px;font-size:12px;text-align:left;cursor:pointer;white-space:nowrap;}
  th:hover{background:#33333f;}
  td{padding:8px;font-size:13px;border-bottom:1px solid #eee;vertical-align:top;}
  tr.group-row td{background:#eef3fb;font-weight:700;color:var(--charcoal);font-size:12.5px;}
  tr.no-results td{text-align:center;color:#888;padding:20px;}
  a.dealname{color:var(--nice-blue);text-decoration:none;}
  a.dealname:hover{text-decoration:underline;}
  .badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:10.5px;font-weight:600;color:#fff;margin-right:3px;}
  .badge.smartreach{background:#FF9900;} .badge.ticketing{background:#8E44AD;} .badge.amc{background:#2ECC71;}
  .hub-tag{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600;color:#fff;}
  .hub-offline{background:var(--teal);color:#0a3a35;} .hub-rt{background:var(--nice-blue);} .hub-both{background:var(--indigo);}
  .status{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;}
  .status-live{background:#e3f8ec;color:#1c8a4f;} .status-delayed{background:#ffe3ea;color:#c2185b;} .status-eta{background:#e6f1ff;color:#1665c1;} .status-tbd{background:#eee;color:#777;}
  footer{text-align:center;color:#999;font-size:11px;margin-top:20px;}
</style>
</head>

<div id="gate-overlay">
  <div id="gate-card">
    <h2>eHub Dashboard</h2>
    <p style="font-size:13px;color:#666;">Enter password to continue</p>

    <div id="gate-error"></div>
    <button onclick="checkPassword()">Unlock</button>
  </div>
</div>

<div id="app">

    <div class="kpi tbd"><div class="num" id="kpi-tbd">0</div><div class="lbl">TBD</div></div>
  </div>

  <div class="filters">
    <input type="text" id="f-search" placeholder="Search account or deal name...">
    <select id="f-region"><option value="">All Regions</option></select>
    <select id="f-hub"><option value="">All Hub Types</option><option value="Offline">Offline</option><option value="Real-Time">Real-Time</option><option value="RT + Offline">RT + Offline</option></select>

    <select id="f-integ"><option value="">All Integrations</option><option value="SmartReach">SmartReach</option><option value="Ticketing">Ticketing</option><option value="AMC">AMC</option></select>
  </div>

  <table id="deals-table">
    <thead>
      <tr>
        <th data-key="account">Account</th>
        <th data-key="deal">Deal Name</th>
        <th data-key="type">Type</th>
        <th data-key="integ">Integration</th>
        <th data-key="hub">Hub</th>
        <th data-key="close">Close Date</th>
        <th data-key="agents">Agents</th>
        <th data-key="region">Region</th>
        <th data-key="golive">Go-Live</th>
        <th data-key="owner">Owner</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <footer>NiCE eHub Pipeline &mdash; internal use only</footer>
</div>

const SHA256_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
const TODAY = new Date("2026-09-29T00:00:00");

async function sha256Hex(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

async function checkPassword(){
  const pw = document.getElementById("gate-pw").value;
  const hash = await sha256Hex(pw);
  if(hash === SHA256_HASH){
    sessionStorage.setItem("ehub_noacv_unlocked","1");
    document.getElementById("gate-overlay").style.display="none";
    document.getElementById("app").style.display="block";
    initApp();
  } else {
    document.getElementById("gate-error").textContent = "Incorrect password.";
  }
}
document.getElementById("gate-pw").addEventListener("keydown", e=>{ if(e.key==="Enter") checkPassword(); });

if(sessionStorage.getItem("ehub_noacv_unlocked")==="1"){
  document.getElementById("gate-overlay").style.display="none";
  document.getElementById("app").style.display="block";
  window.addEventListener("DOMContentLoaded", initApp);
}

function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString("en-US",{year:"numeric",month:"short",day:"numeric"});
}

function golivePillHtml(d){
  if(d.status==="Live") return '<span class="status status-live">Live</span>';
  if(d.status==="Delayed") return '<span class="status status-delayed">Delayed &rarr; '+fmtDate(d.etaDate)+'</span>';
  if(d.status==="ETA") return '<span class="status status-eta">ETA '+fmtDate(d.etaDate)+'</span>';
  return '<span class="status status-tbd">TBD</span>';
}

function hubTagHtml(h){
  let cls = h==="Offline" ? "hub-offline" : h==="RT + Offline" ? "hub-both" : "hub-rt";
  return '<span class="hub-tag '+cls+'">'+h+'</span>';
}

function integHtml(arr){
  if(!arr || !arr.length) return "";
  return arr.map(i=>{
    let cls = i==="SmartReach"?"smartreach":i==="Ticketing"?"ticketing":"amc";
    return '<span class="badge '+cls+'">'+i+'</span>';
  }).join("");
}

let sortKey = "golive_sort";
let sortAsc = true;

function goliveSortValue(d){
  // Live sorts first, TBD sorts last, Delayed+ETA merged into one date sequence
  if(d.status==="Live") return -8640000000000000; // earliest possible
  if(d.status==="TBD") return 8640000000000000; // latest possible
  return new Date(d.etaDate+"T00:00:00").getTime();
}

function applyFiltersAndSort(list){
  const search = document.getElementById("f-search").value.trim().toLowerCase();
  const region = document.getElementById("f-region").value;
  const hub = document.getElementById("f-hub").value;
  const status = document.getElementById("f-status").value;
  const integ = document.getElementById("f-integ").value;

  let filtered = list.filter(d=>{
    if(search && !(d.account.toLowerCase().includes(search) || d.deal.toLowerCase().includes(search))) return false;
    if(region && d.region !== region) return false;
    if(hub && d.hub !== hub) return false;
    if(status && d.status !== status) return false;
    if(integ && !(d.integ||[]).includes(integ)) return false;
    return true;
  });

  if(sortKey){
    filtered.sort((a,b)=>{
      let va, vb;
      if(sortKey==="golive_sort"){ va = goliveSortValue(a); vb = goliveSortValue(b); }
      else if(sortKey==="close"){ va = a.close; vb = b.close; }
      else if(sortKey==="agents"){ va = a.agents==null?-1:a.agents; vb = b.agents==null?-1:b.agents; }
      else { va = (a[sortKey]||"").toString().toLowerCase(); vb = (b[sortKey]||"").toString().toLowerCase(); }
      if(va<vb) return sortAsc?-1:1;
      if(va>vb) return sortAsc?1:-1;
      return 0;
    });
  }
  return filtered;
}

function groupAndRender(list){
  const tbody = document.getElementById("table-body");
  tbody.innerHTML = "";

  if(list.length===0){
    tbody.innerHTML = '<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>';
    return;
  }

  // If a column sort other than default golive/grouped view is active, render flat (no grouping) when user picked non-golive sort explicitly via header click other than default.
  if(window.__flatSort){
    list.forEach(d=>tbody.appendChild(rowHtml(d)));
    return;
  }

  // group by topParent, order groups by most recent close date desc
  const groups = {};
  list.forEach(d=>{
    const key = d.topParent || d.account;
    if(!groups[key]) groups[key]=[];
    groups[key].push(d);
  });
  const groupKeys = Object.keys(groups).sort((a,b)=>{
    const maxA = groups[a].reduce((m,d)=> d.close>m?d.close:m, "0000-00-00");
    const maxB = groups[b].reduce((m,d)=> d.close>m?d.close:m, "0000-00-00");
    return maxB.localeCompare(maxA);
  });

  groupKeys.forEach(key=>{
    const rows = groups[key];
    const tr = document.createElement("tr");
    tr.className="group-row";
    tr.innerHTML = '<td colspan="10">'+key+' ('+rows.length+' deal'+(rows.length>1?"s":"")+')</td>';
    tbody.appendChild(tr);
    rows.forEach(d=>tbody.appendChild(rowHtml(d)));
  });
}

function rowHtml(d){
  const tr = document.createElement("tr");
  tr.innerHTML =
    '<td>'+d.account+'</td>'+
    '<td><a class="dealname" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+d.id+'/view">'+d.deal+'</a></td>'+
    '<td>'+d.type+'</td>'+
    '<td>'+integHtml(d.integ)+'</td>'+
    '<td>'+hubTagHtml(d.hub)+'</td>'+
    '<td>'+fmtDate(d.close)+'</td>'+
    '<td>'+(d.agents==null?"":d.agents.toLocaleString())+'</td>'+
    '<td>'+(d.region||"")+'</td>'+
    '<td>'+golivePillHtml(d)+'</td>'+
    '<td>'+d.owner+'</td>';
  return tr;
}

function updateKpis(list){
  document.getElementById("kpi-total").textContent = list.length;
  document.getElementById("kpi-live").textContent = list.filter(d=>d.status==="Live").length;
  document.getElementById("kpi-delayed").textContent = list.filter(d=>d.status==="Delayed").length;
  document.getElementById("kpi-eta").textContent = list.filter(d=>d.status==="ETA").length;
  document.getElementById("kpi-tbd").textContent = list.filter(d=>d.status==="TBD").length;
}

function render(){
  const filtered = applyFiltersAndSort(DEALS);
  updateKpis(filtered);
  groupAndRender(filtered);
}

function initApp(){
  const regions = Array.from(new Set(DEALS.map(d=>d.region).filter(Boolean))).sort();
  const sel = document.getElementById("f-region");
  regions.forEach(r=>{
    const opt = document.createElement("option");
    opt.value=r; opt.textContent=r;
    sel.appendChild(opt);
  });

  document.getElementById("banner").textContent =
    "Dashboard generated on " + TODAY.toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}) + " — data reflects Salesforce as of that date.";

  ["f-search","f-region","f-hub","f-status","f-integ"].forEach(id=>{
    document.getElementById(id).addEventListener("input", render);
    document.getElementById(id).addEventListener("change", render);
  });

  document.querySelectorAll("#deals-table th").forEach(th=>{
    th.addEventListener("click", ()=>{
      const key = th.getAttribute("data-key");
      const mappedKey = key==="golive" ? "golive_sort" : key;
      if(sortKey===mappedKey){ sortAsc=!sortAsc; } else { sortKey=mappedKey; sortAsc=true; }
      window.__flatSort = mappedKey !== "golive_sort" ? true : false;
      render();
    });
  });

  render();
}
