<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eHub Closed Won Dashboard</title>
<style>
  :root{--blue:#3694FC;--charcoal:#21212B;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f4f5f7;color:var(--charcoal);}
  #gate{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:1000;}
  #gate .card{background:#fff;padding:40px;border-radius:12px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);width:340px;}
  #gate h2{margin:0 0 6px;color:var(--charcoal);}
  #gate .logo{font-weight:800;font-size:26px;color:var(--blue);letter-spacing:-1px;margin-bottom:16px;}
  #gate input{width:100%;padding:11px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin:12px 0;}
  #gate button{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
  #gate .err{color:var(--coral);font-size:13px;height:16px;}
  #app{display:none;padding:20px 26px 60px;}
  header .logo{font-weight:800;font-size:22px;color:var(--blue);letter-spacing:-1px;}
  header h1{font-size:20px;margin:2px 0 0;}
  .banner{background:#fff8d6;border:1px solid #f0e19a;color:#7a6a1a;padding:10px 14px;border-radius:8px;font-size:13px;margin:14px 0;}
  .kpis{display:flex;gap:14px;flex-wrap:wrap;margin:14px 0;}
  .kpi{background:#fff;border-radius:10px;padding:14px 18px;min-width:110px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .kpi .n{font-size:26px;font-weight:700;}
  .kpi .l{font-size:12px;color:#666;text-transform:uppercase;letter-spacing:.5px;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .filters input,.filters select{padding:8px 10px;border:1px solid #ccc;border-radius:8px;font-size:13px;}
  .count{font-size:13px;color:#666;margin:6px 0;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  th,td{padding:9px 11px;text-align:left;font-size:13px;border-bottom:1px solid #eee;}
  th{background:var(--charcoal);color:#fff;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;}
  th:hover{background:#33333f;}
  tr.grp td{background:#eef3fb;font-weight:700;font-size:13px;color:var(--charcoal);}
  td a{color:var(--blue);text-decoration:none;}
  td a:hover{text-decoration:underline;}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff;}
  .int{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:600;color:#fff;margin-right:3px;}
  .int.sr{background:#F5871F;}.int.tk{background:#8B5CF6;}.int.amc{background:#2FA84F;}
  .gl{font-weight:600;}
  .gl.live{color:#2FA84F;}.gl.delayed{color:var(--coral);}.gl.eta{color:var(--blue);}.gl.tbd{color:#999;}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <div class="logo">NiCE</div>
    <h2>eHub Dashboard</h2>
    <input id="pw" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="err" id="err"></div>
    <button onclick="checkPw()">Access Dashboard</button>
  </div>
</div>

<div id="app">
  <header>
    <div class="logo">NiCE</div>
    <h1>eHub Closed Won Dashboard</h1>
  </header>
  <div class="banner">Dashboard generated on August 6, 2026 — data reflects Salesforce as of that date.</div>
  <div class="kpis">
    <div class="kpi"><div class="n">52</div><div class="l">Total Deals</div></div>
    <div class="kpi"><div class="n" style="color:#2FA84F">31</div><div class="l">Live</div></div>
    <div class="kpi"><div class="n" style="color:#FF5B8A">10</div><div class="l">Delayed</div></div>
    <div class="kpi"><div class="n" style="color:#3694FC">9</div><div class="l">ETA</div></div>
    <div class="kpi"><div class="n" style="color:#999">2</div><div class="l">TBD</div></div>
  </div>
  <div class="filters">
    <input id="f-search" placeholder="Search account / deal name" oninput="render()">
    <select id="f-region" onchange="render()"></select>
    <select id="f-hub" onchange="render()"></select>
    <select id="f-gl" onchange="render()"></select>
    <select id="f-int" onchange="render()"></select>
  </div>
  <div class="count" id="count"></div>
  <table>
    <thead><tr>
      <th onclick="sortBy('account')">Account</th>
      <th onclick="sortBy('name')">Deal Name</th>
      <th onclick="sortBy('type')">Type</th>
      <th onclick="sortBy('integration')">Integration</th>
      <th onclick="sortBy('hub')">Hub</th>
      <th onclick="sortBy('close')">Close Date</th>
      <th onclick="sortBy('agents')">Agents</th>
      <th onclick="sortBy('region')">Region</th>
      <th onclick="sortBy('glSort')">Go-Live</th>
      <th onclick="sortBy('owner')">Owner</th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const SF="https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

async function checkPw(){
  const v=document.getElementById('pw').value;
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));
  const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hex===STORED_HASH){sessionStorage.setItem('ehub_ok','1');show();}
  else{document.getElementById('err').textContent='Incorrect password';}
}
function show(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';init();}
if(sessionStorage.getItem('ehub_ok')==='1'){window.addEventListener('DOMContentLoaded',show);}

let sortState=null; // {key, dir}
const glOrder={Live:0, Delayed:1, ETA:1, TBD:3};

function glSortValue(d){
  // Live first, TBD last; Delayed+ETA merged by date in the middle
  if(d.glStatus==='Live') return '0';
  if(d.glStatus==='TBD') return '3';
  return '1_'+(d.glDate||'9999-99-99');
}
function esc(s){return (s==null?'':(''+s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function intHtml(arr){
  const m={SmartReach:'sr',Ticketing:'tk',AMC:'amc'};
  return arr.map(x=>`<span class="int ${m[x]}">${x}</span>`).join('');
}
function glHtml(d){
  const cls=d.glStatus.toLowerCase();
  let t=d.glStatus;
  if((d.glStatus==='ETA'||d.glStatus==='Delayed')&&d.glDate) t+=' '+d.glDate;
  return `<span class="gl ${cls}">${t}</span>`;
}
function hubHtml(d){return `<span class="badge" style="background:${d.hubColor}">${d.hub}</span>`;}

function init(){
  // populate filters
  const reg=[...new Set(DEALS.map(d=>d.region).filter(Boolean))].sort();
  const hub=[...new Set(DEALS.map(d=>d.hub))].sort();
  const gl=['Live','Delayed','ETA','TBD'];
  const ints=[...new Set(DEALS.flatMap(d=>d.integration))].sort();
  fill('f-region',reg,'All Regions');
  fill('f-hub',hub,'All Hub Types');
  fill('f-gl',gl,'All Go-Live');
  fill('f-int',ints,'All Integrations');
  render();
}
function fill(id,arr,label){
  const s=document.getElementById(id);
  s.innerHTML=`<option value="">${label}</option>`+arr.map(x=>`<option>${x}</option>`).join('');
}
function sortBy(key){
  if(sortState&&sortState.key===key){
    if(sortState.dir==='asc')sortState.dir='desc';
    else sortState=null; // third click -> grouped
  } else sortState={key,dir:'asc'};
  render();
}
function filtered(){
  const q=document.getElementById('f-search').value.toLowerCase();
  const reg=document.getElementById('f-region').value;
  const hub=document.getElementById('f-hub').value;
  const gl=document.getElementById('f-gl').value;
  const it=document.getElementById('f-int').value;
  return DEALS.filter(d=>{
    if(q&&!(d.account.toLowerCase().includes(q)||d.name.toLowerCase().includes(q)))return false;
    if(reg&&d.region!==reg)return false;
    if(hub&&d.hub!==hub)return false;
    if(gl&&d.glStatus!==gl)return false;
    if(it&&!d.integration.includes(it))return false;
    return true;
  });
}
function rowHtml(d,showAccount){
  return `<tr>
    <td>${showAccount?esc(d.account):''}</td>
    <td><a href="${SF}${d.id}/view" target="_blank">${esc(d.name)}</a></td>
    <td>${esc(d.type)}</td>
    <td>${intHtml(d.integration)}</td>
    <td>${hubHtml(d)}</td>
    <td>${esc(d.close)}</td>
    <td>${d.agents!==''?esc(d.agents):''}</td>
    <td>${esc(d.region)}</td>
    <td>${glHtml(d)}</td>
    <td>${esc(d.owner)}</td>
  </tr>`;
}
function render(){
  const rows=filtered();
  const tb=document.getElementById('tbody');
  let html='';
  if(sortState){
    const k=sortState.key,dir=sortState.dir==='asc'?1:-1;
    const val=d=>{
      if(k==='glSort')return glSortValue(d);
      if(k==='integration')return d.integration.join(',');
      if(k==='agents')return d.agents===''?-1:d.agents;
      return (d[k]==null?'':d[k]);
    };
    rows.sort((a,b)=>{const va=val(a),vb=val(b);return va<vb?-dir:va>vb?dir:0;});
    html=rows.map(d=>rowHtml(d,true)).join('');
    if(!rows.length)html=`<tr><td colspan="10" style="text-align:center;color:#999;padding:20px">No deals match filters</td></tr>`;
  } else {
    // grouped
    const byGroup={};
    rows.forEach(d=>{(byGroup[d.group]=byGroup[d.group]||[]).push(d);});
    const order=GROUP_ORDER.filter(g=>byGroup[g]);
    if(!order.length)html=`<tr><td colspan="10" style="text-align:center;color:#999;padding:20px">No deals match filters</td></tr>`;
    order.forEach(g=>{
      const items=byGroup[g].sort((a,b)=>(a.close||'')<(b.close||'')?-1:1);
      html+=`<tr class="grp"><td colspan="10">${esc(g)} · ${items.length} deal${items.length>1?'s':''}</td></tr>`;
      html+=items.map(d=>rowHtml(d,false)).join('');
    });
  }
  tb.innerHTML=html;
  const acctCount=new Set(rows.map(d=>d.group)).size;
  document.getElementById('count').textContent=`${rows.length} deals · ${acctCount} accounts`;
}
