const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw').value;
  const hash = await sha256Hex(val);
  if (hash === STORED_HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}

// flatten
let ALL_DEALS = [];
GROUPS.forEach(g => g.deals.forEach(d => ALL_DEALS.push(Object.assign({}, d, {groupName: g.name}))));

// populate filter options
function uniqueSorted(arr) { return Array.from(new Set(arr.filter(x => x))).sort(); }
const regions = uniqueSorted(ALL_DEALS.map(d => d.region));
const hubs = uniqueSorted(ALL_DEALS.map(d => d.hub));
const golives = ['Live','Delayed','ETA','TBD'];
const integrations = uniqueSorted(ALL_DEALS.flatMap(d => d.integration));

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}
fillSelect('fRegion', regions);
fillSelect('fHub', hubs);
fillSelect('fGoLive', golives);
fillSelect('fIntegration', integrations);

function hubBadgeClass(hub) {
  if (hub === 'Offline') return 'hub-offline';
  if (hub === 'RT + Offline') return 'hub-rtoffline';
  return 'hub-rt';
}
function integBadgeClass(i) {
  if (i === 'SmartReach') return 'badge-smartreach';
  if (i === 'Ticketing') return 'badge-ticketing';
  if (i === 'AMC') return 'badge-amc';
  return '';
}
function goLiveClass(status) {
  if (status === 'Live') return 'golive-live';
  if (status === 'Delayed') return 'golive-delayed';
  if (status === 'ETA') return 'golive-eta';
  return 'golive-tbd';
}
function goLiveLabel(d) {
  if (d.goLiveStatus === 'Live') return 'Live';
  if (d.goLiveStatus === 'TBD') return 'TBD';
  return d.goLiveStatus + ' ' + d.goLiveDate;
}
function goLiveSortValue(d) {
  if (d.goLiveStatus === 'Live') return -8640000000000000; // earliest
  if (d.goLiveStatus === 'TBD') return 8640000000000000; // latest
  return new Date(d.goLiveDate).getTime();
}

function sfLink(id) {
  return 'https://niceincontact.lightning.force.com/lightning/r/Opportunity/' + id + '/view';
}

let sortState = { col: null, dir: 1 };

function getFiltered() {
  const search = document.getElementById('fSearch').value.trim().toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const goLive = document.getElementById('fGoLive').value;
  const integ = document.getElementById('fIntegration').value;

  return ALL_DEALS.filter(d => {
    if (search && !(d.account.toLowerCase().includes(search) || d.dealName.toLowerCase().includes(search))) return false;
    if (region && d.region !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (goLive && d.goLiveStatus !== goLive) return false;
    if (integ && !d.integration.includes(integ)) return false;
    return true;
  });
}

function renderGrouped(filtered) {
  const filteredIds = new Set(filtered.map(d => d.id));
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let shown = 0;
  GROUPS.forEach(g => {
    const groupDeals = g.deals.filter(d => filteredIds.has(d.id));
    if (groupDeals.length === 0) return;
    const trH = document.createElement('tr');
    trH.className = 'group-row';
    trH.innerHTML = `<td colspan="10">${escapeHtml(g.name)} — ${groupDeals.length} deal${groupDeals.length===1?'':'s'}</td>`;
    tbody.appendChild(trH);
    groupDeals.forEach(d => { tbody.appendChild(renderRow(d, true)); shown++; });
  });
  if (shown === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="10" style="text-align:center;padding:24px;color:#999;">No deals match the current filters.</td>';
    tbody.appendChild(tr);
  }
  document.getElementById('resultCount').textContent = shown + ' deal' + (shown===1?'':'s') + ' shown';
}

function renderFlat(filtered) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  if (filtered.length === 0) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td colspan="10" style="text-align:center;padding:24px;color:#999;">No deals match the current filters.</td>';
    tbody.appendChild(tr);
  } else {
    filtered.forEach(d => tbody.appendChild(renderRow(d, false)));
  }
  document.getElementById('resultCount').textContent = filtered.length + ' deal' + (filtered.length===1?'':'s') + ' shown';
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderRow(d, showAccount) {
  const tr = document.createElement('tr');
  const integHtml = d.integration.length
    ? d.integration.map(i => `<span class="badge ${integBadgeClass(i)}">${i}</span>`).join('')
    : '<span class="muted">—</span>';
  tr.innerHTML = `
    <td>${escapeHtml(d.account)}</td>
    <td><a class="deal-link" href="${sfLink(d.id)}" target="_blank" rel="noopener">${escapeHtml(d.dealName)}</a></td>
    <td>${escapeHtml(d.type || '—')}</td>
    <td>${integHtml}</td>
    <td><span class="badge ${hubBadgeClass(d.hub)}">${d.hub}</span></td>
    <td>${escapeHtml(d.closeDate)}</td>
    <td>${d.agents != null ? d.agents : '—'}</td>
    <td>${escapeHtml(d.region || '—')}</td>
    <td><span class="${goLiveClass(d.goLiveStatus)}">${goLiveLabel(d)}</span></td>
    <td>${escapeHtml(d.owner)}</td>
  `;
  return tr;
}

function updateKpis() {
  const counts = { Live: 0, Delayed: 0, ETA: 0, TBD: 0 };
  ALL_DEALS.forEach(d => counts[d.goLiveStatus]++);
  document.getElementById('kpiTotal').textContent = ALL_DEALS.length;
  document.getElementById('kpiLive').textContent = counts.Live;
  document.getElementById('kpiDelayed').textContent = counts.Delayed;
  document.getElementById('kpiEta').textContent = counts.ETA;
  document.getElementById('kpiTbd').textContent = counts.TBD;
}

function sortValueFor(d, col) {
  switch(col) {
    case 'account': return d.account.toLowerCase();
    case 'dealName': return d.dealName.toLowerCase();
    case 'type': return (d.type||'').toLowerCase();
    case 'integration': return d.integration.join(',').toLowerCase();
    case 'hub': return d.hub.toLowerCase();
    case 'closeDate': return d.closeDate;
    case 'agents': return d.agents == null ? -1 : d.agents;
    case 'region': return (d.region||'').toLowerCase();
    case 'goLive': return goLiveSortValue(d);
    case 'owner': return d.owner.toLowerCase();
    default: return '';
  }
}

function refresh() {
  const filtered = getFiltered();
  updateKpis();
  if (sortState.col) {
    const sorted = filtered.slice().sort((a,b) => {
      const av = sortValueFor(a, sortState.col), bv = sortValueFor(b, sortState.col);
      if (av < bv) return -1 * sortState.dir;
      if (av > bv) return 1 * sortState.dir;
      return 0;
    });
    renderFlat(sorted);
  } else {
    renderGrouped(filtered);
  }
  document.querySelectorAll('thead th').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.col === sortState.col) {
      arrow.textContent = sortState.dir === 1 ? '▲' : '▼';
    } else {
      arrow.textContent = '';
    }
  });
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortState.col !== col) {
      sortState = { col: col, dir: 1 };
    } else if (sortState.dir === 1) {
      sortState.dir = -1;
    } else {
      sortState = { col: null, dir: 1 };
    }
    refresh();
  });
});

['fSearch','fRegion','fHub','fGoLive','fIntegration'].forEach(id => {
  document.getElementById(id).addEventListener('input', refresh);
  document.getElementById(id).addEventListener('change', refresh);
});

refresh();
</script>
</body>
</html>
