  tr.group-header td {

  .badge-ticketing { background:#9B51E0; }
  .badge-amc { background:#2DB06B; }

  .hub-offline { background: var(--teal); color:#063; }

const PWHASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";
const TODAY_STR = "2026-10-16";

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const pw = document.getElementById('gate-pw').value;
  const hash = await sha256(pw);
  if (hash === PWHASH) {
    try { sessionStorage.setItem('ehub_unlocked', '1'); } catch(e) {}
    document.getElementById('gate-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect password';
  }
}

document.getElementById('gate-pw').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });

(function tryAutoUnlock() {
  try {
    if (sessionStorage.getItem('ehub_unlocked') === '1') {
      document.getElementById('gate-overlay').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      window.addEventListener('DOMContentLoaded', init);
      if (document.readyState !== 'loading') init();
    }
  } catch(e) {}
})();

let sortKey = null, sortDir = 1;
function setSort(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  render();
}

function golivesortval(d) {
  // Live first, then date-ordered Delayed+ETA merged, then TBD last
  if (d.goLiveStatus === 'Live') return [0, ''];
  if (d.goLiveStatus === 'TBD') return [2, ''];
  return [1, d.goLiveDate || '9999-99-99'];
}

function init() {
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.hub))].sort();
  const statuses = [...new Set(DEALS.map(d => d.goLiveStatus))].sort();
  const integs = ['SmartReach','Ticketing','AMC'];

  const fill = (id, arr) => {
    const sel = document.getElementById(id);
    arr.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  };
  fill('f-region', regions);
  fill('f-hub', hubs);
  fill('f-status', statuses);
  fill('f-integ', integs);

  document.getElementById('banner').textContent =
    `Dashboard generated on ${TODAY_STR} — data reflects Salesforce as of that date.`;

  renderKpis();
  render();
}

function renderKpis() {
  const total = DEALS.length;
  const counts = { Live:0, Delayed:0, ETA:0, TBD:0 };
  DEALS.forEach(d => { if (counts[d.goLiveStatus] !== undefined) counts[d.goLiveStatus]++; });
  const kpiDefs = [
    ['Total Deals', total],
    ['Live', counts.Live],
    ['Delayed', counts.Delayed],
    ['ETA', counts.ETA],
    ['TBD', counts.TBD],
  ];
  document.getElementById('kpis').innerHTML = kpiDefs.map(([label, val]) =>
    `<div class="kpi"><div class="label">${label}</div><div class="value">${val}</div></div>`
  ).join('');
}

function hubClass(hub) {
  if (hub === 'RT + Offline') return 'hub-both';
  if (hub === 'Offline') return 'hub-offline';
  return 'hub-rt';
}
function statusClass(s) {
  if (s === 'Live') return 'status-live';
  if (s === 'Delayed') return 'status-delayed';
  if (s === 'ETA') return 'status-eta';
  return 'status-tbd';
}

function matchesFilters(d) {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const region = document.getElementById('f-region').value;
  const hub = document.getElementById('f-hub').value;
  const status = document.getElementById('f-status').value;
  const integ = document.getElementById('f-integ').value;
  if (q && !((d.account||'').toLowerCase().includes(q) || (d.dealName||'').toLowerCase().includes(q))) return false;
  if (region && d.region !== region) return false;
  if (hub && d.hub !== hub) return false;
  if (status && d.goLiveStatus !== status) return false;
  if (integ && !d.integrations.includes(integ)) return false;
  return true;
}

function dealRow(d) {
  const badges = d.integrations.map(i =>
    `<span class="badge badge-${i.toLowerCase()}">${i}</span>`).join('');
  const goLiveLabel = d.goLiveStatus === 'Live' ? 'Live'
    : d.goLiveStatus === 'TBD' ? 'TBD'

  return `<tr>
    <td>${d.account || ''}</td>
    <td><a class="deal-link" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view">${d.dealName || ''}</a></td>

    <td>${d.closeDate || ''}</td>
    <td>${d.agents != null ? d.agents : ''}</td>
    <td>${d.region || ''}</td>
    <td><span class="status-pill ${statusClass(d.goLiveStatus)}">${goLiveLabel}</span></td>
    <td>${d.owner || ''}</td>
  </tr>`;
}

function render() {
  const byId = {}; DEALS.forEach(d => byId[d.id] = d);
  const tbody = document.getElementById('tbody');
  let rows = [];
  let anyMatch = false;

  GROUPS.forEach(g => {
    let items = g.deals.map(id => byId[id]).filter(d => d && matchesFilters(d));
    if (items.length === 0) return;
    anyMatch = true;

    if (sortKey) {
      items = items.slice().sort((a,b) => {
        let av, bv;
        if (sortKey === 'golive') { av = golivesortval(a); bv = golivesortval(b);
          if (av[0] !== bv[0]) return (av[0]-bv[0]) * sortDir;
          return av[1] < bv[1] ? -1*sortDir : av[1] > bv[1] ? 1*sortDir : 0;
        }
        if (sortKey === 'integrations') { av = a.integrations.join(','); bv = b.integrations.join(','); }
        else { av = a[sortKey]; bv = b[sortKey]; }
        if (av == null) av = '';
        if (bv == null) bv = '';
        if (av < bv) return -1 * sortDir;
        if (av > bv) return 1 * sortDir;
        return 0;
      });
    } else {
      items.sort((a,b) => (b.closeDate||'').localeCompare(a.closeDate||''));
    }

    rows.push(`<tr class="group-header"><td colspan="10">${g.name} (${items.length} deal${items.length===1?'':'s'})</td></tr>`);
    items.forEach(d => rows.push(dealRow(d)));
  });

  if (!anyMatch) {
    rows.push('<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>');
  }
  tbody.innerHTML = rows.join('');
}
</script>
</body>
</html>
