<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Closed Won Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#3694FC;--charcoal:#21212B;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:#f4f6fa;color:var(--charcoal);}
/* ---- password gate ---- */
#gate{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:1000;}
#gate .card{background:#fff;border-radius:16px;padding:40px 44px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);}
#gate .logo{font-size:30px;font-weight:800;margin-bottom:4px;}
#gate .logo span{color:var(--blue);}
#gate h2{font-size:15px;font-weight:600;color:#5b5b6b;margin-bottom:22px;}
#gate input{width:100%;padding:11px 14px;border:1.5px solid #d6d9e0;border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:14px;}
#gate input:focus{outline:none;border-color:var(--blue);}
#gate button{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;}
#gate button:hover{background:#1f7ce8;}
#gate .err{color:var(--coral);font-size:12.5px;margin-top:10px;display:none;font-weight:600;}
/* ---- layout ---- */
#app{display:none;max-width:1500px;margin:0 auto;padding:24px 28px 60px;}
header.top{display:flex;align-items:baseline;gap:14px;margin-bottom:14px;}
header.top .logo{font-size:26px;font-weight:800;}
header.top .logo span{color:var(--blue);}
header.top h1{font-size:19px;font-weight:700;}
.banner{background:#fef9c3;border:1px solid #fde047;color:#854d0e;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:600;margin-bottom:18px;}
/* ---- KPI ---- */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 3px rgba(33,33,43,.08);}
.kpi .num{font-size:28px;font-weight:800;line-height:1.1;}
.kpi .lbl{font-size:12px;font-weight:600;color:#7a7a88;text-transform:uppercase;letter-spacing:.05em;margin-top:4px;}
.kpi.total .num{color:var(--blue);} .kpi.live .num{color:#16a34a;}
.kpi.delayed .num{color:#e11d48;} .kpi.eta .num{color:#d97706;} .kpi.tbd .num{color:#6b7280;}
/* ---- filters ---- */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #d6d9e0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;}
.filters input{flex:1;min-width:220px;}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--blue);}
#count{font-size:12.5px;color:#7a7a88;font-weight:600;margin-left:auto;}
/* ---- table ---- */
.tablewrap{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(33,33,43,.08);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1150px;}
thead th{position:sticky;top:0;background:#fff;z-index:5;text-align:left;padding:12px 14px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7a7a88;border-bottom:2px solid #e8eaf0;cursor:pointer;user-select:none;white-space:nowrap;}
thead th:hover{color:var(--blue);}
thead th .arrow{color:var(--blue);font-size:10px;}
tbody td{padding:11px 14px;border-bottom:1px solid #f0f1f5;vertical-align:middle;}
tr.grp td{background:var(--charcoal);color:#fff;font-weight:700;font-size:13px;padding:10px 14px;}
tr.grp .cnt{display:inline-block;background:rgba(255,255,255,.16);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;margin-left:10px;}
tbody tr.deal:hover{background:#f7faff;}
td.acct{font-weight:600;font-size:12.5px;color:#5b5b6b;max-width:180px;}
a.deal-link{color:var(--blue);font-weight:600;text-decoration:none;}
a.deal-link:hover{text-decoration:underline;}
td.name{max-width:340px;}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.hub-rt{background:var(--blue);color:#fff;}
.hub-off{background:var(--teal);color:#0b3f37;}
.hub-both{background:var(--indigo);color:#fff;}
.ib{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;margin:1px 3px 1px 0;white-space:nowrap;}
.ib-sr{background:#fff7ed;border:1px solid #fdba74;color:#c2410c;}
.ib-tk{background:#f5f3ff;border:1px solid #c4b5fd;color:#6d28d9;}
.ib-amc{background:#ecfdf5;border:1px solid #6ee7b7;color:#047857;}
.gl{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;}
.gl-Live{background:#dcfce7;color:#15803d;}
.gl-Delayed{background:#ffe4e6;color:#be123c;}
.gl-ETA{background:#fef3c7;color:#b45309;}
.gl-TBD{background:#eef0f4;color:#6b7280;}
td.type{font-size:12px;color:#5b5b6b;max-width:150px;}
td.nowrap{white-space:nowrap;}
.empty{text-align:center;padding:40px;color:#9aa0ad;font-weight:600;}
</style>
</head>

  </div>
</div>

const HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256(t){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function checkPw(){
  const v = document.getElementById("pw").value;
  if(await sha256(v) === HASH){
    sessionStorage.setItem("ehub_auth","1");
    unlock();
  } else {
    document.getElementById("pwerr").style.display = "block";
  }
}
function unlock(){
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
}
if(sessionStorage.getItem("ehub_auth") === "1") unlock();

let sortCol = null, sortDir = 1;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function initFilters(){
  const opts = (id, vals) => {
    const sel = document.getElementById(id);
    vals.forEach(v => { const o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
  };
  opts("f-region", [...new Set(DEALS.map(x=>x.region))].sort());
  opts("f-hub", ["Real-Time","Offline","RT + Offline"].filter(h=>DEALS.some(x=>x.hub===h)));
  opts("f-golive", ["Live","Delayed","ETA","TBD"]);
  const integs = [...new Set(DEALS.flatMap(x=>x.integ))].sort();
  opts("f-integ", integs.concat(["None"]));
}

function filtered(){
  const q = document.getElementById("f-search").value.trim().toLowerCase();
  const r = document.getElementById("f-region").value;
  const h = document.getElementById("f-hub").value;
  const g = document.getElementById("f-golive").value;
  const i = document.getElementById("f-integ").value;
  return DEALS.filter(x=>{
    if(q && !(x.group.toLowerCase().includes(q) || x.acct.toLowerCase().includes(q) || x.name.toLowerCase().includes(q))) return false;
    if(r && x.region !== r) return false;
    if(h && x.hub !== h) return false;
    if(g && x.gcat !== g) return false;
    if(i === "None"){ if(x.integ.length) return false; }
    else if(i && !x.integ.includes(i)) return false;
    return true;
  });
}

function hubPill(h){
  const cls = h === "RT + Offline" ? "hub-both" : (h === "Offline" ? "hub-off" : "hub-rt");
  return '<span class="pill '+cls+'">'+esc(h)+'</span>';
}
function integBadges(list){
  if(!list.length) return "";
  return list.map(x=>{
    const cls = x === "SmartReach" ? "ib-sr" : (x === "Ticketing" ? "ib-tk" : "ib-amc");
    return '<span class="ib '+cls+'">'+esc(x)+'</span>';
  }).join("");
}
function glBadge(x){ return '<span class="gl gl-'+x.gcat+'">'+esc(x.golive)+'</span>'; }

function dealRow(x, showAcct){
  return '<tr class="deal">'+
    '<td class="acct">'+(showAcct ? esc(x.group) : "")+'</td>'+
    '<td class="name"><a class="deal-link" target="_blank" rel="noopener" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+x.id+'/view">'+esc(x.name)+'</a></td>'+
    '<td class="type">'+esc(x.type)+'</td>'+
    '<td>'+integBadges(x.integ)+'</td>'+
    '<td>'+hubPill(x.hub)+'</td>'+
    '<td class="nowrap">'+esc(x.closeLabel)+'</td>'+
    '<td class="nowrap">'+esc(x.agentsLabel)+'</td>'+
    '<td class="nowrap">'+esc(x.region)+'</td>'+
    '<td class="nowrap">'+glBadge(x)+'</td>'+
    '<td class="nowrap">'+esc(x.owner)+'</td>'+
  '</tr>';
}

function render(){
  const rows = filtered();
  // KPIs reflect current filter
  const c = {Live:0, Delayed:0, ETA:0, TBD:0};
  rows.forEach(x=>c[x.gcat]++);
  document.getElementById("k-total").textContent = rows.length;
  document.getElementById("k-live").textContent = c.Live;
  document.getElementById("k-delayed").textContent = c.Delayed;
  document.getElementById("k-eta").textContent = c.ETA;
  document.getElementById("k-tbd").textContent = c.TBD;

  document.querySelectorAll("thead .arrow").forEach(a=>a.textContent="");
  const tb = document.getElementById("tbody");
  if(!rows.length){
    tb.innerHTML = '<tr><td colspan="10" class="empty">No deals match the current filters.</td></tr>';
    document.getElementById("count").textContent = "0 deals";
    return;
  }
  let html = "";
  if(sortCol){
    document.getElementById("a-"+sortCol).textContent = sortDir === 1 ? " ▲" : " ▼";
    const sorted = [...rows].sort((a,b)=>{
      let va = a[sortCol], vb = b[sortCol];
      if(sortCol === "agents"){ va = va == null ? -1 : va; vb = vb == null ? -1 : vb; return (va - vb) * sortDir; }
      if(sortCol === "integ"){ va = va.join(","); vb = vb.join(","); }
      return String(va).localeCompare(String(vb)) * sortDir;
    });
    sorted.forEach(x=>{ html += dealRow(x, true); });
  } else {
    // group by top parent, groups ordered by most recent close desc
    const groups = {};
    rows.forEach(x=>{ (groups[x.group] = groups[x.group] || []).push(x); });
    const names = Object.keys(groups).sort((a,b)=>{
      const ma = Math.max(...groups[a].map(x=>Date.parse(x.close)));
      const mb = Math.max(...groups[b].map(x=>Date.parse(x.close)));
      return mb - ma;
    });
    names.forEach(n=>{
      const g = groups[n].sort((a,b)=>b.close.localeCompare(a.close));
      html += '<tr class="grp"><td colspan="10">'+esc(n)+'<span class="cnt">'+g.length+(g.length===1?" deal":" deals")+'</span></td></tr>';
      g.forEach(x=>{ html += dealRow(x, false); });
    });
  }
  tb.innerHTML = html;
  const nAcc = new Set(rows.map(x=>x.group)).size;
  document.getElementById("count").textContent = rows.length + (rows.length===1?" deal":" deals") + " · " + nAcc + (nAcc===1?" account":" accounts");
}

document.querySelectorAll("thead th").forEach(th=>{
  th.addEventListener("click", ()=>{
    const col = th.dataset.col;
    if(sortCol === col){
      if(sortDir === 1) sortDir = -1;
      else { sortCol = null; sortDir = 1; }   // third click → back to grouped
    } else { sortCol = col; sortDir = 1; }
    render();
  });
});

initFilters();
render();
