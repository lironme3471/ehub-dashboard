const HASH = '0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621';
const GEN_DATE = '2026-07-20';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPw(){
  const pw = document.getElementById('gate-pw').value;
  const h = await sha256(pw);
  if(h === HASH){
    sessionStorage.setItem('ehub_auth','1');
    document.getElementById('gate-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('gate-error').style.display='block';
  }
}
window.onload = function(){
  if(sessionStorage.getItem('ehub_auth')==='1'){
    document.getElementById('gate-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  }
};

  {id:'0063n0000120KE3AAM',parent:'NATIONAL GRID',account:'NATIONAL GRID USA SERVICE COMPANY INC',name:'National Grid Attached CXone OPEN CISCO Analytics Quality 2000 Agents Attached Oppty 3 of 3',type:'New Logo',integration:[],hub:'Real-Time',closeDate:'2023-12-29',agents:2000,region:'Americas',golive:'Live',goliveStatus:'live',owner:'Dave Smith'},
];

let sortCol = 'closeDate', sortDir = -1;

function sortBy(col){
  if(sortCol===col) sortDir*=-1; else {sortCol=col;sortDir=-1;}
  render();
}

function fmtDate(d){
  if(!d) return '—';
  const [y,m,day]=d.split('-');
  return `${m}/${day}/${y}`;
}

function integBadges(arr){
  return arr.map(i=>{
    if(i==='SmartReach') return '<span class="badge badge-sr">SmartReach</span>';
    if(i==='Ticketing') return '<span class="badge badge-tk">Ticketing</span>';
    if(i==='AMC') return '<span class="badge badge-amc">AMC</span>';
    return '';
  }).join('');
}

function hubCell(h){
  if(h==='RT + Offline') return '<span class="hub-both">RT + Offline</span>';
  if(h==='Offline') return '<span class="hub-off">Offline</span>';
  return '<span class="hub-rt">Real-Time</span>';
}

function glCell(d){
  const s=d.goliveStatus, v=d.golive;
  if(s==='live') return '<span class="gl-live">✓ Live</span>';
  if(s==='delayed') return `<span class="gl-delayed">Delayed ${v.replace('Delayed ','')}</span>`;
  if(s==='eta') return `<span class="gl-eta">ETA ${v.replace('ETA ','')}</span>`;
  return '<span class="gl-tbd">TBD</span>';
}

function render(){
  const search=(document.getElementById('f-search').value||'').toLowerCase();
  const fReg=document.getElementById('f-region').value;
  const fHub=document.getElementById('f-hub').value;
  const fGL=document.getElementById('f-golive').value;
  const fInt=document.getElementById('f-integ').value;

  let filtered=DEALS.filter(d=>{
    if(search && !d.account.toLowerCase().includes(search) && !d.name.toLowerCase().includes(search)) return false;
    if(fReg && d.region!==fReg) return false;
    if(fHub && d.hub!==fHub) return false;
    if(fGL && d.goliveStatus!==fGL) return false;
    if(fInt && !d.integration.includes(fInt)) return false;
    return true;
  });

  // Update KPIs
  document.getElementById('kpi-total').textContent=filtered.length;
  document.getElementById('kpi-live').textContent=filtered.filter(d=>d.goliveStatus==='live').length;
  document.getElementById('kpi-delayed').textContent=filtered.filter(d=>d.goliveStatus==='delayed').length;
  document.getElementById('kpi-eta').textContent=filtered.filter(d=>d.goliveStatus==='eta').length;
  document.getElementById('kpi-tbd').textContent=filtered.filter(d=>d.goliveStatus==='tbd').length;

  // Update sort header indicators
  document.querySelectorAll('th').forEach(th=>th.classList.remove('sorted'));
  const thEl=document.getElementById('th-'+sortCol);
  if(thEl) thEl.classList.add('sorted');

  const tbody=document.getElementById('tbody');
  if(filtered.length===0){
    tbody.innerHTML='';
    document.getElementById('no-results').style.display='block';
    return;
  }
  document.getElementById('no-results').style.display='none';

  // Group by parent
  const groups={};
  filtered.forEach(d=>{
    const g=d.parent||d.account;
    if(!groups[g]) groups[g]=[];
    groups[g].push(d);
  });

  // Sort within groups by closeDate desc
  Object.values(groups).forEach(arr=>arr.sort((a,b)=>b.closeDate.localeCompare(a.closeDate)));

  // Sort groups by most recent closeDate desc
  const groupKeys=Object.keys(groups).sort((a,b)=>{
    const maxA=groups[a][0].closeDate;
    const maxB=groups[b][0].closeDate;
    return maxB.localeCompare(maxA);
  });

  // If sorting by something other than closeDate, apply sort across all records
  if(sortCol!=='closeDate'){
    const all=[...filtered].sort((a,b)=>{
      let av=a[sortCol], bv=b[sortCol];
      if(av===null||av===undefined||av==='') av='';
      if(bv===null||bv===undefined||bv==='') bv='';
      if(typeof av==='number'||typeof bv==='number'){
        return sortDir*((av||0)-(bv||0));
      }
      return sortDir*(String(av).localeCompare(String(bv)));
    });
    // Regroup after sort
    const groups2={};
    all.forEach(d=>{
      const g=d.parent||d.account;
      if(!groups2[g]) groups2[g]=[];
      groups2[g].push(d);
    });
    // Keep group order by first appearance in sorted list
    const seen=new Set(), groupOrder2=[];
    all.forEach(d=>{
      const g=d.parent||d.account;
      if(!seen.has(g)){seen.add(g);groupOrder2.push(g);}
    });
    let html='';
    groupOrder2.forEach(g=>{
      const arr=groups2[g];
      html+=`<tr class="group-row"><td colspan="10">${g} <span style="font-weight:400;color:#666;font-size:12px">(${arr.length} deal${arr.length>1?'s':''})</span></td></tr>`;
      arr.forEach(d=>{
        html+=rowHtml(d);
      });
    });
    tbody.innerHTML=html;
    return;
  }

  let html='';
  groupKeys.forEach(g=>{
    const arr=groups[g];
    html+=`<tr class="group-row"><td colspan="10">${g} <span style="font-weight:400;color:#666;font-size:12px">(${arr.length} deal${arr.length>1?'s':''})</span></td></tr>`;
    arr.forEach(d=>{html+=rowHtml(d);});
  });
  tbody.innerHTML=html;
}

function rowHtml(d){
  return `<tr class="data-row">
    <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.account}">${d.account}</td>
    <td style="max-width:260px"><a class="sf-link" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view" target="_blank">${d.name}</a></td>
    <td style="white-space:nowrap;font-size:12px">${d.type||'—'}</td>
    <td>${integBadges(d.integration)}</td>
    <td>${hubCell(d)}</td>
    <td style="white-space:nowrap">${fmtDate(d.closeDate)}</td>
    <td style="text-align:right">${d.agents!=null?d.agents.toLocaleString():'—'}</td>
    <td>${d.region||'—'}</td>
    <td style="white-space:nowrap">${glCell(d)}</td>
    <td style="white-space:nowrap;font-size:12px">${d.owner}</td>
  </tr>`;
}

function init(){
  document.getElementById('banner').textContent=`Dashboard generated on ${GEN_DATE} — data reflects Salesforce as of that date.`;
  render();
}
</script>
