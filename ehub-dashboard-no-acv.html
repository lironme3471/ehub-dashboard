<style>
  :root{
    --blue:#3694FC; --charcoal:#21212B; --indigo:#6100FF; --teal:#36EAD0; --coral:#FF5B8A;
  }
  *{box-sizing:border-box;}
  body{font-family:'Segoe UI',Arial,sans-serif;margin:0;background:#f4f5f7;color:var(--charcoal);}
  #gate{position:fixed;inset:0;background:rgba(33,33,43,.96);display:flex;align-items:center;justify-content:center;z-index:999;}
  #gate .card{background:#fff;border-radius:12px;padding:36px 40px;width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3);}
  #gate h2{margin-top:0;color:var(--charcoal);}
  #gate input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px;margin-bottom:12px;}
  #gate button{width:100%;padding:10px;border:none;border-radius:6px;background:var(--blue);color:#fff;font-size:15px;cursor:pointer;}
  #gate button:hover{background:#2a7fe0;}
  #gate .err{color:var(--coral);font-size:13px;height:16px;}
  #app{display:none;padding:20px 28px 60px;max-width:1500px;margin:0 auto;}
  .banner{background:#FFD54A;color:#21212B;padding:10px 16px;border-radius:8px;margin-bottom:16px;font-size:14px;font-weight:600;}
  h1{font-size:22px;margin:0 0 4px;}
  .sub{color:#666;font-size:13px;margin-bottom:20px;}
  .kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .kpi{background:#fff;border-radius:10px;padding:14px 20px;min-width:120px;box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .kpi .n{font-size:26px;font-weight:700;color:var(--blue);}
  .kpi .l{font-size:12px;color:#777;text-transform:uppercase;letter-spacing:.03em;}
  .kpi.live .n{color:#1fae5c;} .kpi.delayed .n{color:var(--coral);} .kpi.eta .n{color:var(--blue);} .kpi.tbd .n{color:#999;}
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .filters input,.filters select{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;}
  .filters input{flex:1;min-width:180px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:13px;}
  th{background:var(--charcoal);color:#fff;text-align:left;padding:10px 8px;cursor:pointer;white-space:nowrap;position:sticky;top:0;}
  th:hover{background:#33334a;}
  td{padding:8px;border-bottom:1px solid #eee;vertical-align:top;}
  tr.grouprow td{background:#eef2fb;font-weight:700;color:var(--charcoal);padding:8px;}
  tr.norows td{text-align:center;color:#999;padding:16px;}
  a.deallink{color:var(--blue);text-decoration:none;font-weight:600;}
  a.deallink:hover{text-decoration:underline;}
  .badge{display:inline-block;padding:2px 7px;border-radius:10px;font-size:11px;font-weight:700;color:#fff;margin-right:4px;margin-bottom:2px;}
  .b-smartreach{background:#FF8A3D;} .b-ticketing{background:#9B4DFF;} .b-amc{background:#2FBF71;}
  .hub-offline{background:var(--teal);color:#0b3b34;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;}
  .hub-rt{background:var(--blue);color:#fff;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;}
  .hub-both{background:var(--indigo);color:#fff;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;}
  .gl{padding:3px 9px;border-radius:10px;font-size:11px;font-weight:700;display:inline-block;}
  .gl-live{background:#1fae5c;color:#fff;} .gl-delayed{background:var(--coral);color:#fff;}
  .gl-eta{background:var(--blue);color:#fff;} .gl-tbd{background:#ccc;color:#444;}

</div>

<script>
const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621".slice(0,64);

async function sha256(msg){
  const enc = new TextEncoder().encode(msg);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkPw(){
  const val = document.getElementById('pw').value;
  const h = await sha256(val);
  if(h === PW_HASH){
    sessionStorage.setItem('ehub_ok','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('err').textContent = 'Incorrect password';
  }
}
document.getElementById('pw').addEventListener('keydown', e=>{ if(e.key==='Enter') checkPw(); });
if(sessionStorage.getItem('ehub_ok')==='1'){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  window.addEventListener('DOMContentLoaded', init);
}

const GEN_DATE = "2026-09-28";

function fmtDate(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split('-').map(Number);
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[m-1]} ${d}, ${y}`;
}
function glLabel(r){
  if(r.gl==='live') return {txt:'Live', cls:'gl-live'};
  if(r.gl==='delayed') return {txt:'Delayed → '+fmtDate(r.gld), cls:'gl-delayed'};
  if(r.gl==='eta') return {txt:'ETA '+fmtDate(r.gld), cls:'gl-eta'};
  return {txt:'TBD', cls:'gl-tbd'};
}
function hubBadge(hub){
  if(hub==='Offline') return `<span class="hub-offline">Offline</span>`;
  if(hub==='RT + Offline') return `<span class="hub-both">RT + Offline</span>`;
  return `<span class="hub-rt">Real-Time</span>`;
}
function integBadges(integ){
  if(!integ || !integ.length) return "";
  return integ.map(i=>{
    const cls = i==='SmartReach'?'b-smartreach':(i==='Ticketing'?'b-ticketing':'b-amc');
    return `<span class="badge ${cls}">${i}</span>`;
  }).join('');
}

let sortKey = null, sortDir = 1;

function glSortVal(r){
  // Live first, then Delayed+ETA merged by date ascending, then TBD last
  if(r.gl==='live') return [0, 0];
  if(r.gl==='tbd') return [2, 0];
  return [1, new Date(r.gld).getTime()];
}

function applyFilters(){
  const s = document.getElementById('fSearch').value.toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const gl = document.getElementById('fGL').value;
  const integ = document.getElementById('fInteg').value;
  return rows.filter(r=>{
    if(s && !(r.acct.toLowerCase().includes(s) || r.deal.toLowerCase().includes(s))) return false;
    if(region && r.region!==region) return false;
    if(hub && r.hub!==hub) return false;
    if(gl && r.gl!==gl) return false;
    if(integ && !(r.integ||[]).includes(integ)) return false;
    return true;
  });
}

function groupAndSort(list){
  // group by top-parent (grp), order groups by most recent close date desc
  const groups = {};
  list.forEach(r=>{
    const key = r.grp || r.acct;
    if(!groups[key]) groups[key] = [];
    groups[key].push(r);
  });
  let groupArr = Object.keys(groups).map(k=>{
    const items = groups[k];
    if(sortKey){
      items.sort((a,b)=>{
        let av, bv;
        if(sortKey==='gl'){ av=glSortVal(a); bv=glSortVal(b);
          if(av[0]!==bv[0]) return (av[0]-bv[0])*sortDir;
          return (av[1]-bv[1])*sortDir;
        }
        if(sortKey==='close'){ av=new Date(a.close).getTime(); bv=new Date(b.close).getTime(); return (av-bv)*sortDir; }
        if(sortKey==='agents'){ av=a.agents||0; bv=b.agents||0; return (av-bv)*sortDir; }
        av=(a[sortKey]||'').toString().toLowerCase(); bv=(b[sortKey]||'').toString().toLowerCase();
        if(av<bv) return -1*sortDir; if(av>bv) return 1*sortDir; return 0;
      });
    } else {
      items.sort((a,b)=> new Date(b.close)-new Date(a.close));
    }
    const maxClose = items.reduce((m,r)=> Math.max(m, new Date(r.close).getTime()), 0);
    return {key:k, items, maxClose};
  });
  groupArr.sort((a,b)=> b.maxClose - a.maxClose);
  return groupArr;
}

function render(){
  const list = applyFilters();
  const groups = groupAndSort(list);
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  if(!list.length){
    tbody.innerHTML = `<tr class="norows"><td colspan="10">No deals match the current filters.</td></tr>`;
  } else {
    groups.forEach(g=>{
      const trg = document.createElement('tr');
      trg.className = 'grouprow';
      trg.innerHTML = `<td colspan="10">${g.key} (${g.items.length} deal${g.items.length>1?'s':''})</td>`;
      tbody.appendChild(trg);
      g.items.forEach(r=>{
        const gl = glLabel(r);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.acct}</td>
          <td><a class="deallink" target="_blank" href="${SF_BASE}${r.id}/view">${r.deal}</a></td>
          <td>${r.type||''}</td>
          <td>${integBadges(r.integ)}</td>
          <td>${hubBadge(r.hub)}</td>
          <td>${fmtDate(r.close)}</td>
          <td>${r.agents!=null?r.agents.toLocaleString():''}</td>
          <td>${r.region||''}</td>
          <td><span class="gl ${gl.cls}">${gl.txt}</span></td>
          <td>${r.owner||''}</td>`;
        tbody.appendChild(tr);
      });
    });
  }
  // KPIs (based on filtered set)
  document.getElementById('kpiTotal').textContent = list.length;
  document.getElementById('kpiLive').textContent = list.filter(r=>r.gl==='live').length;
  document.getElementById('kpiDelayed').textContent = list.filter(r=>r.gl==='delayed').length;
  document.getElementById('kpiEta').textContent = list.filter(r=>r.gl==='eta').length;
  document.getElementById('kpiTbd').textContent = list.filter(r=>r.gl==='tbd').length;
}

function populateFilterOptions(){
  const regions = [...new Set(rows.map(r=>r.region).filter(Boolean))].sort();
  const hubs = [...new Set(rows.map(r=>r.hub).filter(Boolean))].sort();
  const integs = [...new Set(rows.flatMap(r=>r.integ||[]))].sort();
  const fR = document.getElementById('fRegion');
  regions.forEach(r=>{ const o=document.createElement('option'); o.value=r; o.textContent=r; fR.appendChild(o); });
  const fH = document.getElementById('fHub');
  hubs.forEach(h=>{ const o=document.createElement('option'); o.value=h; o.textContent=h; fH.appendChild(o); });
  const fGL = document.getElementById('fGL');
  [['live','Live'],['delayed','Delayed'],['eta','ETA'],['tbd','TBD']].forEach(([v,l])=>{
    const o=document.createElement('option'); o.value=v; o.textContent=l; fGL.appendChild(o);
  });
  const fI = document.getElementById('fInteg');
  integs.forEach(i=>{ const o=document.createElement('option'); o.value=i; o.textContent=i; fI.appendChild(o); });
}

function init(){
  document.getElementById('banner').textContent = `Dashboard generated on ${fmtDate(GEN_DATE)} — data reflects Salesforce as of that date.`;
  populateFilterOptions();
  document.getElementById('fSearch').addEventListener('input', render);
  document.getElementById('fRegion').addEventListener('change', render);
  document.getElementById('fHub').addEventListener('change', render);
  document.getElementById('fGL').addEventListener('change', render);
  document.getElementById('fInteg').addEventListener('change', render);
  document.querySelectorAll('th[data-k]').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.getAttribute('data-k');
      if(sortKey===k) sortDir *= -1; else { sortKey = k; sortDir = 1; }
      render();
    });
  });
  render();
}
