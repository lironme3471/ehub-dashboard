<style>
  :root {
    --nice-blue: #3694FC;
    --charcoal: #21212B;
    --teal: #36EAD0;
    --indigo: #6100FF;
    --coral: #FF6B81;
    --orange: #FF9F40;
    --purple: #A259FF;
    --green: #2ECC71;
    --bg: #F4F6FA;
    --card-bg: #FFFFFF;
    --border: #E2E6ED;
    --text: #21212B;
    --text-muted: #6B7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* ---------- Password Gate ---------- */
  #gate-overlay {
    position: fixed; inset: 0; background: rgba(33,33,43,0.97);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate-card {
    background: #fff; border-radius: 14px; padding: 40px 36px; width: 360px;
    max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center;
  }
  #gate-card .logo { font-weight: 800; font-size: 22px; color: var(--charcoal); letter-spacing: 1px; margin-bottom: 4px; }
  #gate-card .logo span { color: var(--nice-blue); }
  #gate-card h2 { margin: 8px 0 20px; font-size: 16px; color: var(--text-muted); font-weight: 500; }
  #gate-card input {
    width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 15px; margin-bottom: 14px; outline: none;
  }
  #gate-card input:focus { border-color: var(--nice-blue); }
  #gate-card button {
    width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--nice-blue);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #gate-card button:hover { background: #2a7fe0; }
  #gate-error { color: var(--coral); font-size: 13px; margin-top: 10px; min-height: 16px; }
  #dashboard { display: none; }

  /* ---------- Banner ---------- */
  .banner {
    background: #FFD95A; color: #5A4300; text-align: center; padding: 8px 16px;
    font-size: 13px; font-weight: 600;
  }

  /* ---------- Header ---------- */
  header {
    background: var(--charcoal); color: #fff; padding: 20px 28px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  header .title { font-size: 20px; font-weight: 800; }
  header .title span { color: var(--nice-blue); }
  header .subtitle { font-size: 12px; color: #B6BAC6; margin-top: 2px; }

  /* ---------- KPI Tiles ---------- */
  .kpi-row {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px;
    padding: 20px 28px 4px;
  }
  .kpi-tile {
    background: var(--card-bg); border-radius: 10px; padding: 16px 18px; border: 1px solid var(--border);
  }
  .kpi-tile .kpi-value { font-size: 26px; font-weight: 800; color: var(--charcoal); }
  .kpi-tile .kpi-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .kpi-tile.live .kpi-value { color: #1FAE6E; }
  .kpi-tile.delayed .kpi-value { color: var(--coral); }
  .kpi-tile.eta .kpi-value { color: var(--nice-blue); }
  .kpi-tile.tbd .kpi-value { color: var(--text-muted); }

  /* ---------- Filters ---------- */
  .filters {
    display: flex; flex-wrap: wrap; gap: 10px; padding: 18px 28px 6px; align-items: center;
  }
  .filters input, .filters select {
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border);
    font-size: 13px; background: #fff; color: var(--text);
  }
  .filters input[type="text"] { min-width: 220px; }
  .filters .count { margin-left: auto; font-size: 13px; color: var(--text-muted); font-weight: 600; }

  /* ---------- Table ---------- */
  .table-wrap { padding: 10px 28px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; font-size: 13px; }
  thead th {
    background: var(--charcoal); color: #fff; text-align: left; padding: 11px 12px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .4px; cursor: pointer; user-select: none;
    white-space: nowrap;
  }
  thead th:hover { background: #32323f; }
  thead th .arrow { font-size: 10px; margin-left: 4px; opacity: .7; }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: #F9FAFC; }
  tr.group-header td {
    background: #EDEFF5; font-weight: 700; color: var(--charcoal); padding: 8px 12px; font-size: 12.5px;
  }
  tr.no-results td { text-align: center; padding: 30px; color: var(--text-muted); font-style: italic; }

  a.deal-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }
  a.deal-link:hover { text-decoration: underline; }

  .badge {
    display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 10.5px; font-weight: 700;
    color: #fff; margin-right: 4px; white-space: nowrap;
  }
  .badge.hub-offline { background: var(--teal); color: #0A3D38; }
  .badge.hub-rt { background: var(--nice-blue); }
  .badge.hub-rtoffline { background: var(--indigo); }
  .badge.int-smartreach { background: var(--orange); }
  .badge.int-ticketing { background: var(--purple); }
  .badge.int-amc { background: var(--green); }
  .badge.status-live { background: #1FAE6E; }
  .badge.status-delayed { background: var(--coral); }
  .badge.status-eta { background: var(--nice-blue); }
  .badge.status-tbd { background: #9AA0AC; }

  footer { text-align: center; padding: 20px; color: var(--text-muted); font-size: 11px; }
</style>
</head>

const TODAY_STR = "October 14, 2026";
const PASSWORD_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

// ---------- Dashboard logic (declarations must precede the session check below,
// since an already-authenticated session calls init()/render() synchronously) ----------
let sortState = { key: null, dir: 1 };

function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  if (isNaN(d)) return s;
  return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function goLiveSortRank(d) {
  if (d.goLiveStatus === 'Live') return [0, 0];
  if (d.goLiveStatus === 'Delayed' || d.goLiveStatus === 'ETA') {
    const t = d.goLiveDate ? new Date(d.goLiveDate + 'T00:00:00').getTime() : Infinity;
    return [1, t];
  }
  return [2, 0]; // TBD last
}

function hubBadge(hub) {
  if (hub === 'Offline') return '<span class="badge hub-offline">Offline</span>';
  if (hub === 'RT + Offline') return '<span class="badge hub-rtoffline">RT + Offline</span>';
  return '<span class="badge hub-rt">Real-Time</span>';
}
function integrationBadges(list) {
  if (!list || !list.length) return '';
  return list.map(i => {
    const cls = i === 'SmartReach' ? 'int-smartreach' : i === 'Ticketing' ? 'int-ticketing' : 'int-amc';
    return `<span class="badge ${cls}">${i}</span>`;
  }).join('');
}
function statusBadge(status, dateStr) {
  const cls = status === 'Live' ? 'status-live' : status === 'Delayed' ? 'status-delayed' : status === 'ETA' ? 'status-eta' : 'status-tbd';
  let label = status;
  if ((status === 'Delayed' || status === 'ETA') && dateStr) label = `${status} &middot; ${fmtDate(dateStr)}`;
  return `<span class="badge ${cls}">${label}</span>`;
}

function populateFilterOptions() {
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.hub))].sort();
  const statuses = ['Live', 'Delayed', 'ETA', 'TBD'];
  const integrations = [...new Set(DEALS.flatMap(d => d.integration))].sort();
  const fill = (sel, items) => {
    const el = document.getElementById(sel);
    items.forEach(v => {
      const opt = document.createElement('option');
      opt.value = v; opt.textContent = v;
      el.appendChild(opt);
    });
  };
  fill('f-region', regions);
  fill('f-hub', hubs);
  fill('f-status', statuses);
  fill('f-integration', integrations);
}

function renderKPIs(filtered) {
  const total = filtered.length;
  const live = filtered.filter(d => d.goLiveStatus === 'Live').length;
  const delayed = filtered.filter(d => d.goLiveStatus === 'Delayed').length;
  const eta = filtered.filter(d => d.goLiveStatus === 'ETA').length;
  const tbd = filtered.filter(d => d.goLiveStatus === 'TBD').length;
  const tiles = [
    { label: 'Total Deals', value: total, cls: '' },
    { label: 'Live', value: live, cls: 'live' },
    { label: 'Delayed', value: delayed, cls: 'delayed' },
    { label: 'ETA', value: eta, cls: 'eta' },
    { label: 'TBD', value: tbd, cls: 'tbd' },
  ];
  document.getElementById('kpi-row').innerHTML = tiles.map(t => `
    <div class="kpi-tile ${t.cls}">
      <div class="kpi-value">${t.value}</div>
      <div class="kpi-label">${t.label}</div>
    </div>
  `).join('');
}

function getFiltered() {
  const search = document.getElementById('f-search').value.trim().toLowerCase();
  const region = document.getElementById('f-region').value;
  const hub = document.getElementById('f-hub').value;
  const status = document.getElementById('f-status').value;
  const integration = document.getElementById('f-integration').value;
  return DEALS.filter(d => {
    if (search) {
      const hay = `${d.account} ${d.dealName}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    if (region && d.region !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (status && d.goLiveStatus !== status) return false;
    if (integration && !(d.integration || []).includes(integration)) return false;
    return true;
  });
}

function sortFlat(list, key, dir) {
  const copy = [...list];
  copy.sort((a, b) => {
    let av, bv;
    if (key === 'goLive') {
      const ra = goLiveSortRank(a), rb = goLiveSortRank(b);
      if (ra[0] !== rb[0]) return (ra[0] - rb[0]) * dir;
      return (ra[1] - rb[1]) * dir;
    } else if (key === 'integration') {
      av = (a.integration || []).join(',');
      bv = (b.integration || []).join(',');
    } else if (key === 'agents') {
      av = a.agents == null ? -1 : a.agents;
      bv = b.agents == null ? -1 : b.agents;
    } else if (key === 'closeDate') {
      av = a.closeDate || '';
      bv = b.closeDate || '';
    } else {
      av = (a[key] || '').toString().toLowerCase();
      bv = (b[key] || '').toString().toLowerCase();
    }
    if (av < bv) return -1 * dir;
    if (av > bv) return 1 * dir;
    return 0;
  });
  return copy;
}

function groupAndSort(list) {
  const groups = {};
  list.forEach(d => {
    const key = d.account || 'Unknown';
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const groupArr = Object.keys(groups).map(name => {
    const rows = [...groups[name]].sort((a, b) => (b.closeDate || '').localeCompare(a.closeDate || ''));
    const mostRecent = rows.reduce((m, r) => r.closeDate && r.closeDate > m ? r.closeDate : m, rows[0].closeDate || '');
    return { name, rows, mostRecent };
  });
  groupArr.sort((a, b) => (b.mostRecent || '').localeCompare(a.mostRecent || ''));
  return groupArr;
}

function dealRowHTML(d) {
  const link = `https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view`;
  return `<tr>
    <td>${d.account || ''}</td>
    <td><a class="deal-link" href="${link}" target="_blank" rel="noopener">${d.dealName || ''}</a></td>
    <td>${d.type || ''}</td>
    <td>${integrationBadges(d.integration)}</td>
    <td>${hubBadge(d.hub)}</td>
    <td>${fmtDate(d.closeDate)}</td>
    <td>${d.agents != null ? d.agents : ''}</td>
    <td>${d.region || ''}</td>
    <td>${statusBadge(d.goLiveStatus, d.goLiveDate)}</td>
    <td>${d.owner || ''}</td>
  </tr>`;
}

function render() {
  const filtered = getFiltered();
  renderKPIs(filtered);
  document.getElementById('result-count').textContent = `${filtered.length} deal${filtered.length === 1 ? '' : 's'}`;

  const tbody = document.getElementById('table-body');
  if (filtered.length === 0) {
    tbody.innerHTML = `<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>`;
    updateSortArrows();
    return;
  }

  let html = '';
  if (sortState.key && sortState.key !== 'account') {
    const sorted = sortFlat(filtered, sortState.key, sortState.dir);
    html = sorted.map(dealRowHTML).join('');
  } else {
    const groups = groupAndSort(filtered);
    groups.forEach(g => {
      html += `<tr class="group-header"><td colspan="10">${g.name} &middot; ${g.rows.length} deal${g.rows.length === 1 ? '' : 's'}</td></tr>`;
      html += g.rows.map(dealRowHTML).join('');
    });
  }
  tbody.innerHTML = html;
  updateSortArrows();
}

function updateSortArrows() {
  document.querySelectorAll('thead th').forEach(th => {
    const arrow = th.querySelector('.arrow');
    if (th.dataset.key === sortState.key) {
      arrow.textContent = sortState.dir === 1 ? '▲' : '▼';
    } else {
      arrow.textContent = '';
    }
  });
}

function attachSortHandlers() {
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (key === 'account') {
        sortState = { key: null, dir: 1 };
      } else if (sortState.key === key) {
        sortState.dir *= -1;
      } else {
        sortState = { key, dir: 1 };
      }
      render();
    });
  });
}

function init() {
  document.getElementById('banner').textContent = `Dashboard generated on ${TODAY_STR} — data reflects Salesforce as of that date.`;
  populateFilterOptions();
  attachSortHandlers();
  ['f-search', 'f-region', 'f-hub', 'f-status', 'f-integration'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });
  render();
}

// ---------- Password Gate (declared after dashboard logic; checkSession can
// synchronously call init()/render() for an already-authenticated session) ----------
async function sha256Hex(message) {
  const enc = new TextEncoder().encode(message);
  const hashBuffer = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function showDashboard() {
  document.getElementById('gate-overlay').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  init();
}
(function checkSession() {
  try {
    if (sessionStorage.getItem('ehub_authed') === '1') { showDashboard(); return; }
  } catch (e) {}
})();
document.getElementById('gate-submit').addEventListener('click', tryUnlock);
document.getElementById('gate-password').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
async function tryUnlock() {
  const pw = document.getElementById('gate-password').value;
  const hash = await sha256Hex(pw);
  if (hash === PASSWORD_HASH) {
    try { sessionStorage.setItem('ehub_authed', '1'); } catch (e) {}
    showDashboard();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect password.';
  }
}
