<style>
  :root {
    --nice-blue: #3694FC;
    --charcoal: #21212B;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    background: #f4f6f9;
    color: var(--charcoal);

  /* Password gate */
  #gate-overlay {
    position: fixed; inset: 0; background: rgba(33,33,43,0.97);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate-card {
    background: #fff; border-radius: 12px; padding: 36px 40px; width: 320px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center;
  }
  #gate-card h2 { margin-top: 0; color: var(--charcoal); font-size: 20px; }
  #gate-card input {
    width: 100%; padding: 10px 12px; margin: 14px 0 8px; border: 1px solid #ccc;
    border-radius: 6px; font-size: 14px;
  }
  #gate-card button {
    width: 100%; padding: 10px; background: var(--nice-blue); color: #fff; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  #gate-card button:hover { background: #2577d6; }
  #gate-error { color: var(--coral); font-size: 13px; min-height: 18px; margin-top: 4px; }

  #app { display: none; max-width: 1400px; margin: 0 auto; padding: 20px; }
  .banner {
    background: #FFE98A; color: #5a4400; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px; font-weight: 600;
  }
  h1 { font-size: 22px; margin: 0 0 16px; color: var(--charcoal); }

  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .kpi {
    background: #fff; border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 120px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06); text-align: center;
  }
  .kpi .num { font-size: 26px; font-weight: 700; color: var(--nice-blue); }
  .kpi .label { font-size: 12px; color: #666; margin-top: 4px; text-transform: uppercase; letter-spacing: .03em; }

  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; background: #fff;
    padding: 12px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
  }
  .filters input { flex: 1; min-width: 180px; }

  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; }
  thead th {
    background: var(--charcoal); color: #fff; padding: 10px 8px; font-size: 12px;
    text-align: left; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { background: #343445; }
  thead th .arrow { font-size: 10px; margin-left: 4px; opacity: 0.7; }
  tbody td { padding: 8px; font-size: 13px; border-bottom: 1px solid #eee; vertical-align: top; }
  tbody tr:hover { background: #f8fbff; }
  .group-row td {
    background: #eef3fb; font-weight: 700; font-size: 12.5px; color: var(--charcoal);
    padding: 8px 10px;
  }
  .no-results td { text-align: center; padding: 24px; color: #888; }

  a.deal-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }
  a.deal-link:hover { text-decoration: underline; }

  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    font-weight: 600; color: #fff; margin-right: 4px; margin-bottom: 2px;
  }
  .badge-smartreach { background: #FF8A3D; }
  .badge-ticketing { background: #9B51E0; }
  .badge-amc { background: #27AE60; }

  .hub-pill {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11.5px;
    font-weight: 600; color: #fff;
  }
  .hub-rt { background: var(--nice-blue); }
  .hub-offline { background: var(--teal); color: #103b36; }
  .hub-both { background: var(--indigo); }

  .status-pill {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600;
  }
  .status-live { background: #DFF5E1; color: #1E7A34; }
  .status-delayed { background: #FFE1E9; color: #B3264A; }
  .status-eta { background: #DCEBFF; color: #1A5CB8; }
  .status-tbd { background: #EEEEEE; color: #666; }
</style>

const SHA256_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

const COLUMNS = [
  {key:"account", label:"Account"},
  {key:"dealName", label:"Deal Name"},
  {key:"type", label:"Type"},
  {key:"integration", label:"Integration"},
  {key:"hub", label:"Hub"},
  {key:"closeDate", label:"Close Date"},
  {key:"agents", label:"Agents"},
  {key:"region", label:"Region"},
  {key:"goLiveStatus", label:"Go-Live"},
  {key:"owner", label:"Owner"},
];

let sortKey = null;
let sortDir = 1;

async function sha256Hex(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function checkGate() {
  try {
    if (sessionStorage.getItem("ehub_authed") === "1") {
      showApp();
    }
  } catch(e) {}
}

async function tryUnlock() {
  const pw = document.getElementById("gate-password").value;
  const hash = await sha256Hex(pw);
  if (hash === SHA256_HASH) {
    try { sessionStorage.setItem("ehub_authed", "1"); } catch(e) {}
    showApp();
  } else {
    document.getElementById("gate-error").textContent = "Incorrect password.";
  }
}

function showApp() {
  document.getElementById("gate-overlay").style.display = "none";
  document.getElementById("app").style.display = "block";
  init();
}

document.getElementById("gate-submit").addEventListener("click", tryUnlock);
document.getElementById("gate-password").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", {month:"short", day:"numeric", year:"numeric"});
}

function goLiveDisplay(d) {
  if (d.goLiveStatus === "Live") return '<span class="status-pill status-live">Live</span>';
  if (d.goLiveStatus === "TBD") return '<span class="status-pill status-tbd">TBD</span>';
  const label = d.goLiveStatus === "Delayed" ? "Delayed" : "ETA";
  const cls = d.goLiveStatus === "Delayed" ? "status-delayed" : "status-eta";
  const dateTxt = d.goLiveDate ? fmtDate(d.goLiveDate) : "";
  return `<span class="status-pill ${cls}">${label}${dateTxt ? " → " + dateTxt : ""}</span>`;
}

function hubPill(hub) {
  let cls = "hub-rt";
  if (hub === "Offline") cls = "hub-offline";
  else if (hub === "RT + Offline") cls = "hub-both";
  return `<span class="hub-pill ${cls}">${hub}</span>`;
}

function integrationBadges(arr) {
  if (!arr || !arr.length) return "";
  return arr.map(x => {
    const cls = x === "SmartReach" ? "badge-smartreach" : (x === "Ticketing" ? "badge-ticketing" : "badge-amc");
    return `<span class="badge ${cls}">${x}</span>`;
  }).join("");
}

function sfLink(d) {
  return `<a class="deal-link" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view">${d.dealName}</a>`;
}

function goLiveSortValue(d) {
  // rank: Live=0, Delayed/ETA merged by date=1, TBD=2
  if (d.goLiveStatus === "Live") return [0, 0];
  if (d.goLiveStatus === "TBD") return [2, 0];
  const t = d.goLiveDate ? new Date(d.goLiveDate).getTime() : 0;
  return [1, t];
}

function populateFilterOptions() {
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.hub).filter(Boolean))].sort();
  const statuses = ["Live","Delayed","ETA","TBD"];
  const integrations = ["SmartReach","Ticketing","AMC"];
  const fill = (id, items) => {
    const sel = document.getElementById(id);
    items.forEach(v => {
      const o = document.createElement("option");
      o.value = v; o.textContent = v;
      sel.appendChild(o);
    });
  };
  fill("f-region", regions);
  fill("f-hub", hubs);
  fill("f-golive", statuses);
  fill("f-integration", integrations);
}

function renderHeader() {
  const row = document.getElementById("header-row");
  row.innerHTML = "";
  COLUMNS.forEach(col => {
    const th = document.createElement("th");
    let arrow = "";
    if (sortKey === col.key) arrow = `<span class="arrow">${sortDir === 1 ? "▲" : "▼"}</span>`;
    th.innerHTML = col.label + arrow;
    th.addEventListener("click", () => {
      if (sortKey === col.key) sortDir *= -1; else { sortKey = col.key; sortDir = 1; }
      render();
    });
    row.appendChild(th);
  });
}

function compareBy(key) {
  return (a, b) => {
    let av, bv;
    if (key === "goLiveStatus") {
      av = goLiveSortValue(a); bv = goLiveSortValue(b);
      if (av[0] !== bv[0]) return (av[0] - bv[0]) * sortDir;
      return (av[1] - bv[1]) * sortDir;
    }
    if (key === "closeDate") {
      av = a.closeDate ? new Date(a.closeDate).getTime() : 0;
      bv = b.closeDate ? new Date(b.closeDate).getTime() : 0;
      return (av - bv) * sortDir;
    }
    if (key === "agents") {
      av = a.agents ?? -1; bv = b.agents ?? -1;
      return (av - bv) * sortDir;
    }
    if (key === "integration") {
      av = (a.integration || []).join(","); bv = (b.integration || []).join(",");
      return av.localeCompare(bv) * sortDir;
    }
    av = (a[key] || "").toString().toLowerCase();
    bv = (b[key] || "").toString().toLowerCase();
    return av.localeCompare(bv) * sortDir;
  };
}

function applyFilters() {
  const search = document.getElementById("f-search").value.trim().toLowerCase();
  const region = document.getElementById("f-region").value;
  const hub = document.getElementById("f-hub").value;
  const golive = document.getElementById("f-golive").value;
  const integ = document.getElementById("f-integration").value;

  return DEALS.filter(d => {
    if (search && !((d.account||"").toLowerCase().includes(search) || (d.dealName||"").toLowerCase().includes(search))) return false;
    if (region && d.region !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (golive && d.goLiveStatus !== golive) return false;
    if (integ && !(d.integration||[]).includes(integ)) return false;
    return true;
  });
}

function renderKpis(filtered) {
  const total = filtered.length;
  const live = filtered.filter(d => d.goLiveStatus === "Live").length;
  const delayed = filtered.filter(d => d.goLiveStatus === "Delayed").length;
  const eta = filtered.filter(d => d.goLiveStatus === "ETA").length;
  const tbd = filtered.filter(d => d.goLiveStatus === "TBD").length;
  const tiles = [
    {label:"Total Deals", num: total},
    {label:"Live", num: live},
    {label:"Delayed", num: delayed},
    {label:"ETA", num: eta},
    {label:"TBD", num: tbd},
  ];
  const row = document.getElementById("kpi-row");
  row.innerHTML = tiles.map(t => `<div class="kpi"><div class="num">${t.num}</div><div class="label">${t.label}</div></div>`).join("");
}

function render() {
  renderHeader();
  const filtered = applyFilters();
  renderKpis(filtered);

  const body = document.getElementById("table-body");
  body.innerHTML = "";

  if (!filtered.length) {
    body.innerHTML = `<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>`;
    return;
  }

  // group by groupKey, order groups by most recent close date desc
  const groups = {};
  filtered.forEach(d => {
    const k = d.groupKey || d.account || "Unknown";
    if (!groups[k]) groups[k] = [];
    groups[k].push(d);
  });
  const groupOrder = Object.keys(groups).sort((a,b) => {
    const maxA = Math.max(...groups[a].map(d => d.closeDate ? new Date(d.closeDate).getTime() : 0));
    const maxB = Math.max(...groups[b].map(d => d.closeDate ? new Date(d.closeDate).getTime() : 0));
    return maxB - maxA;
  });

  const cmp = sortKey ? compareBy(sortKey) : compareBy("closeDate");
  if (!sortKey) {
    // default descending by close date within group
  }

  groupOrder.forEach(gk => {
    const rows = groups[gk].slice().sort(cmp);
    const trGroup = document.createElement("tr");
    trGroup.className = "group-row";
    trGroup.innerHTML = `<td colspan="10">${gk} &mdash; ${rows.length} deal${rows.length === 1 ? "" : "s"}</td>`;
    body.appendChild(trGroup);
    rows.forEach(d => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${d.account || ""}</td>
        <td>${sfLink(d)}</td>
        <td>${d.type || ""}</td>
        <td>${integrationBadges(d.integration)}</td>
        <td>${hubPill(d.hub)}</td>
        <td>${fmtDate(d.closeDate)}</td>
        <td>${d.agents ?? ""}</td>
        <td>${d.region || ""}</td>
        <td>${goLiveDisplay(d)}</td>
        <td>${d.owner || ""}</td>
      `;
      body.appendChild(tr);
    });
  });
}

function init() {
  populateFilterOptions();
  ["f-search","f-region","f-hub","f-golive","f-integration"].forEach(id => {
    document.getElementById(id).addEventListener("input", render);
    document.getElementById(id).addEventListener("change", render);
  });
  render();
}

checkGate();
</script>
