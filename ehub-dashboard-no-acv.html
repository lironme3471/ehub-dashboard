<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eHub Closed Won Dashboard</title>
<style>
  :root {
    --nice-blue: #3694FC;
    --charcoal: #21212B;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
    --orange: #FF9640;
    --purple: #9B59F6;
    --green: #2ECC71;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: 'Segoe UI', Arial, sans-serif; background:#f4f6fa; color: var(--charcoal); }

  /* Password gate */
  #gateOverlay {
    position: fixed; inset:0; background: rgba(33,33,43,0.97);
    display:flex; align-items:center; justify-content:center; z-index:9999;
  }
  #gateCard {
    background:#fff; border-radius:12px; padding:36px 40px; width:320px; text-align:center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  #gateCard h2 { margin:0 0 6px; font-size:20px; color:var(--charcoal); }
  #gateCard p { margin:0 0 18px; font-size:13px; color:#777; }
  #gateCard input {
    width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:8px; font-size:14px; margin-bottom:12px;
  }
  #gateCard button {
    width:100%; padding:10px 12px; border:none; border-radius:8px; background:var(--nice-blue); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  #gateCard button:hover { background:#237bdc; }
  #gateError { color: var(--coral); font-size:12px; height:16px; margin-top:4px; }

  #app { display:none; }

  header.top {
    background: var(--charcoal); color:#fff; padding:18px 28px;
  }
  header.top h1 { margin:0; font-size:20px; font-weight:600; }
  header.top .sub { font-size:12px; color:#b7b7c2; margin-top:2px; }

  .banner {
    background:#FFE98A; color:#5a4a00; padding:8px 28px; font-size:13px; font-weight:600;
  }

  .kpis {
    display:flex; gap:14px; padding:18px 28px; flex-wrap:wrap;
  }
  .kpi {
    background:#fff; border-radius:10px; padding:14px 20px; min-width:120px;
    box-shadow:0 1px 4px rgba(0,0,0,0.08);
  }
  .kpi .num { font-size:26px; font-weight:700; }
  .kpi .label { font-size:12px; color:#777; margin-top:2px; }
  .kpi.total .num { color: var(--charcoal); }
  .kpi.live .num { color: #2ECC71; }
  .kpi.delayed .num { color: var(--coral); }
  .kpi.eta .num { color: var(--nice-blue); }
  .kpi.tbd .num { color: #999; }

  .controls {
    display:flex; gap:10px; padding: 0 28px 16px; flex-wrap:wrap; align-items:center;
  }
  .controls input[type=text] {
    padding:8px 12px; border:1px solid #ccc; border-radius:8px; font-size:13px; min-width:220px;
  }
  .controls select {
    padding:8px 10px; border:1px solid #ccc; border-radius:8px; font-size:13px; background:#fff;
  }
  .controls .count { margin-left:auto; font-size:12px; color:#666; }

  table-wrap { display:block; }
  .table-wrap { padding: 0 28px 28px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; font-size:13px; }
  thead th {
    background: var(--charcoal); color:#fff; text-align:left; padding:10px 12px; cursor:pointer; white-space:nowrap;
    user-select:none;
  }
  thead th:hover { background:#34344a; }
  thead th.sorted::after { content:" \25BC"; font-size:10px; }
  thead th.sorted-asc::after { content:" \25B2"; font-size:10px; }
  tbody td { padding:9px 12px; border-bottom:1px solid #eee; vertical-align:middle; }
  tbody tr.group-row td {
    background:#eef2f9; font-weight:700; color:var(--charcoal); padding:8px 12px;
  }
  tbody tr:hover:not(.group-row) { background:#f8faff; }
  a.deallink { color: var(--nice-blue); text-decoration:none; font-weight:600; }
  a.deallink:hover { text-decoration:underline; }

  .badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:700; color:#fff; margin-right:4px; }
  .badge.offline { background: var(--teal); color:#0a3b35; }
  .badge.rt { background: var(--nice-blue); }
  .badge.rtoffline { background: var(--indigo); }
  .badge.smartreach { background: var(--orange); }
  .badge.ticketing { background: var(--purple); }
  .badge.amc { background: var(--green); }

  .status { font-weight:700; }
  .status.live { color:#2ECC71; }
  .status.delayed { color: var(--coral); }
  .status.eta { color: var(--nice-blue); }
  .status.tbd { color:#999; }

  .no-results td { text-align:center; color:#888; padding:24px; }
</style>
</head>
<body>

<div id="gateOverlay">
  <div id="gateCard">
    <h2>eHub Dashboard</h2>
    <p>Enter the password to continue</p>
    <input type="password" id="gatePw" placeholder="Password" autocomplete="off">
    <button id="gateBtn">Unlock</button>
    <div id="gateError"></div>
  </div>
</div>

<div id="app">
  <header class="top">
    <h1>eHub Closed Won Dashboard</h1>
    <div class="sub">NiCE CXone Engagement Hub &mdash; Closed Won pipeline</div>
  </header>
  <div class="banner">Dashboard generated on October 19, 2026 &mdash; data reflects Salesforce as of that date.</div>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search account or deal name...">
    <select id="filterRegion"><option value="">All Regions</option></select>
    <select id="filterHub"><option value="">All Hub Types</option></select>
    <select id="filterGoLive"><option value="">All Go-Live Status</option></select>
    <select id="filterIntegration"><option value="">All Integrations</option></select>
    <span class="count" id="resultCount"></span>
  </div>

  <div class="table-wrap">
    <table id="dealTable">
      <thead>
        <tr>
          <th data-key="Account">Account</th>
          <th data-key="DealName">Deal Name</th>
          <th data-key="ContractType">Type</th>
          <th data-key="Integration">Integration</th>
          <th data-key="Hub">Hub</th>
          <th data-key="CloseDate">Close Date</th>
          <th data-key="Agents">Agents</th>
          <th data-key="Region">Region</th>
          <th data-key="GoLive">Go-Live</th>
          <th data-key="Owner">Owner</th>
        </tr>
      </thead>
      <tbody id="dealBody"></tbody>
    </table>
  </div>
</div>

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function unlock() {
  document.getElementById('gateOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  initApp();
}

(function(){
  try {
    if (sessionStorage.getItem('ehub_unlocked') === '1') {
      unlock();
      return;
    }
  } catch(e) {}

  document.getElementById('gateBtn').addEventListener('click', tryUnlock);
  document.getElementById('gatePw').addEventListener('keydown', function(e){
    if (e.key === 'Enter') tryUnlock();
  });

  async function tryUnlock() {
    const pw = document.getElementById('gatePw').value;
    const hash = await sha256Hex(pw);
    if (hash === PASSWORD_HASH) {
      try { sessionStorage.setItem('ehub_unlocked', '1'); } catch(e) {}
      unlock();
    } else {
      document.getElementById('gateError').textContent = 'Incorrect password';
    }
  }
})();

function fmtDate(iso) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m,10)-1]} ${parseInt(d,10)}, ${y}`;
}

function hubBadge(hub) {
  if (hub === 'Offline') return `<span class="badge offline">Offline</span>`;
  if (hub === 'RT + Offline') return `<span class="badge rtoffline">RT + Offline</span>`;
  return `<span class="badge rt">Real-Time</span>`;
}

function integrationBadges(list) {
  if (!list || !list.length) return '';
  return list.map(i => {
    const cls = i === 'SmartReach' ? 'smartreach' : (i === 'Ticketing' ? 'ticketing' : 'amc');
    return `<span class="badge ${cls}">${i}</span>`;
  }).join('');
}

function statusHtml(status, dateStr) {
  const cls = status.toLowerCase().replace(/\s+/g,'');
  let label = status;
  if (status === 'Delayed' && dateStr) label = `Delayed &rarr; ${fmtDate(dateStr)}`;
  else if (status === 'ETA' && dateStr) label = `ETA ${fmtDate(dateStr)}`;
  return `<span class="status ${cls}">${label}</span>`;
}

let sortState = { key: null, dir: 1 };
let currentFilters = { search:'', region:'', hub:'', golive:'', integration:'' };

function renderKPIs(filtered) {
  const kpiWrap = document.getElementById('kpis');
  const total = filtered.length;
  const live = filtered.filter(d => d.GoLiveStatus === 'Live').length;
  const delayed = filtered.filter(d => d.GoLiveStatus === 'Delayed').length;
  const eta = filtered.filter(d => d.GoLiveStatus === 'ETA').length;
  const tbd = filtered.filter(d => d.GoLiveStatus === 'TBD').length;
  kpiWrap.innerHTML = `
    <div class="kpi total"><div class="num">${total}</div><div class="label">Total Deals</div></div>
    <div class="kpi live"><div class="num">${live}</div><div class="label">Live</div></div>
    <div class="kpi delayed"><div class="num">${delayed}</div><div class="label">Delayed</div></div>
    <div class="kpi eta"><div class="num">${eta}</div><div class="label">ETA</div></div>
    <div class="kpi tbd"><div class="num">${tbd}</div><div class="label">TBD</div></div>
  `;
}

function applyFilters() {
  return DEALS.filter(d => {
    if (currentFilters.search) {
      const s = currentFilters.search.toLowerCase();
      if (!d.Account.toLowerCase().includes(s) && !d.DealName.toLowerCase().includes(s)) return false;
    }
    if (currentFilters.region && d.Region !== currentFilters.region) return false;
    if (currentFilters.hub && d.Hub !== currentFilters.hub) return false;
    if (currentFilters.golive && d.GoLiveStatus !== currentFilters.golive) return false;
    if (currentFilters.integration && !(d.Integration||[]).includes(currentFilters.integration)) return false;
    return true;
  });
}

function goliveSortValue(d) {
  // Live first, then Delayed+ETA merged by date ascending, then TBD last
  if (d.GoLiveStatus === 'Live') return [0, '0000-00-00'];
  if (d.GoLiveStatus === 'TBD') return [2, '9999-99-99'];
  return [1, d.GoLiveDate || '9999-99-99'];
}

function sortDeals(list) {
  if (!sortState.key) return list;
  const key = sortState.key;
  const dir = sortState.dir;
  const copy = [...list];
  copy.sort((a,b) => {
    let av, bv;
    if (key === 'GoLive') {
      av = goliveSortValue(a); bv = goliveSortValue(b);
      if (av[0] !== bv[0]) return (av[0]-bv[0]) * dir;
      return av[1] < bv[1] ? -1*dir : (av[1] > bv[1] ? 1*dir : 0);
    } else if (key === 'CloseDate') {
      av = a.CloseDate || ''; bv = b.CloseDate || '';
      return av < bv ? -1*dir : (av > bv ? 1*dir : 0);
    } else if (key === 'Agents') {
      av = a.Agents == null ? -1 : a.Agents; bv = b.Agents == null ? -1 : b.Agents;
      return (av-bv) * dir;
    } else if (key === 'Integration') {
      av = (a.Integration||[]).join(','); bv = (b.Integration||[]).join(',');
      return av < bv ? -1*dir : (av > bv ? 1*dir : 0);
    } else {
      av = (a[key]||'').toString().toLowerCase(); bv = (b[key]||'').toString().toLowerCase();
      return av < bv ? -1*dir : (av > bv ? 1*dir : 0);
    }
  });
  return copy;
}

function renderTable() {
  const filtered = applyFilters();
  renderKPIs(filtered);
  const body = document.getElementById('dealBody');
  body.innerHTML = '';
  document.getElementById('resultCount').textContent = `${filtered.length} deal${filtered.length===1?'':'s'}`;

  if (filtered.length === 0) {
    body.innerHTML = `<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>`;
    return;
  }

  if (sortState.key) {
    // flat sorted view, no grouping
    const sorted = sortDeals(filtered);
    sorted.forEach(d => body.appendChild(rowHtml(d)));
    return;
  }

  // grouped view in default group order, filtered within each group
  const filteredIds = new Set(filtered.map(d => d.Id));
  GROUP_ORDER.forEach(g => {
    const rows = DEALS.filter(d => d.TopParent === g && filteredIds.has(d.Id));
    if (rows.length === 0) return;
    const gTr = document.createElement('tr');
    gTr.className = 'group-row';
    gTr.innerHTML = `<td colspan="10">${g} (${rows.length} deal${rows.length===1?'':''})</td>`;
    body.appendChild(gTr);
    rows.forEach(d => body.appendChild(rowHtml(d)));
  });
}

function rowHtml(d) {
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td>${d.Account}</td>
    <td><a class="deallink" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.Id}/view" target="_blank">${d.DealName}</a></td>
    <td>${d.ContractType||''}</td>
    <td>${integrationBadges(d.Integration)}</td>
    <td>${hubBadge(d.Hub)}</td>
    <td>${fmtDate(d.CloseDate)}</td>
    <td>${d.Agents != null ? d.Agents : ''}</td>
    <td>${d.Region||''}</td>
    <td>${statusHtml(d.GoLiveStatus, d.GoLiveDate)}</td>
    <td>${d.Owner||''}</td>
  `;
  return tr;
}

function initApp() {
  populateFilterOptions();
  renderTable();

  document.getElementById('searchBox').addEventListener('input', e => { currentFilters.search = e.target.value; renderTable(); });
  document.getElementById('filterRegion').addEventListener('change', e => { currentFilters.region = e.target.value; renderTable(); });
  document.getElementById('filterHub').addEventListener('change', e => { currentFilters.hub = e.target.value; renderTable(); });
  document.getElementById('filterGoLive').addEventListener('change', e => { currentFilters.golive = e.target.value; renderTable(); });
  document.getElementById('filterIntegration').addEventListener('change', e => { currentFilters.integration = e.target.value; renderTable(); });

  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState.key === key) {
        sortState.dir *= -1;
      } else {
        sortState.key = key; sortState.dir = 1;
      }
      document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted','sorted-asc'));
      th.classList.add(sortState.dir === 1 ? 'sorted' : 'sorted-asc');
      renderTable();
    });
  });
}
</script>
</body>
</html>
