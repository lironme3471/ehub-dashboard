<style>

  #pwerror { color: var(--nice-coral); font-size: 13px; min-height: 18px; }
  #content { display: none; padding: 24px; max-width: 1500px; margin: 0 auto; }

  h1 { font-size: 22px; margin-bottom: 4px; }
  .kpis { display: flex; gap: 14px; margin-bottom: 20px; flex-wrap: wrap; }
  .kpi {
    background: #fff; border-radius: 10px; padding: 14px 22px; min-width: 110px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08); text-align: center;
  }
  .kpi .num { font-size: 26px; font-weight: 700; color: var(--nice-blue); }
  .kpi .label { font-size: 12px; color: #555; margin-top: 2px; }
  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
    background: #fff; padding: 12px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .filters input, .filters select {
    padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px;
  }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; }
  thead th {
    background: var(--nice-charcoal); color: #fff; padding: 10px 8px; font-size: 12px;

  }
  thead th:hover { background: #33334a; }
  tbody td { padding: 8px; font-size: 13px; border-bottom: 1px solid #eee; }
  tbody tr:hover { background: #f8fafd; }
  .group-header td {
    background: #eef2f9; font-weight: 700; font-size: 13px; color: var(--nice-charcoal);
    padding: 8px 10px;

  .badge {

  .badge-smartreach { background: #FF9500; }
  .badge-ticketing { background: #8E44AD; }
  .badge-amc { background: #27AE60; }
  .hub-badge {
    display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px;
    color: #fff; font-weight: 600;

  .status-delayed { color: var(--nice-coral); font-weight: 700; }
  .status-eta { color: var(--nice-blue); font-weight: 700; }
  .status-tbd { color: #999; font-weight: 700; }

const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const val = document.getElementById('pwinput').value;
  const hash = await sha256(val);
  if (hash === PW_HASH) {
    sessionStorage.setItem('ehub_authed', '1');
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    init();
  } else {
    document.getElementById('pwerror').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwinput').addEventListener('keydown', function(e){ if (e.key === 'Enter') checkPassword(); });

if (sessionStorage.getItem('ehub_authed') === '1') {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

let sortCol = null, sortDir = 1;

function statusRank(d) {
  if (d.goLiveStatus === 'Live') return 0;
  if (d.goLiveStatus === 'Delayed' || d.goLiveStatus === 'ETA') return 1;
  return 2; // TBD
}

function goLiveSortKey(d) {
  const rank = statusRank(d);
  let dateVal = 8640000000000000; // far future for missing dates within rank
  if (d.goLiveDate) dateVal = new Date(d.goLiveDate).getTime();
  else if (rank === 0) dateVal = -8640000000000000; // Live w/ no date sorts first within Live
  return [rank, dateVal];
}

function populateFilters() {
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.hub))].sort();
  const statuses = ['Live','Delayed','ETA','TBD'];
  const integrations = ['SmartReach','Ticketing','AMC'];
  const fill = (id, arr) => {
    const sel = document.getElementById(id);
    arr.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
  };
  fill('filter-region', regions);
  fill('filter-hub', hubs);
  fill('filter-golive', statuses);
  fill('filter-integration', integrations);
}

function matchesFilters(d) {
  const search = document.getElementById('search').value.toLowerCase();
  const region = document.getElementById('filter-region').value;
  const hub = document.getElementById('filter-hub').value;
  const golive = document.getElementById('filter-golive').value;
  const integ = document.getElementById('filter-integration').value;
  if (search && !d.account.toLowerCase().includes(search) && !d.dealName.toLowerCase().includes(search)) return false;
  if (region && d.region !== region) return false;
  if (hub && d.hub !== hub) return false;
  if (golive && d.goLiveStatus !== golive) return false;
  if (integ && !d.integrations.includes(integ)) return false;
  return true;
}

function badgeHtml(d) {
  return d.integrations.map(i => `<span class="badge badge-${i.toLowerCase()}">${i}</span>`).join('');
}

function statusHtml(d) {
  const cls = 'status-' + d.goLiveStatus.toLowerCase();
  let label = d.goLiveStatus;
  if (d.goLiveDate && (d.goLiveStatus === 'Delayed' || d.goLiveStatus === 'ETA')) {
    label += ' ' + d.goLiveDate;
  }
  return `<span class="${cls}">${label}</span>`;
}

function renderTable() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  let filtered = DEALS.filter(matchesFilters);

  document.getElementById('kpi-total').textContent = filtered.length;
  document.getElementById('kpi-live').textContent = filtered.filter(d => d.goLiveStatus === 'Live').length;
  document.getElementById('kpi-delayed').textContent = filtered.filter(d => d.goLiveStatus === 'Delayed').length;
  document.getElementById('kpi-eta').textContent = filtered.filter(d => d.goLiveStatus === 'ETA').length;
  document.getElementById('kpi-tbd').textContent = filtered.filter(d => d.goLiveStatus === 'TBD').length;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>';
    return;
  }

  if (sortCol) {
    filtered.sort((a,b) => {
      let av, bv;
      if (sortCol === 'goLive') {
        const ak = goLiveSortKey(a), bk = goLiveSortKey(b);
        if (ak[0] !== bk[0]) return (ak[0]-bk[0]) * sortDir;
        return (ak[1]-bk[1]) * sortDir;
      }
      if (sortCol === 'integrations') { av = a.integrations.join(','); bv = b.integrations.join(','); }
      else { av = a[sortCol]; bv = b[sortCol]; }
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return (av-bv)*sortDir;
      return String(av).localeCompare(String(bv)) * sortDir;
    });
    filtered.forEach(d => tbody.appendChild(rowHtml(d)));
    return;
  }

  // default: grouped by topParent, group order by most recent close date desc
  const groups = {};
  filtered.forEach(d => {
    const key = d.topParent || d.account;
    if (!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const groupKeys = Object.keys(groups).sort((a,b) => {
    const am = Math.max(...groups[a].map(d => new Date(d.closeDate).getTime()));
    const bm = Math.max(...groups[b].map(d => new Date(d.closeDate).getTime()));
    return bm - am;
  });
  groupKeys.forEach(key => {
    const rows = groups[key].sort((a,b) => new Date(b.closeDate) - new Date(a.closeDate));
    const gh = document.createElement('tr');
    gh.className = 'group-header';
    gh.innerHTML = `<td colspan="10">${key} (${rows.length} deal${rows.length>1?'s':''})</td>`;
    tbody.appendChild(gh);
    rows.forEach(d => tbody.appendChild(rowHtml(d)));
  });
}

function rowHtml(d) {
  const tr = document.createElement('tr');
  const sfUrl = `https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view`;
  tr.innerHTML = `
    <td>${d.account}</td>
    <td><a class="deallink" href="${sfUrl}" target="_blank">${d.dealName}</a></td>
    <td>${d.type}</td>
    <td>${badgeHtml(d)}</td>
    <td><span class="hub-badge" style="background:${d.hubColor}">${d.hub}</span></td>
    <td>${d.closeDate}</td>
    <td>${d.agents != null ? d.agents : ''}</td>
    <td>${d.region}</td>
    <td>${statusHtml(d)}</td>
    <td>${d.owner}</td>
  `;
  return tr;
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('.sort-arrow').forEach(s => s.textContent = '');
    th.querySelector('.sort-arrow').textContent = sortDir === 1 ? '▲' : '▼';
    renderTable();
  });
});

function init() {
  populateFilters();
  renderTable();
}
if (sessionStorage.getItem('ehub_authed') === '1') init();
