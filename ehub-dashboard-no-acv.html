.pw-card input:focus{border-color:#3694FC}
.pw-card button{width:100%;padding:11px;background:#3694FC;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.pw-card button:hover{background:#2a7de0}
.pw-err{color:#e53935;font-size:13px;margin-top:8px;display:none}
header{background:#21212b;padding:14px 24px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
header .brand{font-size:22px;font-weight:800;color:#3694FC;letter-spacing:-0.5px}
header .subtitle{color:#aaa;font-size:13px}
.banner{background:#f59e0b;color:#1a1a1a;text-align:center;padding:8px;font-size:12px;font-weight:600}
.kpi-row{display:flex;gap:14px;padding:18px 24px 0;flex-wrap:wrap}
.kpi{background:#fff;border-radius:10px;padding:16px 22px;flex:1;min-width:120px;box-shadow:0 1px 6px rgba(0,0,0,.08);border-top:3px solid #3694FC}
.kpi.live{border-color:#22c55e}
.kpi.delayed{border-color:#ef4444}
.kpi.eta{border-color:#f59e0b}
.kpi.tbd{border-color:#94a3b8}
.kpi-val{font-size:28px;font-weight:800;color:#21212b}
.kpi-lbl{font-size:11px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.controls{display:flex;gap:10px;padding:14px 24px;flex-wrap:wrap;align-items:center}
.controls input[type=text]{padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;width:220px;outline:none}
.controls input[type=text]:focus{border-color:#3694FC}
.controls select{padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;background:#fff;outline:none;cursor:pointer}
.controls select:focus{border-color:#3694FC}
.tbl-wrap{padding:0 24px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.08)}
thead tr{background:#21212b;color:#fff}
th{padding:10px 12px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;cursor:pointer;user-select:none}
th:hover{background:#2e2e3e}
th .sort-icon{margin-left:4px;opacity:.5;font-size:10px}
th.active .sort-icon{opacity:1;color:#3694FC}
td{padding:8px 12px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
tr:hover td{background:#f8faff}
tr.group-row td{background:#f0f4ff;font-weight:700;font-size:12px;color:#21212b;padding:6px 12px;border-bottom:2px solid #d8e4ff}
.deal-link{color:#3694FC;text-decoration:none;font-weight:500}
.deal-link:hover{text-decoration:underline}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;margin:1px}

// ── Password Gate ──────────────────────────────────────────────
async function sha256(msg){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const HASH='0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621';
async function checkPw(){
  const v=document.getElementById('pw-input').value;
  const h=await sha256(v);
  if(h===HASH){
    sessionStorage.setItem('ehub-auth','1');
    document.getElementById('pw-overlay').style.display='none';
  } else {
    document.getElementById('pw-err').style.display='block';
  }
}

  const cols=['topParent','name','type','_int','hub','closeDate','agents','region','goLiveStatus','owner'];
  const idx=cols.indexOf(col);
  if(idx>=0){ths[idx].classList.add('active');ths[idx].querySelector('.sort-icon').textContent=sortDir>0?'↑':'↓';}
  render();
}

// ── Populate filter dropdowns ─────────────────────────────────
(function initFilters(){
  const regions=[...new Set(deals.map(d=>d.region).filter(Boolean))].sort();
  const sel=document.getElementById('f-region');
  regions.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=r;sel.appendChild(o);});
})();

// ── Render ────────────────────────────────────────────────────
function hubLabel(h){
  if(h==='rt-offline') return '<span class="badge hub-both">RT + Offline</span>';
  if(h==='offline') return '<span class="badge hub-offline">Offline</span>';
  return '<span class="badge hub-rt">Real-Time</span>';
}
function intBadges(arr){
  return arr.map(i=>{
    if(i==='SmartReach') return '<span class="badge int-sr">SmartReach</span>';
    if(i==='Ticketing') return '<span class="badge int-tk">Ticketing</span>';
    if(i==='AMC') return '<span class="badge int-amc">AMC</span>';
    return '';
  }).join('');
}
function glCell(d){
  const s=d.goLiveStatus, dt=d.goLiveDate;
  if(s==='Live') return '<span class="gl-live">✓ Live</span>';
  if(s==='Delayed') return `<span class="gl-delayed">Delayed${dt?' — '+dt:''}</span>`;
  if(s==='ETA') return `<span class="gl-eta">ETA ${dt||''}</span>`;
  return '<span class="gl-tbd">TBD</span>';
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const fReg=document.getElementById('f-region').value;
  const fHub=document.getElementById('f-hub').value;
  const fGl=document.getElementById('f-gl').value;
  const fInt=document.getElementById('f-int').value;

  let filtered=deals.filter(d=>{
    if(q&&!(d.account.toLowerCase().includes(q)||d.name.toLowerCase().includes(q)||d.topParent.toLowerCase().includes(q))) return false;
    if(fReg&&d.region!==fReg) return false;
    if(fHub&&d.hub!==fHub) return false;
    if(fGl&&d.goLiveStatus!==fGl) return false;
    if(fInt&&!d.integrations.includes(fInt)) return false;
    return true;
  });

  // Sort
  filtered.sort((a,b)=>{
    let va=a[sortCol]??'', vb=b[sortCol]??'';
    if(sortCol==='agents'){va=a.agents??-1;vb=b.agents??-1;}
    if(va<vb) return -1*sortDir;
    if(va>vb) return 1*sortDir;
    return 0;
  });

  // Group by topParent
  const groupOrder=[];
  const groupMap={};
  filtered.forEach(d=>{
    const g=d.topParent;
    if(!groupMap[g]){groupMap[g]={deals:[],maxClose:'0000-00-00'};groupOrder.push(g);}
    groupMap[g].deals.push(d);
    if(d.closeDate>groupMap[g].maxClose) groupMap[g].maxClose=d.closeDate;
  });

  // Sort groups by max close date desc (unless user sorted by specific col — keep group sort by close date always)
  groupOrder.sort((a,b)=>groupMap[b].maxClose.localeCompare(groupMap[a].maxClose));

  // KPIs (over all deals, not filtered)
  const total=deals.length;
  const live=deals.filter(d=>d.goLiveStatus==='Live').length;
  const delayed=deals.filter(d=>d.goLiveStatus==='Delayed').length;
  const eta=deals.filter(d=>d.goLiveStatus==='ETA').length;
  const tbd=deals.filter(d=>d.goLiveStatus==='TBD').length;
  document.getElementById('kpi-total').textContent=total;
  document.getElementById('kpi-live').textContent=live;
  document.getElementById('kpi-delayed').textContent=delayed;
  document.getElementById('kpi-eta').textContent=eta;
  document.getElementById('kpi-tbd').textContent=tbd;

  // Build rows
  let html='';
  groupOrder.forEach(g=>{
    const gDeals=groupMap[g].deals;
    html+=`<tr class="group-row"><td colspan="10">${g}<span class="count-chip">${gDeals.length} deal${gDeals.length>1?'s':''}</span></td></tr>`;
    gDeals.forEach(d=>{
      html+=`<tr>
        <td>${d.account}</td>
        <td><a class="deal-link" href="${SF_BASE}${d.id}/view" target="_blank">${escHtml(d.name)}</a></td>
        <td>${d.type||'—'}</td>
        <td>${intBadges(d.integrations)||'—'}</td>
        <td>${hubLabel(d.hub)}</td>
        <td>${d.closeDate}</td>
        <td>${d.agents!=null?d.agents.toLocaleString():'—'}</td>
        <td>${d.region||'—'}</td>
        <td>${glCell(d)}</td>
        <td>${d.owner||'—'}</td>
      </tr>`;
    });
  });
  document.getElementById('tbody').innerHTML=html||'<tr><td colspan="10" style="text-align:center;color:#aaa;padding:24px">No deals match the current filters.</td></tr>';
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

render();
</script>
</body>
</html>
