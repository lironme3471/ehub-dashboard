<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Closed Won Dashboard</title>
<style>
  :root {
    --blue: #3694FC;
    --charcoal: #21212B;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f5f7;
    color: var(--charcoal);
  }
  #overlay {
    position: fixed; inset: 0; background: rgba(33,33,43,0.96);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #overlay .card {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 340px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  #overlay .card h2 { margin: 0 0 6px; color: var(--charcoal); }
  #overlay .card p { color: #666; font-size: 13px; margin: 0 0 20px; }
  #overlay input {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 14px; margin-bottom: 12px;
  }
  #overlay button {
    width: 100%; padding: 10px 12px; border: none; border-radius: 8px;
    background: var(--blue); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #overlay button:hover { background: #237ee0; }
  #overlay .err { color: var(--coral); font-size: 12px; height: 16px; margin-top: -6px; margin-bottom: 8px; }
  #app { display: none; padding: 24px 32px 60px; max-width: 1400px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .header h1 { font-size: 22px; margin: 0; color: var(--charcoal); }
  .header .logo { font-weight: 800; color: var(--blue); font-size: 20px; letter-spacing: 0.5px; }
  .banner {
    background: #FFF4CC; border: 1px solid #F0D878; color: #6b5a00;
    padding: 10px 16px; border-radius: 8px; font-size: 13px; margin-bottom: 20px;
  }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi {
    background: #fff; border-radius: 10px; padding: 16px; text-align: center;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .kpi .num { font-size: 26px; font-weight: 700; color: var(--charcoal); }
  .kpi .lbl { font-size: 12px; color: #888; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.4px; }
  .kpi.live .num { color: #1DA65B; }
  .kpi.delayed .num { color: var(--coral); }
  .kpi.eta .num { color: var(--blue); }
  .kpi.tbd .num { color: #999; }
  .filters {
    display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center;
  }
  .filters input[type=text] {
    padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; min-width: 220px;
  }
  .filters select {
    padding: 8px 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; background: #fff;
  }
  .count { font-size: 12px; color: #888; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  thead th {
    background: var(--charcoal); color: #fff; text-align: left; padding: 10px 12px; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.3px; cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { background: #33333f; }
  tbody td { padding: 9px 12px; font-size: 13px; border-bottom: 1px solid #eee; vertical-align: middle; }
  tbody tr:hover { background: #f8fafd; }
  .group-row td {
    background: #eef4fe; font-weight: 700; font-size: 12.5px; color: var(--charcoal);
    padding: 8px 12px; border-top: 2px solid #dbe6fb;
  }
  a.deal-link { color: var(--blue); text-decoration: none; font-weight: 500; }
  a.deal-link:hover { text-decoration: underline; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 600; color: #fff;
    margin-right: 4px;
  }
  .badge.smartreach { background: #FF8A3D; }
  .badge.ticketing { background: #9B51E0; }
  .badge.amc { background: #2FA84F; }
  .hub-pill {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11.5px; font-weight: 600; color: #fff;
  }
  .hub-rt { background: var(--blue); }
  .hub-offline { background: var(--teal); color: #12312d; }
  .hub-both { background: var(--indigo); }
  .golive { font-weight: 600; font-size: 12.5px; }
  .golive.live { color: #1DA65B; }
  .golive.delayed { color: var(--coral); }
  .golive.eta { color: var(--blue); }
  .golive.tbd { color: #999; }
  .sort-arrow { font-size: 10px; margin-left: 4px; }
  .no-results td { text-align: center; color: #999; padding: 30px; }
</style>
</head>

</div>

const STORED_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256Hex(str) {
  const buf = new TextEncoder().encode(str);
  const hashBuf = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hashBuf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const hex = await sha256Hex(val);
  if (hex === STORED_HASH) {
    sessionStorage.setItem('ehubNoAcvAuthed', '1');
    document.getElementById('overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });

function golivelabel(d) {
  if (d.GoLiveStatus === 'Live') return 'Live';
  if (d.GoLiveStatus === 'Delayed') return 'Delayed' + (d.GoLiveDate ? ' → ' + d.GoLiveDate : '');
  if (d.GoLiveStatus === 'ETA') return 'ETA' + (d.GoLiveDate ? ' ' + d.GoLiveDate : '');
  return 'TBD';
}

function goliveSortKey(d) {
  // Live first (0), Delayed/ETA merged by date (1, date), TBD last (2)
  if (d.GoLiveStatus === 'Live') return [0, ''];
  if (d.GoLiveStatus === 'TBD') return [2, ''];
  return [1, d.GoLiveDate || '9999-99-99'];
}

function hubClass(hub) {
  if (hub === 'RT + Offline') return 'hub-both';
  if (hub === 'Offline') return 'hub-offline';
  return 'hub-rt';
}

function integrationBadges(ints) {
  return (ints || []).map(i => {
    const cls = i === 'SmartReach' ? 'smartreach' : (i === 'Ticketing' ? 'ticketing' : 'amc');
    return `<span class="badge ${cls}">${i}</span>`;
  }).join('');
}

let sortState = { key: null, dir: 1 };

function populateFilters() {
  const regions = [...new Set(DEALS.map(d => d.Region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.Hub))].sort();
  const integrations = [...new Set(DEALS.flatMap(d => d.Integrations || []))].sort();
  const statuses = ['Live', 'Delayed', 'ETA', 'TBD'];

  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; regionSel.appendChild(o); });

  const hubSel = document.getElementById('hubFilter');
  hubs.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; hubSel.appendChild(o); });

  const statusSel = document.getElementById('goliveFilter');
  statuses.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; statusSel.appendChild(o); });

  const intSel = document.getElementById('integrationFilter');
  integrations.forEach(i => { const o = document.createElement('option'); o.value = i; o.textContent = i; intSel.appendChild(o); });
}

function updateKpis(filtered) {
  document.getElementById('kpiTotal').textContent = filtered.length;
  document.getElementById('kpiLive').textContent = filtered.filter(d => d.GoLiveStatus === 'Live').length;
  document.getElementById('kpiDelayed').textContent = filtered.filter(d => d.GoLiveStatus === 'Delayed').length;
  document.getElementById('kpiEta').textContent = filtered.filter(d => d.GoLiveStatus === 'ETA').length;
  document.getElementById('kpiTbd').textContent = filtered.filter(d => d.GoLiveStatus === 'TBD').length;
}

function applyFiltersAndRender() {
  const search = document.getElementById('searchBox').value.toLowerCase();
  const region = document.getElementById('regionFilter').value;
  const hub = document.getElementById('hubFilter').value;
  const status = document.getElementById('goliveFilter').value;
  const integration = document.getElementById('integrationFilter').value;

  let filtered = DEALS.filter(d => {
    if (search && !(d.Account.toLowerCase().includes(search) || d.DealName.toLowerCase().includes(search))) return false;
    if (region && d.Region !== region) return false;
    if (hub && d.Hub !== hub) return false;
    if (status && d.GoLiveStatus !== status) return false;
    if (integration && !(d.Integrations || []).includes(integration)) return false;
    return true;
  });

  updateKpis(filtered);
  document.getElementById('resultCount').textContent = filtered.length + ' deals';

  document.querySelectorAll('#tbody tr').forEach(tr => {});
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  document.querySelectorAll('thead th .sort-arrow').forEach(a => a.textContent = '');

  if (sortState.key) {
    const th = document.querySelector(`thead th[data-key="${sortState.key}"] .sort-arrow`);
    if (th) th.textContent = sortState.dir === 1 ? '▲' : '▼';

    filtered.sort((a, b) => {
      let av, bv;
      if (sortState.key === 'GoLive') {
        av = goliveSortKey(a); bv = goliveSortKey(b);
        if (av[0] !== bv[0]) return (av[0] - bv[0]) * sortState.dir;
        return av[1] < bv[1] ? -1 * sortState.dir : (av[1] > bv[1] ? 1 * sortState.dir : 0);
      } else if (sortState.key === 'Integrations') {
        av = (a.Integrations || []).join(','); bv = (b.Integrations || []).join(',');
      } else if (sortState.key === 'Agents') {
        av = a.Agents || 0; bv = b.Agents || 0;
        return (av - bv) * sortState.dir;
      } else {
        av = (a[sortState.key] || '').toString().toLowerCase();
        bv = (b[sortState.key] || '').toString().toLowerCase();
      }
      if (av < bv) return -1 * sortState.dir;
      if (av > bv) return 1 * sortState.dir;
      return 0;
    });

    // flattened, no group headers when sorted
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>';
      return;
    }
    filtered.forEach(d => tbody.appendChild(rowHtml(d)));
  } else {
    // grouped view
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>';
      return;
    }
    const byGroup = {};
    filtered.forEach(d => { (byGroup[d.Group] = byGroup[d.Group] || []).push(d); });
    GROUP_ORDER.forEach(g => {
      if (!byGroup[g] || byGroup[g].length === 0) return;
      const groupRow = document.createElement('tr');
      groupRow.className = 'group-row';
      groupRow.innerHTML = `<td colspan="10">${g} — ${byGroup[g].length} deal${byGroup[g].length > 1 ? 's' : ''}</td>`;
      tbody.appendChild(groupRow);
      byGroup[g].forEach(d => tbody.appendChild(rowHtml(d)));
    });
  }
}

function rowHtml(d) {
  const tr = document.createElement('tr');
  const statusCls = d.GoLiveStatus.toLowerCase();
  tr.innerHTML = `
    <td>${d.Account}</td>
    <td><a class="deal-link" href="${SF_BASE}${d.Id}/view" target="_blank" rel="noopener">${d.DealName}</a></td>
    <td>${d.Type || ''}</td>
    <td>${integrationBadges(d.Integrations)}</td>
    <td><span class="hub-pill ${hubClass(d.Hub)}">${d.Hub}</span></td>
    <td>${d.CloseDate || ''}</td>
    <td>${d.Agents != null ? d.Agents : ''}</td>
    <td>${d.Region || ''}</td>
    <td><span class="golive ${statusCls}">${golivelabel(d)}</span></td>
    <td>${d.Owner || ''}</td>
  `;
  return tr;
}

document.querySelectorAll('thead th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.getAttribute('data-key');
    if (sortState.key === key) {
      if (sortState.dir === 1) { sortState.dir = -1; }
      else { sortState.key = null; sortState.dir = 1; }
    } else {
      sortState.key = key; sortState.dir = 1;
    }
    applyFiltersAndRender();
  });
});

['searchBox','regionFilter','hubFilter','goliveFilter','integrationFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFiltersAndRender);
  document.getElementById(id).addEventListener('change', applyFiltersAndRender);
});

populateFilters();
applyFiltersAndRender();
</script>
</body>
</html>
