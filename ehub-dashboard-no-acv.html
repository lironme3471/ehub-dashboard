<style>
:root{--blue:#3694FC;--charcoal:#21212B;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f6fa;color:var(--charcoal);}
#gate{position:fixed;inset:0;background:#21212b;display:flex;align-items:center;justify-content:center;z-index:1000;}
#gate .card{background:#fff;border-radius:14px;padding:40px 48px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);max-width:380px;}
#gate .logo{font-size:28px;font-weight:800;margin-bottom:6px;}
#gate .logo span{color:var(--blue);}
#gate p{color:#666;font-size:14px;margin-bottom:18px;}
#gate input{width:100%;padding:11px 14px;border:2px solid #ddd;border-radius:8px;font-size:15px;margin-bottom:12px;outline:none;}
#gate input:focus{border-color:var(--blue);}
#gate button{width:100%;padding:11px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;}
#gate button:hover{background:#1f7de0;}
#gateErr{color:var(--coral);font-size:13px;margin-top:10px;display:none;}
#app{display:none;max-width:1500px;margin:0 auto;padding:24px;}
.banner{background:#fff8dc;border:1px solid #f0d980;border-radius:8px;padding:10px 16px;font-size:13.5px;margin-bottom:18px;color:#7a6210;}
header.top{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;}
header.top h1{font-size:24px;font-weight:800;}
header.top h1 span{color:var(--blue);}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:20px;}
.kpi{background:#fff;border-radius:12px;padding:16px 20px;box-shadow:0 2px 8px rgba(33,33,43,.07);border-top:4px solid var(--blue);}
.kpi .v{font-size:26px;font-weight:800;}
.kpi .l{font-size:12.5px;color:#777;margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.kpi.live{border-top-color:#22c55e}.kpi.delayed{border-top-color:var(--coral)}.kpi.eta{border-top-color:var(--blue)}.kpi.tbd{border-top-color:#9ca3af}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px;align-items:center;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #d6dbe4;border-radius:8px;font-size:13.5px;background:#fff;outline:none;}
.filters input{min-width:260px;}
.filters input:focus,.filters select:focus{border-color:var(--blue);}
.tablewrap{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(33,33,43,.07);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{background:var(--charcoal);color:#fff;text-align:left;padding:11px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:0;}
thead th .arrow{opacity:.6;font-size:10px;margin-left:4px;}
tbody td{padding:10px 12px;border-bottom:1px solid #eef1f5;vertical-align:middle;}
tr.grouphdr td{background:#e9f2fe;font-weight:700;font-size:12.5px;color:#1a4e8a;padding:8px 12px;border-bottom:1px solid #d3e4fa;}
tr.grouphdr .cnt{font-weight:500;color:#4a75a8;margin-left:8px;}
td a{color:var(--blue);text-decoration:none;font-weight:600;}
td a:hover{text-decoration:underline;}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;margin:1px 3px 1px 0;white-space:nowrap;}
.hub-rt{background:#e3f0ff;color:#1565c0;}
.hub-off{background:#d9fbf4;color:#0b7a66;}
.hub-both{background:#efe3ff;color:var(--indigo);}
.int-sr{background:#fff1e0;color:#c05f00;}
.int-tk{background:#f0e4ff;color:#7a1fd1;}
.int-amc{background:#e2f7e2;color:#1d7a2c;}
.gl{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.gl-live{background:#dcf7e3;color:#15803d;}
.gl-delayed{background:#ffe3ea;color:#c2185b;}
.gl-eta{background:#e3f0ff;color:#1565c0;}
.gl-tbd{background:#ececf0;color:#6b7280;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
tr.norows td{text-align:center;color:#888;padding:30px;}
</style>

const HASH = '0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621';
async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
async function checkPw(){const v=document.getElementById('pw').value;if(await sha256(v)===HASH){sessionStorage.setItem('ehub_auth','1');unlock();}else{document.getElementById('gateErr').style.display='block';}}
function unlock(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';}
if(sessionStorage.getItem('ehub_auth')==='1')unlock();

let sortKey=null,sortDir=1;
function setSort(k){if(sortKey===k){sortDir=-sortDir;}else{sortKey=k;sortDir=1;}render();}
function fmtDate(s){if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});}
function glSortVal(r){
  if(r.gl_status==='Live')return[0,''];
  if(r.gl_status==='TBD')return[2,''];
  return[1,r.gl_date||'9999-99-99'];
}
function sortVal(r,k){
  switch(k){
    case 'account':return r.account.toLowerCase();
    case 'name':return r.name.toLowerCase();
    case 'type':return r.type.toLowerCase();
    case 'int':return r.integrations.join(',').toLowerCase();
    case 'hub':return r.hub;
    case 'close':return r.close;
    case 'agents':return r.agents==null?-1:r.agents;
    case 'region':return r.region;
    case 'owner':return r.owner.toLowerCase();
  }
}
function hubBadge(h){const c=h==='RT + Offline'?'hub-both':(h==='Offline'?'hub-off':'hub-rt');return`<span class="badge ${c}">${h}</span>`;}
function intBadges(a){return a.map(i=>{const c=i==='SmartReach'?'int-sr':(i==='Ticketing'?'int-tk':'int-amc');return`<span class="badge ${c}">${i}</span>`;}).join('');}
function glBadge(r){
  const c={'Live':'gl-live','Delayed':'gl-delayed','ETA':'gl-eta','TBD':'gl-tbd'}[r.gl_status];
  let t=r.gl_status;
  if(r.gl_status==='Delayed'&&r.gl_date)t=`Delayed → ${fmtDate(r.gl_date)}`;
  else if(r.gl_status==='ETA'&&r.gl_date)t=`ETA ${fmtDate(r.gl_date)}`;
  return`<span class="gl ${c}">${t}</span>`;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function render(){
  const q=document.getElementById('fSearch').value.toLowerCase();
  const fr=document.getElementById('fRegion').value;
  const fh=document.getElementById('fHub').value;
  const fg=document.getElementById('fGl').value;
  const fi=document.getElementById('fInt').value;
  let rows=DATA.filter(r=>{
    if(q&&!(r.account.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)))return false;
    if(fr&&r.region!==fr)return false;
    if(fh&&r.hub!==fh)return false;
    if(fg&&r.gl_status!==fg)return false;
    if(fi==='__none__'&&r.integrations.length)return false;
    if(fi&&fi!=='__none__'&&!r.integrations.includes(fi))return false;
    return true;
  });
  document.getElementById('kTotal').textContent=rows.length;
  document.getElementById('kLive').textContent=rows.filter(r=>r.gl_status==='Live').length;
  document.getElementById('kDelayed').textContent=rows.filter(r=>r.gl_status==='Delayed').length;
  document.getElementById('kEta').textContent=rows.filter(r=>r.gl_status==='ETA').length;
  document.getElementById('kTbd').textContent=rows.filter(r=>r.gl_status==='TBD').length;
  document.querySelectorAll('.arrow').forEach(e=>e.textContent='');
  const tb=document.getElementById('tbody');
  if(!rows.length){tb.innerHTML='<tr class="norows"><td colspan="10">No deals match the current filters.</td></tr>';return;}
  let htmlOut='';
  const rowHtml=r=>`<tr>
    <td>${esc(r.account)}</td>
    <td><a href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${r.id}/view" target="_blank">${esc(r.name)}</a></td>
    <td>${esc(r.type)}</td>
    <td>${intBadges(r.integrations)}</td>
    <td>${hubBadge(r.hub)}</td>
    <td>${fmtDate(r.close)}</td>
    <td class="num">${r.agents==null?'':r.agents.toLocaleString()}</td>
    <td>${esc(r.region)}</td>
    <td>${glBadge(r)}</td>
    <td>${esc(r.owner)}</td>
  </tr>`;
  if(sortKey){
    document.getElementById('ar-'+sortKey).textContent=sortDir===1?'▲':'▼';
    rows=rows.slice().sort((a,b)=>{
      if(sortKey==='gl'){
        const va=glSortVal(a),vb=glSortVal(b);
        if(va[0]!==vb[0])return(va[0]-vb[0])*sortDir;
        return(va[1]<vb[1]?-1:va[1]>vb[1]?1:0)*sortDir;
      }
      const va=sortVal(a,sortKey),vb=sortVal(b,sortKey);
      return(va<vb?-1:va>vb?1:0)*sortDir;
    });
    htmlOut=rows.map(rowHtml).join('');
  }else{
    const groups={};
    rows.forEach(r=>{(groups[r.group]=groups[r.group]||[]).push(r);});
    const ordered=Object.entries(groups).sort((a,b)=>{
      const ma=Math.max(...a[1].map(r=>new Date(r.close).getTime()));
      const mb=Math.max(...b[1].map(r=>new Date(r.close).getTime()));
      return mb-ma;
    });
    ordered.forEach(([g,list])=>{
      list.sort((a,b)=>a.close<b.close?1:-1);
      htmlOut+=`<tr class="grouphdr"><td colspan="10">${esc(g)}<span class="cnt">${list.length} deal${list.length>1?'s':''}</span></td></tr>`;
      htmlOut+=list.map(rowHtml).join('');
    });
  }
  tb.innerHTML=htmlOut;
}
[...new Set(DATA.map(r=>r.region).filter(Boolean))].sort().forEach(v=>{
  const o=document.createElement('option');o.textContent=v;document.getElementById('fRegion').appendChild(o);
});
