<style>

  #gate-card button {

  #gate-card button:hover { background: #2578d6; }
  #gate-error { color: var(--coral); font-size: 12px; margin-top: 8px; min-height: 16px; }
  .nice-logo { font-weight: 800; font-size: 22px; color: var(--charcoal); margin-bottom: 14px; }

  #app { display: none; max-width: 1500px; margin: 0 auto; padding: 20px; }

  .banner {

  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }

  a.deal-link { color: var(--nice-blue); text-decoration: none; font-weight: 600; }

const PW_HASH = "0bfb1dbb009f33393aaecf5d1200f0d385131857335eea846225358486b37621";

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('gate-pw').value;
  const hash = await sha256(val);
  if (hash === PW_HASH) {
    sessionStorage.setItem('ehub_noacv_auth', '1');
    document.getElementById('gate-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initDashboard();
  } else {
    document.getElementById('gate-error').textContent = 'Incorrect password.';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('ehub_noacv_auth') === '1') {
    document.getElementById('gate-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    initDashboard();
  }
});

let sortState = { col: null, dir: 1 };
let grouped = true;

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function hubBadge(hub) {
  if (hub === 'RT + Offline') return '<span class="badge hub-both">RT + Offline</span>';
  if (hub === 'Offline') return '<span class="badge hub-offline">Offline</span>';
  return '<span class="badge hub-rt">Real-Time</span>';
}

function integrationBadges(list) {
  if (!list || !list.length) return '';
  return list.map(i => {
    const cls = i === 'SmartReach' ? 'int-smartreach' : (i === 'Ticketing' ? 'int-ticketing' : 'int-amc');
    return `<span class="badge ${cls}">${i}</span>`;
  }).join('');
}

function statusPill(status, dateStr) {
  const cls = 'status-' + status.toLowerCase();
  let label = status;
  if (status === 'Delayed' || status === 'ETA') {
    label = status + (dateStr ? ' · ' + fmtDate(dateStr) : '');
  }
  return `<span class="status-pill ${cls}">${label}</span>`;
}

function goLiveSortKey(d) {
  // Live sorts first, then Delayed+ETA merged by date asc, TBD last
  if (d.GoLiveStatus === 'Live') {
    return [0, d.GoLiveDate || d.CloseDate];
  } else if (d.GoLiveStatus === 'TBD') {
    return [2, d.CloseDate];
  } else {
    // Delayed or ETA merged
    return [1, d.GoLiveDate || '9999-99-99'];
  }
}

function populateFilterOptions() {
  const regions = [...new Set(DEALS.map(d => d.Region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.Hub))].sort();
  const statuses = ['Live', 'Delayed', 'ETA', 'TBD'];
  const integrations = [...new Set(DEALS.flatMap(d => d.Integration))].sort();

  const regionSel = document.getElementById('f-region');
  regions.forEach(r => regionSel.insertAdjacentHTML('beforeend', `<option value="${r}">${r}</option>`));

  const hubSel = document.getElementById('f-hub');
  hubs.forEach(h => hubSel.insertAdjacentHTML('beforeend', `<option value="${h}">${h}</option>`));

  const golSel = document.getElementById('f-golive');
  statuses.forEach(s => golSel.insertAdjacentHTML('beforeend', `<option value="${s}">${s}</option>`));

  const intSel = document.getElementById('f-integration');
  integrations.forEach(i => intSel.insertAdjacentHTML('beforeend', `<option value="${i}">${i}</option>`));
}

function getFiltered() {
  const search = document.getElementById('f-search').value.trim().toLowerCase();
  const region = document.getElementById('f-region').value;
  const hub = document.getElementById('f-hub').value;
  const golive = document.getElementById('f-golive').value;
  const integration = document.getElementById('f-integration').value;

  return DEALS.filter(d => {
    if (search && !(d.Account.toLowerCase().includes(search) || d.DealName.toLowerCase().includes(search))) return false;
    if (region && d.Region !== region) return false;
    if (hub && d.Hub !== hub) return false;
    if (golive && d.GoLiveStatus !== golive) return false;
    if (integration && !d.Integration.includes(integration)) return false;
    return true;
  });
}

function renderKpis(filtered) {
  const total = filtered.length;
  const live = filtered.filter(d => d.GoLiveStatus === 'Live').length;
  const delayed = filtered.filter(d => d.GoLiveStatus === 'Delayed').length;
  const eta = filtered.filter(d => d.GoLiveStatus === 'ETA').length;
  const tbd = filtered.filter(d => d.GoLiveStatus === 'TBD').length;

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="num">${total}</div><div class="label">Total Deals</div></div>
    <div class="kpi live"><div class="num">${live}</div><div class="label">Live</div></div>
    <div class="kpi delayed"><div class="num">${delayed}</div><div class="label">Delayed</div></div>
    <div class="kpi eta"><div class="num">${eta}</div><div class="label">ETA</div></div>
    <div class="kpi tbd"><div class="num">${tbd}</div><div class="label">TBD</div></div>
  `;
}

function dealRowHtml(d) {
  return `<tr class="deal-row">
    <td>${d.Account}</td>
    <td><a class="deal-link" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.Id}/view" target="_blank">${d.DealName}</a></td>
    <td>${d.Type || '—'}</td>
    <td>${integrationBadges(d.Integration)}</td>
    <td>${hubBadge(d.Hub)}</td>
    <td>${fmtDate(d.CloseDate)}</td>
    <td>${d.Agents != null ? d.Agents : '—'}</td>
    <td>${d.Region || '—'}</td>
    <td>${statusPill(d.GoLiveStatus, d.GoLiveDate)}</td>
    <td>${d.Owner || '—'}</td>
  </tr>`;
}

function renderTable() {
  const filtered = getFiltered();
  renderKpis(filtered);
  document.getElementById('result-count').textContent = `${filtered.length} deal${filtered.length !== 1 ? 's' : ''}`;

  const tbody = document.getElementById('table-body');

  if (filtered.length === 0) {
    tbody.innerHTML = `<tr class="no-results"><td colspan="10">No deals match the current filters.</td></tr>`;
    return;
  }

  let html = '';

  if (grouped) {
    const byGroup = {};
    filtered.forEach(d => { (byGroup[d.Group] = byGroup[d.Group] || []).push(d); });
    const groupsInOrder = GROUP_ORDER.filter(g => byGroup[g]);
    groupsInOrder.forEach(g => {
      const items = byGroup[g];
      html += `<tr class="group-header"><td colspan="10">${g} — ${items.length} deal${items.length !== 1 ? 's' : ''}</td></tr>`;
      items.forEach(d => { html += dealRowHtml(d); });
    });
  } else {
    let sorted = filtered.slice();
    const col = sortState.col;
    const dir = sortState.dir;
    sorted.sort((a, b) => {
      let av, bv;
      if (col === 'GoLive') {
        av = goLiveSortKey(a); bv = goLiveSortKey(b);
        if (av[0] !== bv[0]) return (av[0] - bv[0]) * dir;
        return (av[1] < bv[1] ? -1 : av[1] > bv[1] ? 1 : 0) * dir;
      } else if (col === 'Integration') {
        av = a.Integration.join(','); bv = b.Integration.join(',');
        return av.localeCompare(bv) * dir;
      } else if (col === 'Agents') {
        av = a.Agents == null ? -1 : a.Agents; bv = b.Agents == null ? -1 : b.Agents;
        return (av - bv) * dir;
      } else if (col === 'CloseDate') {
        return (a.CloseDate < b.CloseDate ? -1 : a.CloseDate > b.CloseDate ? 1 : 0) * dir;
      } else {
        av = (a[col] || '').toString().toLowerCase();
        bv = (b[col] || '').toString().toLowerCase();
        return av.localeCompare(bv) * dir;
      }
    });
    sorted.forEach(d => { html += dealRowHtml(d); });
  }

  tbody.innerHTML = html;
}

function setupSorting() {
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortState.col === col) {
        sortState.dir *= -1;
      } else {
        sortState.col = col;
        sortState.dir = 1;
      }
      grouped = false;
      document.querySelectorAll('thead th .arrow').forEach(a => a.textContent = '');
      th.querySelector('.arrow').textContent = sortState.dir === 1 ? '▲' : '▼';
      renderTable();
    });
  });
}

function initDashboard() {
  populateFilterOptions();
  setupSorting();
  ['f-search','f-region','f-hub','f-golive','f-integration'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderTable);
  });
  renderTable();
}
