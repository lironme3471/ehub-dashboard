<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Closed-Won Dashboard</title>
<style>
  :root {
    --nice-blue:#3694FC; --charcoal:#21212B; --indigo:#6100FF; --teal:#36EAD0; --coral:#FF5B8A;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Segoe UI',Arial,sans-serif; background:#f4f6f9; color:var(--charcoal); }

  /* Password gate */
  #gate {
    position:fixed; inset:0; background:var(--charcoal); display:flex; align-items:center; justify-content:center; z-index:1000;
  }
  #gate .card {
    background:#fff; border-radius:12px; padding:40px 36px; width:340px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35);
  }
  #gate h1 { color:var(--nice-blue); font-size:22px; margin:0 0 4px; }
  #gate p { color:#666; font-size:13px; margin:0 0 20px; }
  #gate input {
    width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:6px; font-size:14px; margin-bottom:14px;
  }
  #gate button {
    width:100%; padding:10px 12px; border:none; border-radius:6px; background:var(--nice-blue); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  #gate button:hover { background:#2578dd; }
  #gate .err { color:var(--coral); font-size:12px; margin-top:10px; min-height:14px; }

  #app { display:none; max-width:1500px; margin:0 auto; padding:20px; }

  .banner {
    background:#FFF3CD; border:1px solid #ffe08a; color:#7a5b00; padding:10px 16px; border-radius:8px; font-size:13px; margin-bottom:16px;
  }

  h1.title { font-size:22px; color:var(--charcoal); margin:0 0 16px; }

  .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:18px; }
  .kpi { background:#fff; border-radius:10px; padding:14px; text-align:center; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .kpi .val { font-size:22px; font-weight:700; color:var(--charcoal); }
  .kpi .lbl { font-size:11px; color:#888; text-transform:uppercase; letter-spacing:.03em; margin-top:2px; }
  .kpi.live .val { color:#1a9c5c; }
  .kpi.delayed .val { color:var(--coral); }
  .kpi.eta .val { color:var(--nice-blue); }

  .filters { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .filters input, .filters select {
    padding:8px 10px; border:1px solid #d5d9e0; border-radius:6px; font-size:13px; background:#fff;
  }
  .filters input { min-width:220px; }
  .count { font-size:12px; color:#777; margin-left:auto; }

  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  thead th {
    background:var(--charcoal); color:#fff; font-size:11px; text-transform:uppercase; letter-spacing:.03em;
    padding:10px 8px; text-align:left; cursor:pointer; white-space:nowrap; user-select:none;
  }
  thead th:hover { background:#33333f; }
  tbody td { padding:8px; font-size:12.5px; border-bottom:1px solid #eef0f3; vertical-align:middle; }
  tr.group-row td {
    background:#eef2f8; font-weight:700; font-size:12.5px; color:var(--charcoal); padding:9px 8px;
  }
  tr.deal-row:hover { background:#f7f9fc; }
  tr.deal-row.hidden, tr.group-row.hidden { display:none; }

  a.dealname { color:var(--nice-blue); text-decoration:none; font-weight:600; }
  a.dealname:hover { text-decoration:underline; }

  .pill { display:inline-block; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:600; color:#fff; white-space:nowrap; }
  .hub-offline { background:var(--teal); color:#0a3d38; }
  .hub-rt { background:var(--nice-blue); }
  .hub-both { background:var(--indigo); }

  .badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:10px; font-weight:700; color:#fff; margin-right:3px; }
  .badge-smartreach { background:#F5860A; }
  .badge-ticketing { background:#8A2BE2; }
  .badge-amc { background:#2E8B57; }

  .go-live { font-weight:600; font-size:11.5px; padding:2px 8px; border-radius:10px; white-space:nowrap; }
  .go-live.status-live { background:#e2f6ea; color:#1a9c5c; }
  .go-live.status-delayed { background:#ffe3ea; color:#c22156; }
  .go-live.status-eta { background:#e5f0ff; color:#215fc2; }
  .go-live.status-tbd { background:#eee; color:#888; }

  .caret { font-size:9px; margin-left:3px; opacity:.85; }
  .muted { color:#999; font-size:11px; }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1>eHub Dashboard</h1>
    <p>Enter password to continue</p>
    <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">

  </div>

  <div class="filters">
    <input type="text" id="fSearch" placeholder="Search account or deal name...">
    <select id="fRegion"><option value="">All Regions</option></select>
    <select id="fHub"><option value="">All Hub Types</option></select>
    <select id="fGolive"><option value="">All Go-Live Statuses</option></select>
    <span class="count" id="resultCount"></span>
  </div>

  <table>

      <tr id="headRow">

        <th data-col="name">Deal Name</th>
        <th data-col="contract_type">Type</th>

        <th data-col="hub">Hub</th>
        <th data-col="close_date">Close Date</th>
        <th data-col="acv">ACV</th>
        <th data-col="agents">Agents</th>
        <th data-col="region">Region</th>
        <th data-col="golive">Go-Live</th>
        <th data-col="owner">Owner</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const PW_HASH = "fa34e5bac87849343e48ccec9965e86629502a7f0c7c9f1e18abaa8a2240e673";

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === PW_HASH) {
    localStorage.setItem('ehub_dash_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}

if (localStorage.getItem('ehub_dash_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function fmtMoney(v, ccy) {
  const sym = ccy === 'USD' ? '$' : (ccy === 'GBP' ? '£' : (ccy === 'CAD' ? 'C$' : (ccy === 'AUD' ? 'A$' : ccy + ' ')));
  return sym + Number(v).toLocaleString(undefined, {maximumFractionDigits:0});
}

function hubClass(hub) {
  if (hub === 'RT + Offline') return 'hub-both';
  if (hub === 'Offline') return 'hub-offline';
  return 'hub-rt';
}

function golivePill(d) {
  const st = d.golive_status;
  const cls = 'status-' + st.toLowerCase();
  let label = st;
  if (st === 'Delayed' && d.golive_date) label = 'Delayed → ' + d.golive_date;
  if (st === 'ETA' && d.golive_date) label = 'ETA ' + d.golive_date;
  return `<span class="go-live ${cls}">${label}</span>`;
}

function integrationBadges(d) {
  let html = '';
  if (d.smartreach) html += '<span class="badge badge-smartreach">SmartReach</span>';
  if (d.ticketing) html += '<span class="badge badge-ticketing">Ticketing</span>';
  if (d.amc) html += '<span class="badge badge-amc">AMC</span>';
  return html;
}

let sortState = { col: null, dir: 0 }; // dir: 0=grouped, 1=asc, 2=desc

function golivesortkey(d) {
  if (d.golive_status === 'Live') return [0, d.close_date];
  if (d.golive_status === 'TBD') return [2, d.close_date];
  return [1, d.golive_date || '9999-99-99'];
}

function currentFiltered() {
  const search = document.getElementById('fSearch').value.toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const golive = document.getElementById('fGolive').value;
  return DEALS.filter(d => {
    if (search && !(d.account.toLowerCase().includes(search) || d.name.toLowerCase().includes(search) || d.top_parent.toLowerCase().includes(search))) return false;
    if (region && d.region !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (golive && d.golive_status !== golive) return false;
    return true;
  });
}

function dealRowHtml(d, showAccount) {
  return `<tr class="deal-row">
    <td>${showAccount ? (d.account !== d.top_parent ? `<span class="muted">${d.account}</span>` : '') : ''}</td>
    <td><a class="dealname" href="${d.sf_link}" target="_blank">${d.name}</a></td>
    <td>${d.contract_type}</td>
    <td>${integrationBadges(d)}</td>
    <td><span class="pill ${hubClass(d.hub)}">${d.hub}</span></td>
    <td>${d.close_date}</td>
    <td>${fmtMoney(d.acv, d.currency)} <span class="muted">${d.currency}</span></td>
    <td>${d.agents ?? ''}</td>
    <td>${d.region}</td>
    <td>${golivePill(d)}</td>
    <td>${d.owner}</td>
  </tr>`;
}

function render() {
  const filtered = currentFiltered();
  const tbody = document.getElementById('tbody');
  let rowsHtml = '';
  let accountCount = 0;

  if (sortState.dir === 0) {
    // grouped by top_parent, groups ordered by most recent close date desc
    const groups = {};
    filtered.forEach(d => {
      (groups[d.top_parent] = groups[d.top_parent] || []).push(d);
    });
    const groupKeys = Object.keys(groups);
    accountCount = groupKeys.length;
    const groupOrder = groupKeys.map(k => {
      const maxDate = groups[k].reduce((m, d) => d.close_date > m ? d.close_date : m, '0000-00-00');
      return [k, maxDate];
    }).sort((a,b) => b[1].localeCompare(a[1]));

    if (groupOrder.length === 0) {
      rowsHtml = `<tr><td colspan="11" style="text-align:center;padding:30px;color:#999;">No deals match the current filters.</td></tr>`;
    }

    groupOrder.forEach(([parent]) => {
      const rows = groups[parent].slice().sort((a,b) => a.close_date.localeCompare(b.close_date));
      const totalAcvUsd = rows.filter(d => d.currency === 'USD').reduce((s,d) => s + d.acv, 0);
      rowsHtml += `<tr class="group-row"><td colspan="11">${parent} — ${rows.length} deal${rows.length>1?'s':''} · USD ACV ${fmtMoney(totalAcvUsd,'USD')}</td></tr>`;
      rows.forEach(d => rowsHtml += dealRowHtml(d, true));
    });
  } else {
    accountCount = new Set(filtered.map(d => d.top_parent)).size;
    let sorted = filtered.slice();
    const col = sortState.col;
    sorted.sort((a,b) => {
      let av, bv;
      if (col === 'golive') {
        av = golivesortkey(a); bv = golivesortkey(b);
        let cmp = av[0]-bv[0]; if (cmp===0) cmp = String(av[1]).localeCompare(String(bv[1]));
        return sortState.dir === 1 ? cmp : -cmp;
      }
      if (col === 'acv') { av = a.acv; bv = b.acv; }
      else if (col === 'agents') { av = a.agents||0; bv = b.agents||0; }
      else if (col === 'close_date') { av = a.close_date; bv = b.close_date; }
      else if (col === 'integration') {
        av = (a.smartreach?1:0)+(a.ticketing?1:0)+(a.amc?1:0);
        bv = (b.smartreach?1:0)+(b.ticketing?1:0)+(b.amc?1:0);
      }
      else { av = (a[col]||'').toString().toLowerCase(); bv = (b[col]||'').toString().toLowerCase(); }
      if (av < bv) return sortState.dir === 1 ? -1 : 1;
      if (av > bv) return sortState.dir === 1 ? 1 : -1;
      return 0;
    });
    if (sorted.length === 0) {
      rowsHtml = `<tr><td colspan="11" style="text-align:center;padding:30px;color:#999;">No deals match the current filters.</td></tr>`;
    }
    sorted.forEach(d => rowsHtml += dealRowHtml(d, true));
  }

  tbody.innerHTML = rowsHtml;
  document.getElementById('resultCount').textContent = `${filtered.length} deals · ${accountCount} accounts`;

  // header carets
  document.querySelectorAll('#headRow th').forEach(th => {
    const col = th.dataset.col;
    let label = th.textContent.replace(/[▲▼]/g,'').trim();
    if (sortState.dir !== 0 && sortState.col === col) {
      label += sortState.dir === 1 ? ' ▲' : ' ▼';
    }
    th.textContent = label;
  });
}

function attachSort() {
  document.querySelectorAll('#headRow th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortState.col !== col) {
        sortState.col = col; sortState.dir = 1;
      } else if (sortState.dir === 1) {
        sortState.dir = 2;
      } else if (sortState.dir === 2) {
        sortState.col = null; sortState.dir = 0;
      } else {
        sortState.dir = 1;
      }
      render();
    });
  });
}

function populateFilters() {
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.hub))].sort();
  const golives = [...new Set(DEALS.map(d => d.golive_status))].sort();
  const rSel = document.getElementById('fRegion');
  regions.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; rSel.appendChild(o); });
  const hSel = document.getElementById('fHub');
  hubs.forEach(h => { const o=document.createElement('option'); o.value=h; o.textContent=h; hSel.appendChild(o); });
  const gSel = document.getElementById('fGolive');
  golives.forEach(g => { const o=document.createElement('option'); o.value=g; o.textContent=g; gSel.appendChild(o); });
}

function updateKpis() {
  document.getElementById('kpiTotal').textContent = DEALS.length;
  const usd = DEALS.filter(d => d.currency === 'USD').reduce((s,d) => s + d.acv, 0);
  document.getElementById('kpiAcv').textContent = fmtMoney(usd, 'USD');
  document.getElementById('kpiLive').textContent = DEALS.filter(d => d.golive_status==='Live').length;
  document.getElementById('kpiDelayed').textContent = DEALS.filter(d => d.golive_status==='Delayed').length;
  document.getElementById('kpiEta').textContent = DEALS.filter(d => d.golive_status==='ETA').length;
  document.getElementById('kpiTbd').textContent = DEALS.filter(d => d.golive_status==='TBD').length;
}

function init() {
  updateKpis();
  populateFilters();
  attachSort();
  ['fSearch','fRegion','fHub','fGolive'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });
  render();
}

if (localStorage.getItem('ehub_dash_auth') === '1') {
  init();
}
</script>
