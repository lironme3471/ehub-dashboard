function exportExcel(){

 const csv='﻿'+aoa.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='ehub-closed-won-'+stamp+'.csv';document.body.appendChild(a);a.click();a.remove();
}
