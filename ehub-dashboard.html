const GEN_DATE = '2026-07-27';

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPwd() {
  const val = document.getElementById('pwd-input').value;
  const h = await sha256(val);
  if (h === EXPECTED_HASH) {
    localStorage.setItem(LS_KEY, h);
    showDashboard();
  } else {
    document.getElementById('auth-error').style.display = 'block';
  }
}

document.getElementById('pwd-input').addEventListener('keypress', e => { if(e.key==='Enter') checkPwd(); });

async function initAuth() {
  const stored = localStorage.getItem(LS_KEY);
  if (stored === EXPECTED_HASH) { showDashboard(); return; }
  document.getElementById('auth-screen').style.display = 'flex';
}

function showDashboard() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('gen-banner').textContent = `Dashboard generated on ${GEN_DATE} — data reflects Salesforce as of that date.`;

  renderTable();

// ─── KPIs ─────────────────────────────────────────────────────────────────────
function renderKpis() {
  const total = DEALS.length;
  const usdAcv = DEALS.filter(d=>d.currency==='USD').reduce((s,d)=>s+d.acv,0);
  const live = DEALS.filter(d=>d.goLive==='Live').length;
  const delayed = DEALS.filter(d=>d.goLive==='Delayed').length;
  const eta = DEALS.filter(d=>d.goLive==='ETA').length;
  const tbd = DEALS.filter(d=>d.goLive==='TBD').length;
  const fmt = n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  document.getElementById('kpi-bar').innerHTML = `
    <div class="kpi"><div class="kpi-val">${total}</div><div class="kpi-label">Total Deals</div></div>
    <div class="kpi"><div class="kpi-val">${fmt(usdAcv)}</div><div class="kpi-label">USD ACV</div></div>
    <div class="kpi"><div class="kpi-val live">${live}</div><div class="kpi-label">Live</div></div>
    <div class="kpi"><div class="kpi-val delayed">${delayed}</div><div class="kpi-label">Delayed</div></div>
    <div class="kpi"><div class="kpi-val eta">${eta}</div><div class="kpi-label">ETA</div></div>
    <div class="kpi"><div class="kpi-val tbd">${tbd}</div><div class="kpi-label">TBD</div></div>
  `;
}

// ─── RENDERING ────────────────────────────────────────────────────────────────
let sortCol = 5, sortDir = -1; // default: close date desc
const collapseState = {};

function hubBadge(hub) {
  if (hub==='RT + Offline') return `<span class="badge badge-hub-rt-offline">RT + Offline</span>`;
  if (hub==='Offline') return `<span class="badge badge-hub-offline">Offline</span>`;
  return `<span class="badge badge-hub-rt">Real-Time</span>`;
}

function intBadges(ints) {
  return ints.map(i=>{
    if (i==='SmartReach') return `<span class="badge badge-int-smartreach">SmartReach</span>`;
    if (i==='Ticketing') return `<span class="badge badge-int-ticketing">Ticketing</span>`;
    if (i==='AMC') return `<span class="badge badge-int-amc">AMC</span>`;
    return '';
  }).join('');
}

function goLiveDisplay(d) {
  if (d.goLive==='Live') return `<span class="go-live-live">✓ Live</span>`;
  if (d.goLive==='Delayed') return `<span class="go-live-delayed">⚠ Delayed ${d.goLiveDate||''}</span>`;
  if (d.goLive==='ETA') return `<span class="go-live-eta">→ ETA ${d.goLiveDate||''}</span>`;
  return `<span class="go-live-tbd">— TBD</span>`;
}

function fmtAcv(d) {
  const sym = {USD:'$',GBP:'£',CAD:'CA$',AUD:'A$'}[d.currency]||'';
  if (!d.acv) return `<span style="color:#aaa">${sym}0</span>`;
  return sym + d.acv.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
}

function fmtDate(s) { return s ? s.replace(/-/g,'/') : '—'; }

function getFiltered() {
  const search = document.getElementById('f-search').value.toLowerCase();
  const region = document.getElementById('f-region').value;
  const hub = document.getElementById('f-hub').value;
  const golive = document.getElementById('f-golive').value;
  return DEALS.filter(d => {
    if (search && !d.account.toLowerCase().includes(search) && !d.name.toLowerCase().includes(search) && !d.topParent.toLowerCase().includes(search)) return false;
    if (region) {
      if (region==='—' && d.region) return false;
      if (region!=='—' && d.region!==region) return false;
    }
    if (hub && d.hub!==hub) return false;
    if (golive && d.goLive!==golive) return false;
    return true;
  });
}

function renderTable() {
  const filtered = getFiltered();
  // Group by topParent
  const groups = {};
  filtered.forEach(d => {
    const g = d.topParent||d.account;
    if (!groups[g]) groups[g] = {maxDate:'0000-00-00', deals:[]};
    groups[g].deals.push(d);
    if (d.closeDate > groups[g].maxDate) groups[g].maxDate = d.closeDate;
  });
  // Sort groups by maxDate desc
  const sortedGroups = Object.entries(groups).sort((a,b)=>b[1].maxDate.localeCompare(a[1].maxDate));
  // Sort deals within group
  sortedGroups.forEach(([,g])=>{
    g.deals.sort((a,b)=>{
      const av = sortVal(a,sortCol), bv = sortVal(b,sortCol);
      if (av < bv) return sortDir;
      if (av > bv) return -sortDir;
      return 0;
    });
  });
  const tbody = document.getElementById('deals-tbody');
  if (filtered.length===0) {
    tbody.innerHTML = `<tr><td colspan="11" class="no-results">No deals match the current filters.</td></tr>`;
    return;
  }
  let html = '';
  sortedGroups.forEach(([gName,g])=>{
    const collapsed = collapseState[gName]===true;
    const cnt = g.deals.length;
    html += `<tr class="group-header${collapsed?' group-collapsed':''}" onclick="toggleGroup('${gName.replace(/'/g,"\\'")}')"><td colspan="11">▾ ${gName} (${cnt} deal${cnt>1?'s':''})</td></tr>`;
    g.deals.forEach(d=>{
      html += `<tr class="deal-row${collapsed?' hidden-row':''}" data-group="${gName.replace(/"/g,'&quot;')}">
        <td>${d.account}</td>
        <td><a class="deal-link" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view" target="_blank" rel="noopener">${d.name}</a></td>
        <td style="font-size:12px;color:#556">${d.contractType||'—'}</td>
        <td>${d.integrations.length ? intBadges(d.integrations) : '<span style="color:#ccc">—</span>'}</td>
        <td>${hubBadge(d.hub)}</td>
        <td class="date-cell">${fmtDate(d.closeDate)}</td>
        <td class="acv-cell">${fmtAcv(d)}</td>
        <td class="agents-cell">${d.agents!=null?d.agents.toLocaleString():'—'}</td>
        <td class="region-cell">${d.region||'—'}</td>
        <td>${goLiveDisplay(d)}</td>
        <td style="font-size:12px">${d.owner||'—'}</td>
      </tr>`;
    });
  });
  tbody.innerHTML = html;
  updateSortHeaders();
}

function toggleGroup(gName) {
  collapseState[gName] = !collapseState[gName];
  renderTable();
}

function applyFilters() { renderTable(); }

function sortVal(d, col) {
  switch(col) {
    case 0: return d.account||'';
    case 1: return d.name||'';
    case 2: return d.contractType||'';
    case 3: return d.integrations.join(',')||'';
    case 4: return d.hub||'';
    case 5: return d.closeDate||'';
    case 6: return d.acv||0;
    case 7: return d.agents!=null?d.agents:Infinity;
    case 8: return d.region||'ZZZZZ';
    case 9: return d.goLive||'';
    case 10: return d.owner||'';
    default: return '';
  }
}

function sortTable(col) {
  if (sortCol===col) sortDir*=-1;
  else { sortCol=col; sortDir=-1; }
  renderTable();
}

function updateSortHeaders() {
  document.querySelectorAll('th').forEach((th,i)=>{
    th.classList.remove('sort-asc','sort-desc');
    if (i===sortCol) th.classList.add(sortDir===1?'sort-asc':'sort-desc');
  });
}

initAuth();
</script>
