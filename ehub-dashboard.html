function fmtACV(d) {
  const sym = d.Cur === "USD" ? "$" : d.Cur + " ";
  return sym + Number(d.ACV).toLocaleString(undefined, {maximumFractionDigits:0});
}

function hubClass(h) {
  if (h === "Offline") return "hub-offline";
  if (h === "Real-Time") return "hub-rt";
  return "hub-both";
}

function integBadgeClass(name) {
  if (name === "SmartReach") return "b-smartreach";
  if (name === "Ticketing") return "b-ticketing";
  if (name === "AMC") return "b-amc";
  if (name === "Cisco") return "b-cisco";
  if (name === "Avaya") return "b-avaya";
  if (name === "Genesys SIPREC") return "b-siprec";
  if (name === "MS Teams") return "b-teams";
  return "";
}

function renderBadges(d) {
  let out = "";
  const list = (d.Hub === "Offline" || d.Hub === "RT + Offline") ? d.IntegBadges : [];
  const acd = (d.Hub === "Real-Time" || d.Hub === "RT + Offline") ? d.ACDBadges : [];
  for (const b of list) out += `<span class="badge ${integBadgeClass(b)}">${b}</span>`;
  for (const b of acd) out += `<span class="badge ${integBadgeClass(b)}">${b}</span>`;
  return out;
}

function statusClass(s) {
  if (s === "Live") return "status-live";
  if (s === "Delayed") return "status-delayed";
  if (s === "ETA") return "status-eta";
  return "status-tbd";
}

function golabel(d) {
  if (d.GoLiveStatus === "Live") return "Live";
  if (d.GoLiveStatus === "TBD") return "TBD";
  return d.GoLiveStatus + " " + d.GoLiveDate;
}

// sort key for Go-Live: Live first (0), then Delayed+ETA merged by date, TBD last
function goliveSortKey(d) {
  if (d.GoLiveStatus === "Live") return [0, ""];
  if (d.GoLiveStatus === "TBD") return [2, ""];
  return [1, d.GoLiveDate || ""];
}

function regionLabel(d) { return d.Region || "TBD"; }

function populateFilters() {

  DATA.forEach(d => regions.add(regionLabel(d)));
  const sel = document.getElementById("fRegion");
  [...regions].sort().forEach(r => {
    const o = document.createElement("option"); o.value = r; o.textContent = r; sel.appendChild(o);
  });
}

function matchesFilters(d) {

  const fRegion = document.getElementById("fRegion").value;
  const fHub = document.getElementById("fHub").value;
  const fGoLive = document.getElementById("fGoLive").value;
  if (q && !(d.Account.toLowerCase().includes(q) || d.Name.toLowerCase().includes(q))) return false;
  if (fRegion && regionLabel(d) !== fRegion) return false;
  if (fHub && d.Hub !== fHub) return false;
  if (fGoLive && d.GoLiveStatus !== fGoLive) return false;
  return true;
}

        av = goliveSortKey(a); bv = goliveSortKey(b);
        if (av[0] !== bv[0]) return (av[0] - bv[0]) * sortDir;
        return (av[1] < bv[1] ? -1 : av[1] > bv[1] ? 1 : 0) * sortDir;
      } else if (sortCol === "ACV") {
        av = a.ACV; bv = b.ACV;
        return (av - bv) * sortDir;
      } else if (sortCol === "Agents") {
        av = a.Agents || 0; bv = b.Agents || 0;
        return (av - bv) * sortDir;
      } else if (sortCol === "CloseDate") {
        av = a.CloseDate; bv = b.CloseDate;
        return (av < bv ? -1 : av > bv ? 1 : 0) * sortDir;
      } else if (sortCol === "Integration") {
        av = (a.IntegBadges.concat(a.ACDBadges)).join(","); bv = (b.IntegBadges.concat(b.ACDBadges)).join(",");
        return av.localeCompare(bv) * sortDir;
      } else if (sortCol === "Region") {
        av = regionLabel(a); bv = regionLabel(b);
        return av.localeCompare(bv) * sortDir;
      } else {
        av = (a[sortCol] || "").toString(); bv = (b[sortCol] || "").toString();
        return av.localeCompare(bv) * sortDir;
      }
    });
    shownDeals = sorted.length;
    shownAccounts = new Set(sorted.map(d => d.TopParent)).size;
    if (sorted.length === 0) {
      rowsHtml = `<tr><td colspan="11">No matching deals.</td></tr>`;
    } else {
      for (const d of sorted) rowsHtml += dealRowHtml(d, true);
    }
  } else {
    for (const g of GROUP_ORDER) {
      const gdeals = filtered.filter(d => d.TopParent === g);
      if (gdeals.length === 0) continue;
      shownAccounts++;
      shownDeals += gdeals.length;
      gdeals.sort((a, b) => a.CloseDate < b.CloseDate ? -1 : a.CloseDate > b.CloseDate ? 1 : 0);
      const totalAcv = gdeals.reduce((s, d) => s + (d.Cur === "USD" ? d.ACV : 0), 0);
      const acds = new Set();
      gdeals.forEach(d => (d.Hub !== "Offline" ? d.ACDBadges : []).forEach(a => acds.add(a)));
      let acdHtml = "";
      acds.forEach(a => acdHtml += `<span class="badge ${integBadgeClass(a)}">${a}</span>`);
      rowsHtml += `<tr class="group-header" data-group="${g}"><td colspan="11">${g} — ${gdeals.length} deal(s) ${acdHtml} — $${Math.round(totalAcv).toLocaleString()} USD</td></tr>`;
      if (!collapsedGroups[g]) {
        for (const d of gdeals) rowsHtml += dealRowHtml(d, false);
      }
    }
    if (shownDeals === 0) {
      rowsHtml = `<tr><td colspan="11">No matching deals.</td></tr>`;
    }
  }

  tbody.innerHTML = rowsHtml;
  document.getElementById("countLabel").textContent = `${shownDeals} deals · ${shownAccounts} accounts`;

  tbody.querySelectorAll("tr.group-header").forEach(tr => {
    tr.addEventListener("click", () => {
      const g = tr.getAttribute("data-group");
      collapsedGroups[g] = !collapsedGroups[g];
      render();
    });
  });
}

document.querySelectorAll("th[data-col]").forEach(th => {
  th.addEventListener("click", () => {
    const col = th.getAttribute("data-col");
    if (sortCol === col) {
      if (sortDir === 1) { sortDir = -1; }
      else { sortCol = null; sortDir = 1; }
    } else {
      sortCol = col; sortDir = 1;
    }
    document.querySelectorAll("th[data-col]").forEach(t => t.innerHTML = t.innerHTML.replace(/ <span class="sort-arrow">.*<\/span>/, ""));
    if (sortCol) {
      th.innerHTML += ` <span class="sort-arrow">${sortDir === 1 ? "▲" : "▼"}</span>`;
    }
    render();
  });
});

async function sha256hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPwd() {
  const val = document.getElementById("pwd").value;
  const hash = await sha256hex(val);
  if (hash === PWD_HASH) {
    localStorage.setItem("ehub_cw_auth", hash);
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
  } else {
    document.getElementById("err").textContent = "Incorrect password.";
  }
}

(function() {
  const saved = localStorage.getItem("ehub_cw_auth");
  if (saved === PWD_HASH) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
  }
})();

populateFilters();
render();
</script>
