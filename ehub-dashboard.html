<style>

    --nice-coral: #FF5B8A;
    --nice-orange: #FF8C00;
    --nice-purple: #9B59B6;
    --nice-green: #27AE60;
    --bg: #F4F6FA;
    --card-bg: #FFFFFF;
    --border: #E2E8F0;
    --text-muted: #64748B;
    --text: #1E293B;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Be Vietnam Pro', 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; }

  /* PASSWORD GATE */
  #gate { position: fixed; inset: 0; background: var(--nice-charcoal); display: flex; align-items: center; justify-content: center; z-index: 9999; flex-direction: column; gap: 16px; }
  #gate h2 { color: #fff; font-size: 22px; font-weight: 700; }
  #gate p { color: #94A3B8; font-size: 13px; }
  #gate input { padding: 10px 16px; border-radius: 8px; border: 2px solid #334155; background: #1E293B; color: #fff; font-size: 15px; width: 280px; outline: none; }
  #gate input:focus { border-color: var(--nice-blue); }
  #gate button { padding: 10px 28px; background: var(--nice-blue); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #gate button:hover { background: #2878D8; }
  #gate .err { color: var(--nice-coral); font-size: 12px; min-height: 16px; }

  /* MAIN */
  #app { display: none; }
  .banner { background: #FEF3C7; border-bottom: 1px solid #FCD34D; padding: 8px 24px; font-size: 12px; color: #92400E; font-weight: 500; }
  .header { background: var(--nice-charcoal); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .sub { font-size: 12px; color: #94A3B8; margin-left: auto; }
  .logo { font-size: 22px; font-weight: 900; color: var(--nice-blue); letter-spacing: -1px; }

  /* KPI */
  .kpis { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
  .kpi { background: var(--card-bg); border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 120px; border: 1px solid var(--border); }
  .kpi .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .kpi .value { font-size: 26px; font-weight: 800; color: var(--nice-charcoal); }
  .kpi .value.blue { color: var(--nice-blue); }
  .kpi .value.green { color: #22C55E; }
  .kpi .value.red { color: var(--nice-coral); }
  .kpi .value.amber { color: #F59E0B; }
  .kpi .value.gray { color: var(--text-muted); }

  /* FILTERS */
  .filters { padding: 0 24px 12px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .filters input, .filters select { padding: 7px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 12px; background: var(--card-bg); color: var(--text); outline: none; }
  .filters input:focus, .filters select:focus { border-color: var(--nice-blue); }
  .filters input { width: 240px; }
  .filters label { font-size: 11px; color: var(--text-muted); }
  .filter-group { display: flex; flex-direction: column; gap: 3px; }

  /* TABLE */
  .table-wrap { padding: 0 24px 32px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); font-size: 12px; }
  thead { background: var(--nice-charcoal); color: #fff; }
  th { padding: 10px 12px; text-align: left; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; cursor: pointer; white-space: nowrap; user-select: none; }
  th:hover { background: #2D3748; }
  th.sorted-asc::after { content: ' ↑'; }
  th.sorted-desc::after { content: ' ↓'; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #F8FAFC; }
  .group-row td { background: #F1F5F9; font-weight: 700; font-size: 11px; color: var(--nice-charcoal); letter-spacing: .3px; border-bottom: 2px solid var(--border); padding: 6px 12px; text-transform: uppercase; }
  .no-results td { text-align: center; padding: 24px; color: var(--text-muted); font-style: italic; }

  /* DEAL NAME LINK */
  .deal-link { color: var(--nice-blue); text-decoration: none; font-weight: 500; }
  .deal-link:hover { text-decoration: underline; }

  /* BADGES */
  .badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; margin: 1px; white-space: nowrap; }
  .hub-rt { background: #DBEAFE; color: var(--nice-blue); }
  .hub-offline { background: #CCFBF1; color: #0F766E; }

  .int-amc { background: #DCFCE7; color: #166534; }
  .gl-live { background: #DCFCE7; color: #166534; font-weight: 700; }
  .gl-delayed { background: #FEE2E2; color: #DC2626; }
  .gl-eta { background: #FEF3C7; color: #92400E; }
  .gl-tbd { background: #F1F5F9; color: #64748B; }

  .acv { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .acv-usd { font-weight: 600; }
  .acv-other { color: var(--text-muted); }

  .count-chip { background: #E2E8F0; color: var(--text-muted); font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
</style>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="logo">NiCE</div>
  <h2>eHub Dashboard</h2>
  <p>Enter password to continue</p>
  <input type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
  <button onclick="checkPw()">Unlock</button>
  <div class="err" id="pwErr"></div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div class="banner" id="dateBanner"></div>
  <div class="header">
    <span class="logo">NiCE</span>
    <h1>eHub Closed Won Pipeline</h1>
    <span class="sub">Engagement Hub · Closed Won Deals</span>
  </div>

  <div class="kpis" id="kpiRow"></div>
  <div class="filters">
    <div class="filter-group">
      <label>Search</label>
      <input type="text" id="fSearch" placeholder="Account or deal name…" oninput="renderTable()">
    </div>
    <div class="filter-group">
      <label>Region</label>
      <select id="fRegion" onchange="renderTable()">
        <option value="">All Regions</option>
        <option>Americas</option>
        <option>International</option>
        <option>EMEA</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Hub Type</label>
      <select id="fHub" onchange="renderTable()">
        <option value="">All Hub Types</option>
        <option>Real-Time</option>
        <option>Offline</option>
        <option>RT + Offline</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Go-Live Status</label>
      <select id="fGL" onchange="renderTable()">
        <option value="">All Statuses</option>
        <option>Live</option>
        <option>Delayed</option>
        <option>ETA</option>
        <option>TBD</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table id="mainTable">
      <thead>
        <tr>
          <th onclick="sortBy('topParent')">Account</th>
          <th onclick="sortBy('name')">Deal Name</th>
          <th onclick="sortBy('type')">Type</th>
          <th>Integration</th>
          <th onclick="sortBy('hub')">Hub</th>
          <th onclick="sortBy('closeDate')">Close Date</th>
          <th onclick="sortBy('acv')">ACV</th>
          <th onclick="sortBy('agents')">Agents</th>
          <th onclick="sortBy('region')">Region</th>
          <th onclick="sortBy('glSort')">Go-Live</th>
          <th onclick="sortBy('owner')">Owner</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
const HASH = 'fa34e5bac87849343e48ccec9965e86629502a7f0c7c9f1e18abaa8a2240e673';

async function sha256(msg) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const h = await sha256(val);
  if (h === HASH) {
    localStorage.setItem('ehub_auth', h);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}

window.addEventListener('DOMContentLoaded', async () => {
  const saved = localStorage.getItem('ehub_auth');
  if (saved === HASH) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  }
});

// ── SORT STATE ────────────────────────────────────────────────────────────────
let sortCol = null, sortDir = 1;

function glSortKey(d) {
  const s = d.goLive.status;
  if (s === 'Live') return '0_' + (d.goLive.date||'');
  if (s === 'Delayed') return '1_' + (d.goLive.date||'');
  if (s === 'ETA') return '2_' + (d.goLive.date||'');
  return '3_';
}

function sortBy(col) {
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
  document.querySelectorAll('th').forEach(th => th.classList.remove('sorted-asc','sorted-desc'));
  const ths = document.querySelectorAll('th');
  const cols = ['topParent','name','type','_int','hub','closeDate','acv','agents','region','glSort','owner'];
  const idx = ['topParent','name','type','_int','hub','closeDate','acv','agents','region','glSort','owner'].indexOf(col);
  if (idx >= 0) {
    ths[idx].classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
  }
  renderTable();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
function init() {
  document.getElementById('dateBanner').textContent =
    'Dashboard generated on 2026-07-20 — data reflects Salesforce as of that date.';

  // KPIs
  const usdACV = DATA.filter(d=>d.currency==='USD').reduce((s,d)=>s+d.acv,0);
  const live = DATA.filter(d=>d.goLive.status==='Live').length;
  const delayed = DATA.filter(d=>d.goLive.status==='Delayed').length;
  const eta = DATA.filter(d=>d.goLive.status==='ETA').length;
  const tbd = DATA.filter(d=>d.goLive.status==='TBD').length;

  const kpiRow = document.getElementById('kpiRow');
  kpiRow.innerHTML = `
    <div class="kpi"><div class="label">Total Deals</div><div class="value blue">${DATA.length}</div></div>
    <div class="kpi"><div class="label">USD ACV</div><div class="value">${fmtUSD(usdACV)}</div></div>
    <div class="kpi"><div class="label">Live</div><div class="value green">${live}</div></div>
    <div class="kpi"><div class="label">Delayed</div><div class="value red">${delayed}</div></div>
    <div class="kpi"><div class="label">ETA</div><div class="value amber">${eta}</div></div>
    <div class="kpi"><div class="label">TBD</div><div class="value gray">${tbd}</div></div>
  `;

  renderTable();
}

function fmtUSD(n) {
  if (n >= 1e6) return '$' + (n/1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n/1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}

function fmtACV(d) {
  const n = d.acv;
  const sym = {USD:'$',GBP:'£',CAD:'CA$',AUD:'A$'}[d.currency]||'';
  if (n === 0) return '<span class="acv acv-other">—</span>';
  if (n >= 1e6) return `<span class="acv ${d.currency==='USD'?'acv-usd':'acv-other'}">${sym}${(n/1e6).toFixed(2)}M${d.currency!=='USD'?' '+d.currency:''}</span>`;
  if (n >= 1e3) return `<span class="acv ${d.currency==='USD'?'acv-usd':'acv-other'}">${sym}${(n/1e3).toFixed(1)}K${d.currency!=='USD'?' '+d.currency:''}</span>`;
  return `<span class="acv ${d.currency==='USD'?'acv-usd':'acv-other'}">${sym}${n.toLocaleString()}${d.currency!=='USD'?' '+d.currency:''}</span>`;
}

function fmtGL(gl) {
  const {status, date} = gl;
  const d = date ? date.slice(0,7) : ''; // show YYYY-MM
  if (status==='Live') return '<span class="badge gl-live">✓ Live</span>';
  if (status==='Delayed') return `<span class="badge gl-delayed">⚠ Delayed ${d}</span>`;
  if (status==='ETA') return `<span class="badge gl-eta">◷ ETA ${d}</span>`;
  return '<span class="badge gl-tbd">TBD</span>';
}

function fmtHub(hub) {
  if (hub==='RT + Offline') return '<span class="badge hub-rtoffline">RT + Offline</span>';
  if (hub==='Offline') return '<span class="badge hub-offline">Offline</span>';
  return '<span class="badge hub-rt">Real-Time</span>';
}

function fmtInt(ints) {
  return ints.map(i => {
    if (i==='SmartReach') return '<span class="badge int-smartreach">SmartReach</span>';
    if (i==='Ticketing') return '<span class="badge int-ticketing">Ticketing</span>';
    if (i==='AMC') return '<span class="badge int-amc">AMC</span>';
    return '';
  }).join('');
}

function filtered() {
  const search = document.getElementById('fSearch').value.toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const gl = document.getElementById('fGL').value;
  return DATA.filter(d => {
    if (search && !d.topParent.toLowerCase().includes(search) && !d.accountName.toLowerCase().includes(search) && !d.name.toLowerCase().includes(search)) return false;
    if (region && (d.region||'') !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (gl && d.goLive.status !== gl) return false;
    return true;
  });
}

function renderTable() {
  let rows = filtered();

  // Sort within groups if sortCol set
  if (sortCol) {
    rows = [...rows].sort((a,b) => {
      let va, vb;
      if (sortCol==='glSort') { va=glSortKey(a); vb=glSortKey(b); }
      else if (sortCol==='acv') { va=a.acv; vb=b.acv; }
      else if (sortCol==='agents') { va=a.agents||0; vb=b.agents||0; }
      else { va=(a[sortCol]||'').toString().toLowerCase(); vb=(b[sortCol]||'').toString().toLowerCase(); }
      if (va < vb) return -sortDir;
      if (va > vb) return sortDir;
      return 0;
    });
  }

  // Group by topParent
  const groupMap = new Map();
  rows.forEach(d => {
    if (!groupMap.has(d.topParent)) groupMap.set(d.topParent, []);
    groupMap.get(d.topParent).push(d);
  });

  // Sort groups by max closeDate desc (unless user sorted)
  const groups = [...groupMap.entries()];
  if (!sortCol) {
    groups.sort((a,b) => {
      const ma = Math.max(...a[1].map(d=>d.closeDate));
      const mb = Math.max(...b[1].map(d=>d.closeDate));
      return mb > ma ? 1 : mb < ma ? -1 : 0;
    });
    // Sort within group by closeDate desc
    groups.forEach(([,ds]) => ds.sort((a,b) => b.closeDate.localeCompare(a.closeDate)));
  }

  const tbody = document.getElementById('tbody');
  if (groups.length === 0) {
    tbody.innerHTML = '<tr class="no-results"><td colspan="11">No deals match the current filters.</td></tr>';
    return;
  }

  let html = '';
  groups.forEach(([grp, ds]) => {
    html += `<tr class="group-row"><td colspan="11">${grp}<span class="count-chip">${ds.length}</span></td></tr>`;
    ds.forEach(d => {
      const sfUrl = `https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view`;
      html += `<tr>
        <td>${d.accountName}</td>
        <td><a class="deal-link" href="${sfUrl}" target="_blank">${d.name}</a></td>
        <td>${d.type||'—'}</td>
        <td>${fmtInt(d.integration)||'—'}</td>
        <td>${fmtHub(d.hub)}</td>
        <td>${d.closeDate}</td>
        <td>${fmtACV(d)}</td>
        <td>${d.agents != null ? d.agents.toLocaleString() : '—'}</td>
        <td>${d.region||'—'}</td>
        <td>${fmtGL(d.goLive)}</td>
        <td>${d.owner||'—'}</td>
      </tr>`;
    });
  });
  tbody.innerHTML = html;
}
