<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Closed-Won Dashboard</title>
<style>
  :root {
    --blue: #3694FC;
    --charcoal: #21212B;
    --indigo: #6100FF;
    --teal: #36EAD0;
    --coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f4f6fb;
    color: var(--charcoal);
  }
  #gate {
    position: fixed; inset: 0; background: var(--charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #gate .card {
    background: #fff; border-radius: 12px; padding: 40px 36px; width: 320px;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.3);
  }
  #gate h2 { margin: 0 0 6px; color: var(--charcoal); }
  #gate p { color: #666; font-size: 13px; margin-bottom: 20px; }
  #gate input {
    width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px;
    font-size: 14px; margin-bottom: 12px;
  }
  #gate button {
    width: 100%; padding: 10px; border: none; border-radius: 6px;
    background: var(--blue); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #gate .err { color: var(--coral); font-size: 12px; height: 16px; margin-top: 4px; }
  #app { display: none; padding: 20px 28px 60px; max-width: 1400px; margin: 0 auto; }
  .banner {
    background: #FFEA9E; color: #5c4400; padding: 10px 16px; border-radius: 8px;
    font-size: 13px; margin-bottom: 16px; font-weight: 600;
  }
  h1 { font-size: 22px; margin: 4px 0 18px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi { background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .kpi .v { font-size: 22px; font-weight: 700; color: var(--charcoal); }
  .kpi .l { font-size: 11px; color: #777; text-transform: uppercase; letter-spacing: .04em; margin-top:2px;}
  .filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center;}
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
  }
  .filters input[type=text] { flex: 1; min-width: 220px; }
  .count { font-size: 12px; color: #666; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08);}
  th, td { padding: 9px 10px; font-size: 12.5px; text-align: left; border-bottom: 1px solid #eee; }
  th { background: var(--charcoal); color: #fff; cursor: pointer; user-select: none; white-space: nowrap; }
  th .arrow { font-size: 10px; margin-left: 3px; }
  tr.group-header td {
    background: #eef3fb; font-weight: 700; cursor: pointer; color: var(--charcoal);
    border-top: 2px solid #d8e2f3;
  }
  tr.deal-row.child { }
  tr.deal-row td:first-child { padding-left: 22px; color: #888; }
  tr.deal-row.flat td:first-child { padding-left: 10px; color: var(--charcoal); }
  a.dealname { color: var(--blue); text-decoration: none; font-weight: 600; }
  a.dealname:hover { text-decoration: underline; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; }
  .pill.rt { background: var(--blue); }
  .pill.offline { background: var(--teal); color: #21212B; }
  .pill.rtoffline { background: var(--indigo); }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 700; margin-right: 3px; color: #fff; }
  .badge.smartreach { background: #FF8A3D; }
  .badge.ticketing { background: #8B5CF6; }
  .badge.amc { background: #22A06B; }
  .gl { font-weight: 600; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .gl.live { background: #DFF5E1; color: #1E7B34; }
  .gl.delayed { background: #FFE1EA; color: #B3264D; }
  .gl.eta { background: #DCEBFF; color: #1D5FBF; }
  .gl.tbd { background: #EEE; color: #777; }
  .noresults td { text-align: center; color: #999; padding: 30px; }
</style>
</head>

<div id="gate">
  <div class="card">
    <h2>eHub Dashboard</h2>
    <p>Enter password to continue</p>
    <input type="password" id="pwInput" placeholder="Password" />
    <button id="pwBtn">Access Dashboard</button>
    <div class="err" id="pwErr"></div>
  </div>
</div>

<div id="app">

  </div>

  <div class="filters">
    <input type="text" id="fSearch" placeholder="Search account or deal name...">
    <select id="fRegion"><option value="">All Regions</option></select>
    <select id="fHub"><option value="">All Hub Types</option></select>
    <select id="fGoLive"><option value="">All Go-Live Status</option></select>

  <div class="count" id="countLabel"></div>

  <table>

        <th data-col="region">Region</th>
        <th data-col="goLiveSort">Go-Live</th>
        <th data-col="owner">Owner</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

const PW_HASH = "fa34e5bac87849343e48ccec9965e86629502a7f0c7c9f1e18abaa8a2240e673";

async function sha256(msg) {
  const enc = new TextEncoder().encode(msg);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const hash = await sha256(val);
  if (hash === PW_HASH) {
    sessionStorage.setItem('ehub_auth', '1');
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}
document.getElementById('pwBtn').addEventListener('click', checkPw);
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPw(); });
if (sessionStorage.getItem('ehub_auth') === '1') {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
}

function fmtUSD(n) {
  return '$' + Math.round(n).toLocaleString('en-US');
}
function fmtACV(d) {
  const native = d.acv.toLocaleString('en-US', {maximumFractionDigits:0});
  if (d.currency === 'USD') return '$' + native;
  return d.currency + ' ' + native;
}
function hubPill(hub) {
  if (hub === 'RT + Offline') return '<span class="pill rtoffline">RT + Offline</span>';
  if (hub === 'Offline') return '<span class="pill offline">Offline</span>';
  return '<span class="pill rt">Real-Time</span>';
}
function badgeHtml(badges) {
  return badges.map(b => `<span class="badge ${b.toLowerCase()}">${b}</span>`).join('');
}
function glHtml(d) {
  const cls = d.goLiveStatus.toLowerCase();
  let label = d.goLiveStatus;
  if (d.goLiveDetail && d.goLiveStatus !== 'Live') label += ' · ' + d.goLiveDetail;
  return `<span class="gl ${cls}">${label}</span>`;
}
function sfLink(d) {
  return `<a class="dealname" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view" target="_blank">${d.name}</a>`;
}

let sortState = { col: null, dir: 1 };
let collapsed = {};

function getFiltered() {
  const q = document.getElementById('fSearch').value.trim().toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const gl = document.getElementById('fGoLive').value;
  return DEALS.filter(d => {
    if (q && !(d.account||'').toLowerCase().includes(q) && !(d.name||'').toLowerCase().includes(q)) return false;
    if (region && d.region !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (gl && d.goLiveStatus !== gl) return false;
    return true;
  });
}

function render() {
  const filtered = getFiltered();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  const accounts = new Set(filtered.map(d => d.topParent));
  document.getElementById('countLabel').textContent = `${filtered.length} deals · ${accounts.size} accounts`;

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="noresults"><td colspan="11">No deals match the current filters.</td></tr>';
    updateHeaderArrows();
    return;
  }

  if (sortState.col) {
    const dir = sortState.dir;
    const col = sortState.col;
    const sorted = [...filtered].sort((a,b) => {
      let av = a[col], bv = b[col];
      if (col === 'acv') { av = a.acv; bv = b.acv; }
      if (typeof av === 'string') av = av.toLowerCase();
      if (typeof bv === 'string') bv = bv.toLowerCase();
      if (av === undefined || av === null) av = '';
      if (bv === undefined || bv === null) bv = '';
      if (av < bv) return -1*dir;
      if (av > bv) return 1*dir;
      return 0;
    });
    for (const d of sorted) {
      tbody.appendChild(makeRow(d, true));
    }
  } else {
    // grouped by topParent, groups ordered by most recent close date desc
    const groups = {};
    for (const d of filtered) {
      (groups[d.topParent] = groups[d.topParent] || []).push(d);
    }
    const groupList = Object.keys(groups).map(name => {
      const rows = groups[name].slice().sort((a,b) => b.closeDate.localeCompare(a.closeDate));
      const mostRecent = rows[0].closeDate;
      const totalAcvUsd = rows.filter(r=>r.currency==='USD').reduce((s,r)=>s+r.acv,0);
      const hubset = new Set(rows.map(r=>r.hub));
      return { name, rows, mostRecent, totalAcvUsd, count: rows.length, hubset };
    });
    groupList.sort((a,b) => b.mostRecent.localeCompare(a.mostRecent));

    for (const g of groupList) {
      const tr = document.createElement('tr');
      tr.className = 'group-header';
      const hubBadges = [...g.hubset].map(hubPill).join(' ');
      tr.innerHTML = `<td colspan="11">${g.name} &nbsp; <span style="color:#888;font-weight:500;">(${g.count} deal${g.count>1?'s':''})</span> &nbsp; ${hubBadges} &nbsp; <span style="color:#888;font-weight:500;">Total USD ACV: ${fmtUSD(g.totalAcvUsd)}</span></td>`;
      tr.addEventListener('click', () => {
        collapsed[g.name] = !collapsed[g.name];
        render();
      });
      tbody.appendChild(tr);
      if (!collapsed[g.name]) {
        for (const d of g.rows) {
          tbody.appendChild(makeRow(d, false));
        }
      }
    }
  }
  updateHeaderArrows();
}

function makeRow(d, flat) {
  const tr = document.createElement('tr');
  tr.className = 'deal-row' + (flat ? ' flat' : ' child');
  const accountCell = flat ? d.account : (d.account !== d.topParent ? `<span style="color:#aaa;">${d.account}</span>` : '');
  tr.innerHTML = `
    <td>${accountCell}</td>
    <td>${sfLink(d)}</td>
    <td>${d.contractType || ''}</td>
    <td>${badgeHtml(d.badges)}</td>
    <td>${hubPill(d.hub)}</td>
    <td>${d.closeDate}</td>
    <td>${fmtACV(d)}</td>
    <td>${d.agents != null ? d.agents.toLocaleString('en-US') : ''}</td>
    <td>${d.region || ''}</td>
    <td>${glHtml(d)}</td>
    <td>${d.owner || ''}</td>
  `;
  return tr;
}

function updateHeaderArrows() {
  document.querySelectorAll('th').forEach(th => {
    const col = th.dataset.col;
    th.innerHTML = th.textContent.replace(/[▲▼]/g,'').trim();
    if (sortState.col === col) {
      th.innerHTML += sortState.dir === 1 ? ' <span class="arrow">▲</span>' : ' <span class="arrow">▼</span>';
    }
  });
}

document.querySelectorAll('th').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortState.col !== col) {
      sortState = { col, dir: 1 };
    } else if (sortState.dir === 1) {
      sortState.dir = -1;
    } else {
      sortState = { col: null, dir: 1 };
    }
    render();
  });
});

function populateFilterOptions() {
  const regions = [...new Set(DEALS.map(d => d.region).filter(Boolean))].sort();
  const hubs = [...new Set(DEALS.map(d => d.hub))].sort();
  const statuses = ['Live','Delayed','ETA','TBD'];
  const rSel = document.getElementById('fRegion');
  regions.forEach(r => { const o = document.createElement('option'); o.value = r; o.textContent = r; rSel.appendChild(o); });
  const hSel = document.getElementById('fHub');
  hubs.forEach(h => { const o = document.createElement('option'); o.value = h; o.textContent = h; hSel.appendChild(o); });
  const gSel = document.getElementById('fGoLive');
  statuses.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; gSel.appendChild(o); });
}

function updateKpis() {
  const total = DEALS.length;
  const usd = DEALS.filter(d => d.currency === 'USD').reduce((s,d) => s + d.acv, 0);
  const live = DEALS.filter(d => d.goLiveStatus === 'Live').length;
  const delayed = DEALS.filter(d => d.goLiveStatus === 'Delayed').length;
  const eta = DEALS.filter(d => d.goLiveStatus === 'ETA').length;
  const tbd = DEALS.filter(d => d.goLiveStatus === 'TBD').length;
  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiAcv').textContent = fmtUSD(usd);
  document.getElementById('kpiLive').textContent = live;
  document.getElementById('kpiDelayed').textContent = delayed;
  document.getElementById('kpiEta').textContent = eta;
  document.getElementById('kpiTbd').textContent = tbd;
}

document.getElementById('fSearch').addEventListener('input', render);
document.getElementById('fRegion').addEventListener('change', render);
document.getElementById('fHub').addEventListener('change', render);
document.getElementById('fGoLive').addEventListener('change', render);

populateFilterOptions();
updateKpis();
render();
</script>
</body>
</html>
