<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Closed-Won Dashboard</title>
<style>
:root {
  --blue: #3694FC;
  --charcoal: #21212B;
  --indigo: #6100FF;
  --teal: #36EAD0;
  --coral: #FF5B8A;
}
* { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Arial, sans-serif;
  margin: 0;
  background: #f4f6f9;
  color: var(--charcoal);
}
#pwOverlay {
  position: fixed; inset: 0; background: var(--charcoal);
  display: flex; align-items: center; justify-content: center; z-index: 9999;
}
#pwCard {
  background: #fff; border-radius: 12px; padding: 40px 48px; width: 340px;
  text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
#pwCard h2 { margin-top: 0; color: var(--charcoal); }
#pwCard .logo { font-weight: 800; font-size: 22px; color: var(--blue); margin-bottom: 8px; }
#pwCard input {
  width: 100%; padding: 10px 12px; margin: 16px 0; border-radius: 6px;
  border: 1px solid #ccc; font-size: 15px;
}
#pwCard button {
  width: 100%; padding: 10px; background: var(--blue); color: #fff; border: none;
  border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: 600;
}
#pwCard button:hover { background: #2a7fe0; }
#pwError { color: var(--coral); font-size: 13px; min-height: 18px; }

#app { display: none; max-width: 1500px; margin: 0 auto; padding: 24px; }
.banner {
  background: #FFE9A8; border: 1px solid #E8C547; color: #6b5900;
  padding: 10px 18px; border-radius: 8px; margin-bottom: 18px; font-size: 14px; font-weight: 500;
}
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.header h1 { font-size: 22px; margin: 0; color: var(--charcoal); }
.kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
.kpi {
  background: #fff; border-radius: 10px; padding: 14px 16px; box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.kpi .val { font-size: 22px; font-weight: 700; color: var(--charcoal); }
.kpi .lbl { font-size: 12px; color: #777; text-transform: uppercase; letter-spacing: .04em; }
.filters { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select {
  padding: 8px 10px; border-radius: 6px; border: 1px solid #ccc; font-size: 13px;
}
.filters input { flex: 1; min-width: 200px; }
.count { font-size: 13px; color: #666; margin-left: auto; }
table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
th, td { padding: 9px 12px; font-size: 13px; text-align: left; border-bottom: 1px solid #eee; }
th { background: var(--charcoal); color: #fff; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { background: #34343f; }
tr.group-row td {
  background: #eef3fb; font-weight: 700; color: var(--charcoal); cursor: pointer;
}
tr.group-row:hover td { background: #e2eaf7; }
tr.deal-row td.acc-muted { color: #999; font-style: italic; font-size: 12px; }
.badge {
  display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; margin-right: 4px;
}
.badge-sr { background: #FF8A3D; }
.badge-tk { background: #8B3DFF; }
.badge-amc { background: #2CB673; }
.hub-rt { background: var(--blue); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.hub-off { background: var(--teal); color: #21212B; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.hub-both { background: var(--indigo); color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.gl-live { color: #1a9e5c; font-weight: 600; }
.gl-delayed { color: var(--coral); font-weight: 600; }
.gl-eta { color: var(--blue); font-weight: 600; }
.gl-tbd { color: #999; font-weight: 600; }
a.deallink { color: var(--blue); text-decoration: none; }
a.deallink:hover { text-decoration: underline; }
.sort-arrow { font-size: 10px; margin-left: 4px; }
.fedramp { background: #8B3DFF; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 11px; }
</style>
</head>
<body>

<div id="pwOverlay">
  <div id="pwCard">
    <div class="logo">NiCE</div>
    <h2>eHub Dashboard</h2>
    <input type="password" id="pwInput" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPw()">
    <button onclick="checkPw()">Access Dashboard</button>
    <div id="pwError"></div>
  </div>
</div>

<div id="app">
  <div class="banner">Dashboard generated on 2026-08-18 — data reflects Salesforce as of that date.</div>
  <div class="header">
    <h1>eHub Closed-Won Pipeline Dashboard</h1>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="val" id="kpiTotal">0</div><div class="lbl">Total Deals</div></div>
    <div class="kpi"><div class="val" id="kpiAcv">$0</div><div class="lbl">USD ACV</div></div>
    <div class="kpi"><div class="val" id="kpiLive">0</div><div class="lbl">Live</div></div>
    <div class="kpi"><div class="val" id="kpiDelayed">0</div><div class="lbl">Delayed</div></div>
    <div class="kpi"><div class="val" id="kpiEta">0</div><div class="lbl">ETA</div></div>
    <div class="kpi"><div class="val" id="kpiTbd">0</div><div class="lbl">TBD</div></div>
  </div>
  <div class="filters">
    <input type="text" id="searchBox" placeholder="Search account or deal name..." oninput="render()">
    <select id="regionFilter" onchange="render()"><option value="">All Regions</option></select>
    <select id="hubFilter" onchange="render()">
      <option value="">All Hub Types</option>
      <option value="Real-Time">Real-Time</option>
      <option value="Offline">Offline</option>
      <option value="RT + Offline">RT + Offline</option>
    </select>
    <select id="golFilter" onchange="render()">
      <option value="">All Go-Live Statuses</option>
      <option value="Live">Live</option>
      <option value="Delayed">Delayed</option>
      <option value="ETA">ETA</option>
      <option value="TBD">TBD</option>
    </select>
    <span class="count" id="countLbl"></span>
  </div>
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('account')">Account<span class="sort-arrow" id="arrow-account"></span></th>
        <th onclick="sortBy('name')">Deal Name<span class="sort-arrow" id="arrow-name"></span></th>
        <th onclick="sortBy('type')">Type<span class="sort-arrow" id="arrow-type"></span></th>
        <th onclick="sortBy('integration')">Integration<span class="sort-arrow" id="arrow-integration"></span></th>
        <th onclick="sortBy('hub')">Hub<span class="sort-arrow" id="arrow-hub"></span></th>
        <th onclick="sortBy('closeDate')">Close Date<span class="sort-arrow" id="arrow-closeDate"></span></th>
        <th onclick="sortBy('acv')">ACV<span class="sort-arrow" id="arrow-acv"></span></th>
        <th onclick="sortBy('agents')">Agents<span class="sort-arrow" id="arrow-agents"></span></th>
        <th onclick="sortBy('region')">Region<span class="sort-arrow" id="arrow-region"></span></th>
        <th onclick="sortBy('golive')">Go-Live<span class="sort-arrow" id="arrow-golive"></span></th>
        <th onclick="sortBy('owner')">Owner<span class="sort-arrow" id="arrow-owner"></span></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const PW_HASH = "fa34e5bac87849343e48ccec9965e86629502a7f0c7c9f1e18abaa8a2240e673";
async function checkPw() {
  const val = document.getElementById('pwInput').value;
  const enc = new TextEncoder().encode(val);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  if (hex === PW_HASH) {
    localStorage.setItem('ehub_auth', 'ok');
    document.getElementById('pwOverlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    init();
  } else {
    document.getElementById('pwError').textContent = 'Incorrect password.';
  }
}
if (localStorage.getItem('ehub_auth') === 'ok') {
  document.getElementById('pwOverlay').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  window.addEventListener('DOMContentLoaded', init);
}

let sortCol = null, sortDir = 1, sortClicks = 0;

function fmtAcv(r) {
  const sym = r.currency === 'USD' ? '$' : (r.currency === 'GBP' ? '£' : (r.currency === 'CAD' ? 'C$' : (r.currency === 'AUD' ? 'A$' : r.currency + ' ')));
  return sym + Number(r.acv).toLocaleString(undefined, {maximumFractionDigits: 0}) + (r.currency !== 'USD' ? ' ' + r.currency : '');
}

function hubBadge(hub) {
  if (hub === 'RT + Offline') return '<span class="hub-both">RT + Offline</span>';
  if (hub === 'Offline') return '<span class="hub-off">Offline</span>';
  return '<span class="hub-rt">Real-Time</span>';
}

function intBadges(arr) {
  return arr.map(b => {
    if (b === 'SmartReach') return '<span class="badge badge-sr">SmartReach</span>';
    if (b === 'Ticketing') return '<span class="badge badge-tk">Ticketing</span>';
    if (b === 'AMC') return '<span class="badge badge-amc">AMC</span>';
    return '';
  }).join('');
}

function glClass(status) {
  if (status === 'Live') return 'gl-live';
  if (status === 'Delayed') return 'gl-delayed';
  if (status === 'ETA') return 'gl-eta';
  return 'gl-tbd';
}

function populateFilters() {
  const regions = [...new Set(ROWS.map(r => r.region).filter(x => x))].sort();
  const sel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const o = document.createElement('option'); o.value = r; o.textContent = r; sel.appendChild(o);
  });
}

function filteredRows() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  const region = document.getElementById('regionFilter').value;
  const hub = document.getElementById('hubFilter').value;
  const gol = document.getElementById('golFilter').value;
  return ROWS.filter(r => {
    if (q && !(r.account.toLowerCase().includes(q) || r.name.toLowerCase().includes(q))) return false;
    if (region && r.region !== region) return false;
    if (hub && r.hub !== hub) return false;
    if (gol && r.goLiveStatus !== gol) return false;
    return true;
  });
}

function sortBy(col) {
  if (sortCol === col) {
    sortClicks++;
  } else {
    sortCol = col; sortClicks = 1; sortDir = 1;
  }
  if (sortClicks === 1) sortDir = 1;
  else if (sortClicks === 2) sortDir = -1;
  else { sortCol = null; sortClicks = 0; }
  render();
}

function cmp(a, b, col) {
  if (col === 'acv') return a.acv - b.acv;
  if (col === 'agents') return (a.agents || 0) - (b.agents || 0);
  if (col === 'closeDate') return a.closeDate.localeCompare(b.closeDate);
  if (col === 'integration') return (a.integration.join(',')).localeCompare(b.integration.join(','));
  if (col === 'golive') {
    if (a.goLiveCat !== b.goLiveCat) return a.goLiveCat - b.goLiveCat;
    const ad = a.goLiveSortDate, bd = b.goLiveSortDate;
    if (ad === null && bd === null) return 0;
    if (ad === null) return 1;
    if (bd === null) return -1;
    return ad.localeCompare(bd);
  }
  const av = (a[col] || '').toString().toLowerCase();
  const bv = (b[col] || '').toString().toLowerCase();
  return av.localeCompare(bv);
}

function renderFlat(list) {
  let out = '';
  list.forEach(r => {
    out += rowHtml(r, true);
  });
  return out;
}

function rowHtml(r, showAccount) {
  const acc = showAccount ? `<td>${r.account}</td>` : (r.account !== r.__groupName ? `<td class="acc-muted">${r.account}</td>` : `<td></td>`);
  return `<tr class="deal-row">
    ${acc}
    <td><a class="deallink" href="${r.url}" target="_blank">${r.name}</a></td>
    <td>${r.type}</td>
    <td>${intBadges(r.integration)}</td>
    <td>${hubBadge(r.hub)}</td>
    <td>${r.closeDate}</td>
    <td>${fmtAcv(r)}</td>
    <td>${r.agents !== null && r.agents !== undefined ? r.agents : ''}</td>
    <td>${r.region}</td>
    <td class="${glClass(r.goLiveStatus)}">${r.goLiveLabel}</td>
    <td>${r.owner}</td>
  </tr>`;
}

function renderGrouped(list) {
  const groups = {};
  list.forEach(r => {
    r.__groupName = r.group;
    if (!groups[r.group]) groups[r.group] = [];
    groups[r.group].push(r);
  });
  const groupArr = Object.keys(groups).map(g => {
    const items = groups[g].sort((a,b) => a.closeDate.localeCompare(b.closeDate));
    const maxClose = items.reduce((m,x) => x.closeDate > m ? x.closeDate : m, '0000-00-00');
    return {name: g, items, maxClose, totalAcvUsd: items.filter(x=>x.currency==='USD').reduce((s,x)=>s+x.acv,0)};
  });
  groupArr.sort((a,b) => b.maxClose.localeCompare(a.maxClose));
  let out = '';
  groupArr.forEach((grp, idx) => {
    const gid = 'grp' + idx;
    const hubs = [...new Set(grp.items.map(x=>x.hub))];
    out += `<tr class="group-row" onclick="toggleGroup('${gid}')">
      <td colspan="11">▸ ${grp.name} — ${grp.items.length} deal${grp.items.length>1?'s':''} — $${grp.totalAcvUsd.toLocaleString(undefined,{maximumFractionDigits:0})} USD</td>
    </tr>`;
    grp.items.forEach(r => {
      out += `<tr class="deal-row group-${gid}">` + rowHtml(r, false).replace('<tr class="deal-row">','');
    });
  });
  return out;
}

function toggleGroup(gid) {
  const rows = document.querySelectorAll('.group-' + gid);
  rows.forEach(r => r.style.display = r.style.display === 'none' ? '' : 'none');
}

function render() {
  const list = filteredRows();
  const tbody = document.getElementById('tbody');
  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;color:#999;padding:20px;">No deals match the current filters.</td></tr>';
  } else if (sortCol) {
    const sorted = [...list].sort((a,b) => sortDir * cmp(a,b,sortCol));
    tbody.innerHTML = renderFlat(sorted);
  } else {
    tbody.innerHTML = renderGrouped(list);
  }
  const accCount = new Set(list.map(r => r.group)).size;
  document.getElementById('countLbl').textContent = `${list.length} deals · ${accCount} accounts`;

  ['account','name','type','integration','hub','closeDate','acv','agents','region','golive','owner'].forEach(c => {
    const el = document.getElementById('arrow-' + c);
    if (!el) return;
    el.textContent = (sortCol === c) ? (sortDir === 1 ? '▲' : '▼') : '';
  });
}

function init() {
  populateFilters();
  const total = ROWS.length;
  const usdAcv = ROWS.filter(r => r.currency === 'USD').reduce((s,r) => s + r.acv, 0);
  document.getElementById('kpiTotal').textContent = total;
  document.getElementById('kpiAcv').textContent = '$' + usdAcv.toLocaleString(undefined,{maximumFractionDigits:0});
  document.getElementById('kpiLive').textContent = ROWS.filter(r => r.goLiveStatus === 'Live').length;
  document.getElementById('kpiDelayed').textContent = ROWS.filter(r => r.goLiveStatus === 'Delayed').length;
  document.getElementById('kpiEta').textContent = ROWS.filter(r => r.goLiveStatus === 'ETA').length;
  document.getElementById('kpiTbd').textContent = ROWS.filter(r => r.goLiveStatus === 'TBD').length;
  render();
}
if (localStorage.getItem('ehub_auth') === 'ok') {
  init();
}
</script>
