<style>
:root{
  --blue:#3694fc; --charcoal:#21212b; --indigo:#6100FF; --teal:#36EAD0; --coral:#FF5B8A;

}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6f9;color:var(--charcoal);}
#overlay{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:9999;}
#pwdcard{background:#fff;border-radius:12px;padding:40px;width:320px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);}
#pwdcard h2{margin:0 0 8px;color:var(--charcoal);}
#pwdcard p{color:#777;font-size:13px;margin:0 0 20px;}
#pwdcard input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;margin-bottom:12px;}
#pwdcard button{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;font-weight:600;}
#pwdcard button:hover{background:#2277d8;}
#pwderr{color:var(--coral);font-size:12px;height:16px;margin-top:-6px;margin-bottom:8px;}
#app{display:none;max-width:1500px;margin:0 auto;padding:20px;}
.banner{background:#FFE8A3;color:#6b5400;padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center;}
h1{font-size:22px;margin:0 0 16px;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px;}
.kpi{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.kpi .label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.03em;}
.kpi .value{font-size:22px;font-weight:700;color:var(--charcoal);margin-top:4px;}
.layout{display:grid;grid-template-columns:1fr 260px;gap:16px;}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filters input,.filters select{padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;}
.filters input{flex:1;min-width:180px;}
.count{font-size:12px;color:#777;margin-bottom:8px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);}
th{background:var(--charcoal);color:#fff;text-align:left;padding:10px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.02em;cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{background:#333340;}
td{padding:8px;font-size:13px;border-bottom:1px solid #eee;}
tr.grouprow td{background:#eef3fb;font-weight:700;cursor:pointer;padding:9px 8px;}
tr.grouprow:hover td{background:#e3ecf9;}
tr.dealrow td{color:#333;}
tr.dealrow td.acct-cell{color:#999;font-style:italic;font-size:12px;}
a.dealLink{color:var(--blue);text-decoration:none;font-weight:600;}
a.dealLink:hover{text-decoration:underline;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600;color:#fff;}
.hub-offline{background:var(--teal);color:#064e43;}
.hub-rt{background:var(--blue);}
.hub-both{background:var(--indigo);}
.badge-smartreach{background:var(--smartreach);}
.badge-ticketing{background:var(--ticketing);}
.badge-amc{background:var(--amc);}
.badge-cisco{background:#049FD9;}
.badge-avaya{background:#CC0000;}
.badge-genesyssiprec{background:#6A1B9A;}
.badge-msteams{background:#5059C9;}
.badge-unconfirmed{background:#ccc;color:#555;}
.gl-live{color:var(--live);font-weight:700;}
.gl-delayed{color:var(--delayed);font-weight:700;}
.gl-eta{color:var(--eta);font-weight:700;}
.gl-tbd{color:var(--tbd);font-weight:700;}
.stage-icon{color:#aaa;font-size:10px;margin-left:4px;}
.sidebar .box{background:#fff;border-radius:10px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.sidebar h3{font-size:13px;margin:0 0 10px;color:var(--charcoal);}
.sidebar .row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid #f2f2f2;}
.sidebar .row:last-child{border-bottom:none;}
.sidebar .row span.v{font-weight:700;}
.collapsed + .dealrow{display:none;}
</style>

</div>

async function checkPwd(){
  const val = document.getElementById('pwdInput').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if(hex === PWD_HASH){
    try{ sessionStorage.setItem('ehub_auth','1'); }catch(e){}
    document.getElementById('overlay').style.display='none';
    document.getElementById('app').style.display='block';
    render();
  } else {
    document.getElementById('pwderr').textContent = 'Incorrect password';
  }
}
document.getElementById('pwdInput').addEventListener('keydown', function(e){
  if(e.key==='Enter') checkPwd();
});

document.getElementById('banner').textContent = 'Dashboard generated on ' + TODAY + ' — data reflects Salesforce as of that date.';

function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}
function fmtACV(d){
  const n = d.acv.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:0});
  return d.cur + ' ' + n;
}
function hubClass(h){
  if(h==='Offline') return 'hub-offline';
  if(h==='RT + Offline') return 'hub-both';
  return 'hub-rt';
}
function acdClass(name){
  if(name==='Cisco Systems') return 'badge-cisco';
  if(name==='Avaya') return 'badge-avaya';
  if(name==='Genesys SIPREC') return 'badge-genesyssiprec';
  if(name==='MS Teams') return 'badge-msteams';
  return 'badge-unconfirmed';
}
function integBadge(d){
  let out = '';
  if(d.integration==='SmartReach') out += '<span class="badge badge-smartreach">SmartReach</span> ';
  if(d.integration==='Ticketing') out += '<span class="badge badge-ticketing">Ticketing</span> ';
  if(d.integration==='AMC') out += '<span class="badge badge-amc">AMC</span> ';
  if(d.acd && d.acd.length){
    d.acd.forEach(a=>{ out += '<span class="badge '+acdClass(a)+'">'+a+'</span> '; });
  } else if(d.hub==='Real-Time' || d.hub==='RT + Offline'){
    out += '<span class="badge badge-unconfirmed" title="ACD not yet confirmed">Unconfirmed</span> ';
  }
  return out.trim();
}
function goLiveLabel(d){
  if(d.goLiveStatus==='Live') return '<span class="gl-live">Live</span>';
  if(d.goLiveStatus==='TBD') return '<span class="gl-tbd">TBD</span>';
  if(d.goLiveStatus==='Delayed') return '<span class="gl-delayed">Delayed ' + fmtDate(d.goLiveDate) + '</span>';
  if(d.goLiveStatus==='ETA') return '<span class="gl-eta">ETA ' + fmtDate(d.goLiveDate) + '</span>';
  return '';
}
function goLiveSortKey(d){
  if(d.goLiveStatus==='Live') return [0,''];
  if(d.goLiveStatus==='Delayed' || d.goLiveStatus==='ETA') return [1, d.goLiveDate || '9999-99-99'];
  return [2,''];
}

function populateFilters(){
  const regions = Array.from(new Set(DATA.map(d=>d.region).filter(Boolean))).sort();
  const hubs = Array.from(new Set(DATA.map(d=>d.hub))).sort();
  const gos = ['Live','Delayed','ETA','TBD'];
  const rSel = document.getElementById('fRegion');
  regions.forEach(r=>{ const o=document.createElement('option'); o.value=r; o.textContent=r; rSel.appendChild(o); });
  const hSel = document.getElementById('fHub');
  hubs.forEach(h=>{ const o=document.createElement('option'); o.value=h; o.textContent=h; hSel.appendChild(o); });
  const gSel = document.getElementById('fGo');
  gos.forEach(g=>{ const o=document.createElement('option'); o.value=g; o.textContent=g; gSel.appendChild(o); });
}

  {key:'account', label:'Account'},
  {key:'name', label:'Deal Name'},

function renderHeader(){
  const tr = document.getElementById('headerRow');
  tr.innerHTML = '';
  COLS.forEach(c=>{
    const th = document.createElement('th');
    let arrow = '';
    if(sortCol === c.key) arrow = sortDir===1 ? ' ▲' : ' ▼';
    th.textContent = c.label + arrow;
    th.onclick = function(){ onSort(c.key); };
    tr.appendChild(th);
  });
}

function onSort(key){
  if(sortCol === key){
    if(sortDir === 1){ sortDir = -1; }
    else { sortCol = null; sortDir = 1; }
  } else {
    sortCol = key; sortDir = 1;
  }
  render();
}

function getFiltered(){
  const q = document.getElementById('search').value.toLowerCase();
  const fr = document.getElementById('fRegion').value;
  const fh = document.getElementById('fHub').value;
  const fg = document.getElementById('fGo').value;
  return DATA.filter(d=>{
    if(q && !(d.account.toLowerCase().includes(q) || d.name.toLowerCase().includes(q))) return false;
    if(fr && d.region !== fr) return false;
    if(fh && d.hub !== fh) return false;
    if(fg && d.goLiveStatus !== fg) return false;
    return true;
  });
}

function sortValue(d, key){
  if(key==='closeDate') return d.closeDate;
  if(key==='acv') return d.acv;
  if(key==='agents') return d.agents==null ? -1 : d.agents;
  if(key==='goLive') return goLiveSortKey(d);
  return (d[key]||'').toString().toLowerCase();
}

function renderRows(filtered){
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if(sortCol){
    const arr = filtered.slice();
    arr.sort((a,b)=>{
      let av = sortValue(a, sortCol), bv = sortValue(b, sortCol);
      if(sortCol==='goLive'){
        if(av[0]!==bv[0]) return (av[0]-bv[0])*sortDir;
        return (av[1]<bv[1]?-1:av[1]>bv[1]?1:0)*sortDir;
      }
      if(av<bv) return -1*sortDir;
      if(av>bv) return 1*sortDir;
      return 0;
    });
    if(arr.length===0){
      tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:20px;color:#999;">No deals match the current filters.</td></tr>';
      return;
    }
    arr.forEach(d=>{
      tbody.appendChild(buildRow(d, true));
    });
    return;
  }

  // grouped by top parent account
  const groups = {};
  filtered.forEach(d=>{
    const key = d.topParent || d.account;
    if(!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const groupKeys = Object.keys(groups).sort((a,b)=>{
    const am = Math.max(...groups[a].map(x=>x.closeDate));
    const bm = Math.max(...groups[b].map(x=>x.closeDate));
    return am < bm ? 1 : am > bm ? -1 : 0;
  });

  if(groupKeys.length===0){
    tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:20px;color:#999;">No deals match the current filters.</td></tr>';
    return;
  }

  groupKeys.forEach((gk,idx)=>{
    const rows = groups[gk].slice().sort((a,b)=> a.closeDate < b.closeDate ? -1 : 1);
    const totalACVUSD = rows.filter(r=>r.cur==='USD').reduce((s,r)=>s+r.acv,0);
    const gid = 'grp'+idx;
    const gtr = document.createElement('tr');
    gtr.className = 'grouprow';
    gtr.dataset.target = gid;
    const td = document.createElement('td');
    td.colSpan = 11;
    td.textContent = gk + '  (' + rows.length + ' deal' + (rows.length>1?'s':'') + ')  —  USD ' + totalACVUSD.toLocaleString(undefined,{maximumFractionDigits:0});
    gtr.appendChild(td);
    gtr.onclick = function(){ toggleGroup(gid); };
    tbody.appendChild(gtr);
    rows.forEach(d=>{
      const r = buildRow(d, false);
      r.classList.add(gid);
      tbody.appendChild(r);
    });
  });
}

function toggleGroup(gid){
  const rows = document.querySelectorAll('.'+gid);
  rows.forEach(r=>{ r.style.display = (r.style.display==='none') ? '' : 'none'; });
}

function buildRow(d, showAccount){
  const tr = document.createElement('tr');
  tr.className = 'dealrow';
  const cells = [];
  cells.push(showAccount ? d.account : '');
  cells.push('<a class="dealLink" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+d.id+'/view" target="_blank">'+d.name+'</a>');
  cells.push(d.contractType || '');
  cells.push(integBadge(d));
  cells.push('<span class="badge '+hubClass(d.hub)+'">'+d.hub+'</span>');
  cells.push(fmtDate(d.closeDate));
  cells.push(fmtACV(d));
  cells.push(d.agents==null ? '' : d.agents.toLocaleString());
  cells.push(d.region || '');
  cells.push(goLiveLabel(d));
  cells.push(d.owner || '');
  cells.forEach((c,i)=>{
    const td = document.createElement('td');
    if(i===0) td.className='acct-cell';
    td.innerHTML = c;
    tr.appendChild(td);
  });
  return tr;
}

function renderKPIs(filtered){
  const total = filtered.length;
  const usdAcv = filtered.filter(d=>d.cur==='USD').reduce((s,d)=>s+d.acv,0);
  const live = filtered.filter(d=>d.goLiveStatus==='Live').length;
  const delayed = filtered.filter(d=>d.goLiveStatus==='Delayed').length;
  const eta = filtered.filter(d=>d.goLiveStatus==='ETA').length;
  const tbd = filtered.filter(d=>d.goLiveStatus==='TBD').length;
  const kpis = [
    ['Total Deals', total],
    ['USD ACV', 'USD ' + usdAcv.toLocaleString(undefined,{maximumFractionDigits:0})],
    ['Live', live],
    ['Delayed', delayed],
    ['ETA', eta],
    ['TBD', tbd],
  ];
  const el = document.getElementById('kpis');
  el.innerHTML = '';
  kpis.forEach(k=>{
    const d = document.createElement('div');
    d.className = 'kpi';
    d.innerHTML = '<div class="label">'+k[0]+'</div><div class="value">'+k[1]+'</div>';
    el.appendChild(d);
  });
}

function renderSidebar(filtered){
  function block(id, groupFn){
    const groups = {};
    filtered.forEach(d=>{
      const k = groupFn(d) || '(none)';
      if(!groups[k]) groups[k] = {count:0, acv:0};
      groups[k].count++;
      if(d.cur==='USD') groups[k].acv += d.acv;
    });
    const el = document.getElementById(id);
    el.innerHTML = '';
    Object.keys(groups).sort((a,b)=>groups[b].count-groups[a].count).forEach(k=>{
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = '<span>'+k+'</span><span class="v">'+groups[k].count+' · USD '+groups[k].acv.toLocaleString(undefined,{maximumFractionDigits:0})+'</span>';
      el.appendChild(row);
    });
  }
  block('byHub', d=>d.hub);
  function integKey(d){
    if(d.integration) return d.integration;
    if(d.acd && d.acd.length) return d.acd.join(' / ');
    if(d.hub==='Real-Time' || d.hub==='RT + Offline') return 'Unconfirmed ACD';
    return 'None';
  }
  block('byInteg', integKey);
  block('byRegion', d=>d.region);
}

function render(){
  const filtered = getFiltered();
  renderHeader();
  renderKPIs(filtered);
  renderRows(filtered);
  renderSidebar(filtered);
  const accts = new Set(filtered.map(d=>d.topParent||d.account));
  document.getElementById('count').textContent = filtered.length + ' deals · ' + accts.size + ' accounts';
}

populateFilters();
</script>
</body>
</html>
