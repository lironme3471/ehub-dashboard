.filters input { flex:1; min-width:180px; }
#count { font-size:12.5px; color:#666; margin-bottom:8px; }
table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); font-size:12.5px; }
th { background:var(--nice-charcoal); color:#fff; text-align:left; padding:9px 8px; cursor:pointer; white-space:nowrap; user-select:none; }

a.dealname { color:var(--nice-blue); text-decoration:none; }

.pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; color:#fff; font-weight:600; margin:1px 2px 1px 0; }
.stage-badge { display:inline-block; padding:2px 7px; border-radius:6px; font-size:11px; color:#fff; font-weight:600; }

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pwinput').value;
  const hash = await sha256(val);
  if (hash === PWD_HASH) {
    try { localStorage.setItem('ehub_auth','1'); } catch(e) {}
    document.getElementById('overlay').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('pwerr').textContent = 'Incorrect password';
  }
}

function fmtMoney(n, ccy) {
  if (n === null || n === undefined) return '-';
  return (ccy||'') + ' ' + Number(n).toLocaleString(undefined, {maximumFractionDigits:0});
}

function stageBadge(status, date) {
  let color = '#999', label = status;
  if (status === 'Live') { color = '#22C55E'; label = 'Live'; }
  else if (status === 'Delayed') { color = '#FF5B8A'; label = 'Delayed ' + (date||''); }
  else if (status === 'ETA') { color = '#3694FC'; label = 'ETA ' + (date||''); }
  else { color = '#999'; label = 'TBD'; }
  return '<span class="stage-badge" style="background:'+color+'">'+label+'</span>';
}

function hubBadge(hub, color) {
  return '<span class="pill" style="background:'+color+'">'+hub+'</span>';
}

function badgesHtml(badges) {
  return badges.map(b => '<span class="pill" style="background:'+b[1]+'">'+b[0]+'</span>').join(' ');
}

function sortKeyDate(d) {
  if (d.GoLiveStatus === 'Live') return '0000-00-00';
  if (d.GoLiveStatus === 'TBD') return '9999-99-99';
  return d.GoLiveDate || '9999-99-98';
}

function populateFilters() {
  const hubs = [...new Set(DATA.map(d=>d.Hub))].sort();
  const regions = [...new Set(DATA.map(d=>d.Region||'Unknown'))].sort();
  const acds = [...new Set(DATA.flatMap(d=>d.Badges.map(b=>b[0])))].sort();
  const fStage = document.getElementById('fStage');
  hubs.forEach(h => { const o=document.createElement('option'); o.value=h; o.textContent=h; fStage.appendChild(o); });
  const fRegion = document.getElementById('fRegion');
  regions.forEach(r => { const o=document.createElement('option'); o.value=r; o.textContent=r; fRegion.appendChild(o); });
  const fAcd = document.getElementById('fAcd');
  acds.forEach(a => { const o=document.createElement('option'); o.value=a; o.textContent=a; fAcd.appendChild(o); });
}

  const live = DATA.filter(d=>d.GoLiveStatus==='Live').length;
  const delayed = DATA.filter(d=>d.GoLiveStatus==='Delayed').length;
  const eta = DATA.filter(d=>d.GoLiveStatus==='ETA').length;
  const tbd = DATA.filter(d=>d.GoLiveStatus==='TBD').length;
  const stats = [
    ['Total Deals', total],
    ['USD ACV', '$'+Math.round(usd).toLocaleString()],
    ['Live', live],
    ['Delayed', delayed],
    ['ETA', eta],
    ['TBD', tbd],
  ];
  document.getElementById('stats').innerHTML = stats.map(s=>
    '<div class="stat"><div class="val">'+s[1]+'</div><div class="lbl">'+s[0]+'</div></div>').join('');
}

function renderSidebar() {
  function groupBy(keyFn) {
    const m = {};
    DATA.forEach(d=>{
      const k = keyFn(d);
      if(!m[k]) m[k] = {count:0, acv:0};
      m[k].count++;
      if (d.Currency==='USD') m[k].acv += d.ACV;
    });
    return m;
  }
  const byStage = groupBy(d=>d.Hub);
  const byAcd = {};
  DATA.forEach(d=>{
    if (d.Badges.length===0) {
      const k = '(none)';
      if(!byAcd[k]) byAcd[k]={count:0, acv:0};
      byAcd[k].count++;
      if (d.Currency==='USD') byAcd[k].acv += d.ACV;
    }
    d.Badges.forEach(b=>{
      if(!byAcd[b[0]]) byAcd[b[0]]={count:0, acv:0};
      byAcd[b[0]].count++;
      if (d.Currency==='USD') byAcd[b[0]].acv += d.ACV;
    });
  });
  const byRegion = groupBy(d=>d.Region||'Unknown');

  function box(title, m, showAcv) {
    let rows = Object.entries(m).sort((a,b)=>b[1].count-a[1].count).map(([k,v])=>
      '<div class="side-row"><span>'+k+'</span><span>'+v.count+(showAcv?(' · $'+Math.round(v.acv).toLocaleString()):'')+'</span></div>').join('');
    return '<div class="side-box"><h3>'+title+'</h3>'+rows+'</div>';
  }
  document.getElementById('sidebar').innerHTML =
    box('By Hub Type', byStage, true) + box('By Integration/ACD', byAcd, true) + box('By Region', byRegion, false);
}

const columns = [
  {key:'Name', label:'Opportunity'},
  {key:'Account', label:'Account'},
  {key:'ContractType', label:'Type'},
  {key:'IntegrationSort', label:'Integration'},
  {key:'Hub', label:'Hub'},
  {key:'CloseDate', label:'Close Date'},
  {key:'ACVRound', label:'ACV'},
  {key:'Agents', label:'Agents'},
  {key:'Region', label:'Region'},
  {key:'GoLiveSort', label:'Go-Live'},
  {key:'Owner', label:'Owner'},
];

function renderHeader() {
  const tr = document.getElementById('headerRow');
  tr.innerHTML = columns.map(c=>{
    let arrow = '';
    if (sortCol === c.key) arrow = sortDir===1 ? ' <span class="sortarrow">▲</span>' : ' <span class="sortarrow">▼</span>';
    return '<th onclick="onSort(\''+c.key+'\')">'+c.label+arrow+'</th>';
  }).join('');
}

function onSort(key) {
  if (sortCol === key) {
    if (sortDir === 1) { sortDir = -1; }
    else { sortCol = null; sortDir = 1; }
  } else {
    sortCol = key; sortDir = 1;
  }
  render();
}

function matchesFilter(d) {
  const q = document.getElementById('search').value.toLowerCase();
  const fStage = document.getElementById('fStage').value;
  const fRegion = document.getElementById('fRegion').value;
  const fAcd = document.getElementById('fAcd').value;
  if (q && !(d.Account.toLowerCase().includes(q) || d.Name.toLowerCase().includes(q))) return false;
  if (fStage && d.Hub !== fStage) return false;
  if (fRegion && (d.Region||'Unknown') !== fRegion) return false;
  if (fAcd && !d.Badges.some(b=>b[0]===fAcd)) return false;
  return true;
}

function render() {
  renderHeader();
  const filtered = DATA.filter(matchesFilter);
  const tbody = document.getElementById('tbody');
  let html = '';
  let accountsShown = new Set();

  if (sortCol) {
    const sorted = [...filtered].sort((a,b)=>{
      let av, bv;
      if (sortCol === 'GoLiveSort') { av = sortKeyDate(a); bv = sortKeyDate(b); }
      else if (sortCol === 'IntegrationSort') { av = a.Badges.map(x=>x[0]).join(','); bv = b.Badges.map(x=>x[0]).join(','); }
      else { av = a[sortCol]; bv = b[sortCol]; }
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return (av-bv)*sortDir;
      return String(av).localeCompare(String(bv)) * sortDir;
    });
    sorted.forEach(d=>accountsShown.add(d.TopParent));
    html = sorted.map(d=>
      '<tr class="dealrow"><td><a class="dealname" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+d.Id+'/view">'+d.Name+'</a></td>'+
      '<td class="muted">'+d.Account+'</td><td>'+(d.ContractType||'')+'</td><td>'+badgesHtml(d.Badges)+'</td>'+
      '<td>'+hubBadge(d.Hub,d.HubColor)+'</td><td>'+d.CloseDate+'</td><td>'+fmtMoney(d.ACV,d.Currency)+'</td>'+
      '<td>'+(d.Agents!=null?d.Agents:'-')+'</td><td>'+(d.Region||'-')+'</td><td>'+stageBadge(d.GoLiveStatus,d.GoLiveDate)+'</td>'+
      '<td>'+(d.Owner||'')+'</td></tr>').join('');
  } else {
    const groups = {};
    filtered.forEach(d=>{
      const k = d.TopParent;
      if (!groups[k]) groups[k] = [];
      groups[k].push(d);
    });
    const groupArr = Object.entries(groups).map(([k,arr])=>{
      const acv = arr.reduce((s,d)=> s + (d.Currency==='USD'?d.ACV:0), 0);
      return {name:k, deals:arr.sort((a,b)=>a.CloseDate.localeCompare(b.CloseDate)), acv};
    }).sort((a,b)=>b.acv-a.acv);
    accountsShown = new Set(groupArr.map(g=>g.name));
    groupArr.forEach((g,gi)=>{
      const badgeSet = [...new Set(g.deals.flatMap(d=>d.Badges.map(b=>JSON.stringify(b))))].map(s=>JSON.parse(s));
      html += '<tr class="grouprow" onclick="toggleGroup(\'g'+gi+'\')"><td colspan="11">'+g.name+' · '+g.deals.length+' deals · '+badgesHtml(badgeSet)+' · $'+Math.round(g.acv).toLocaleString()+' USD</td></tr>';
      html += g.deals.map(d=>'<tr class="dealrow g'+gi+'"><td><a class="dealname" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+d.Id+'/view">'+d.Name+'</a></td><td class="muted">'+(d.Account!==g.name?d.Account:'')+'</td><td>'+(d.ContractType||'')+'</td><td>'+badgesHtml(d.Badges)+'</td><td>'+hubBadge(d.Hub,d.HubColor)+'</td><td>'+d.CloseDate+'</td><td>'+fmtMoney(d.ACV,d.Currency)+'</td><td>'+(d.Agents!=null?d.Agents:'-')+'</td><td>'+(d.Region||'-')+'</td><td>'+stageBadge(d.GoLiveStatus,d.GoLiveDate)+'</td><td>'+(d.Owner||'')+'</td></tr>').join('');
    });
    if (groupArr.length===0) {
      html = '<tr><td colspan="11">No results</td></tr>';
    }
  }
  tbody.innerHTML = html;
  document.getElementById('count').textContent = filtered.length + ' deals · ' + accountsShown.size + ' accounts';
}

function toggleGroup(cls) {
  document.querySelectorAll('.'+cls).forEach(el=>{
    el.classList.toggle('collapsed');
  });
}

function init() {
  populateFilters();
  renderStats();
  renderSidebar();
  render();
}
</script>
</body>
</html>
