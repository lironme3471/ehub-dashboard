const SF="https://niceincontact.lightning.force.com/lightning/r/Opportunity/";
let sortCol=null,sortDir=1;
const regions=[...new Set(DATA.map(r=>r.region).filter(Boolean))].sort();
regions.forEach(r=>{const o=document.createElement("option");o.textContent=r;document.getElementById("fRegion").appendChild(o)});

function fmtMoney(v,c){return (c==="USD"?"$":c+" ")+v.toLocaleString("en-US",{maximumFractionDigits:0})}
function glRank(r){if(r.gl==="Live")return[0,""];if(r.gl==="TBD")return[2,""];return[1,r.glDate||"9999"]}
function glLabel(r){if(r.gl==="Live")return'<span class="badge gl-live">Live</span>';
 if(r.gl==="TBD")return'<span class="badge gl-tbd">TBD</span>';
 if(r.gl==="Delayed")return'<span class="badge gl-del">Delayed → '+r.glDate+'</span>';
 return'<span class="badge gl-eta">ETA '+r.glDate+'</span>'}
function hubBadge(h){if(h==="RT + Offline")return'<span class="badge hub-both">RT + Offline</span>';
 if(h==="Offline")return'<span class="badge hub-off">Offline</span>';
 return'<span class="badge hub-rt">Real-Time</span>'}
function intBadges(a){return a.map(i=>i==="SmartReach"?'<span class="badge int-sr">SmartReach</span>':i==="Ticketing"?'<span class="badge int-tk">Ticketing</span>':'<span class="badge int-amc">AMC</span>').join("")}

function sortBy(c){if(sortCol===c)sortDir*=-1;else{sortCol=c;sortDir=1}render()}
function cmp(a,b,c){
 if(c==="gl"){const[ra,da]=glRank(a),[rb,db]=glRank(b);return ra-rb||da.localeCompare(db)}
 if(c==="acv"||c==="agents"){return((a[c]??-1)-(b[c]??-1))}
 return String(a[c]??"").localeCompare(String(b[c]??""))}

function render(){
 const q=document.getElementById("q").value.toLowerCase(),
 fr=document.getElementById("fRegion").value,fh=document.getElementById("fHub").value,fg=document.getElementById("fGl").value;
 let rows=DATA.filter(r=>(!q||r.acct.toLowerCase().includes(q)||r.name.toLowerCase().includes(q))
  &&(!fr||r.region===fr)&&(!fh||r.hub===fh)&&(!fg||r.gl===fg));
 // KPIs on filtered set
 document.getElementById("kDeals").textContent=rows.length;
 const acv=rows.filter(r=>r.cur==="USD").reduce((s,r)=>s+r.acv,0);
 document.getElementById("kAcv").textContent="$"+(acv/1e6).toFixed(2)+"M";
 ["Live","Delayed","ETA","TBD"].forEach((s,i)=>{document.getElementById(["kLive","kDel","kEta","kTbd"][i]).textContent=rows.filter(r=>r.gl===s).length});
 // arrows
 document.querySelectorAll(".arr").forEach(e=>e.textContent="");
 if(sortCol){const e=document.getElementById("a-"+sortCol);if(e)e.textContent=sortDir>0?"▲":"▼"}
 const tb=document.getElementById("tb");tb.innerHTML="";
 if(!rows.length){tb.innerHTML='<tr class="noresults"><td colspan="11">No deals match the current filters.</td></tr>';return}
 let html="";
 if(sortCol){
  rows=[...rows].sort((a,b)=>sortDir*cmp(a,b,sortCol));
  rows.forEach(r=>html+=rowHtml(r));
 }else{
  // group by top parent, order groups by most recent close desc
  const groups={};rows.forEach(r=>{(groups[r.top]=groups[r.top]||[]).push(r)});
  const order=Object.keys(groups).sort((a,b)=>{
   const ma=Math.max(...groups[a].map(r=>r.close.replace(/-/g,""))),mb=Math.max(...groups[b].map(r=>r.close.replace(/-/g,"")));
   return mb-ma});
  order.forEach(g=>{
   html+='<tr class="grp"><td colspan="11">'+esc(g)+' ('+groups[g].length+')</td></tr>';
   groups[g].sort((a,b)=>b.close.localeCompare(a.close)).forEach(r=>html+=rowHtml(r))});
 }
 tb.innerHTML=html;
}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function rowHtml(r){return'<tr><td>'+esc(r.acct)+'</td>'+
 '<td><a class="deal" target="_blank" href="'+SF+r.id+'/view">'+esc(r.name)+'</a></td>'+
 '<td>'+esc(r.type||"")+'</td><td>'+intBadges(r.ints)+'</td><td>'+hubBadge(r.hub)+'</td>'+
 '<td>'+r.close+'</td><td>'+fmtMoney(r.acv,r.cur)+'</td><td>'+(r.agents??"—")+'</td>'+
 '<td>'+(r.region||"—")+'</td><td>'+glLabel(r)+'</td><td>'+esc(r.owner)+'</td></tr>'}
render();
</script>
