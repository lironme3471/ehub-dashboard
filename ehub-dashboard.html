<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eHub Closed Won Dashboard</title>
<style>
  :root {
    --nice-blue: #3694FC;
    --nice-charcoal: #21212B;
    --nice-indigo: #6100FF;
    --nice-teal: #36EAD0;
    --nice-coral: #FF5B8A;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f4f6fb;
    color: var(--nice-charcoal);
    margin: 0;
    padding: 0;
  }
  #gate {
    position: fixed; inset: 0; background: var(--nice-charcoal);
    display: flex; align-items: center; justify-content: center; z-index: 999;
  }
  #gate .box {
    background: #fff; padding: 40px; border-radius: 12px; width: 320px; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }
  #gate h2 { margin-top: 0; color: var(--nice-charcoal); }
  #gate input {
    width: 100%; padding: 10px; margin: 12px 0; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  #gate button {
    width: 100%; padding: 10px; background: var(--nice-blue); color: #fff; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600;
  }
  #gate .err { color: var(--nice-coral); font-size: 13px; min-height: 18px; }
  #app { display: none; max-width: 1400px; margin: 0 auto; padding: 24px; }
  .banner {
    background: #FFE066; color: #4a3b00; padding: 12px 18px; border-radius: 8px;
    font-weight: 600; margin-bottom: 20px; font-size: 14px;
  }
  h1 { font-size: 22px; margin: 0 0 20px 0; color: var(--nice-charcoal); }
  .kpis { display: flex; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
  .kpi {
    background: #fff; border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 130px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .kpi .label { font-size: 12px; color: #6b6b76; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi .value { font-size: 24px; font-weight: 700; color: var(--nice-charcoal); margin-top: 4px; }
  .kpi.live .value { color: #1a9e6a; }
  .kpi.delayed .value { color: var(--nice-coral); }
  .kpi.eta .value { color: var(--nice-blue); }
  .filters {
    display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center;
  }
  .filters input, .filters select {
    padding: 8px 10px; border: 1px solid #d3d3db; border-radius: 6px; font-size: 13px; background: #fff;
  }
  .filters input { flex: 1; min-width: 200px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  thead th {
    background: var(--nice-charcoal); color: #fff; padding: 10px 8px; text-align: left; font-size: 12px;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { background: #34343f; }
  thead th.sorted::after { content: " \25BE"; }
  tbody td { padding: 8px; font-size: 13px; border-bottom: 1px solid #eee; vertical-align: middle; }
  tbody tr:hover { background: #f8f9fd; }
  tr.group-header td {
    background: #eef2fb; font-weight: 700; font-size: 12.5px; color: var(--nice-charcoal);
    padding: 8px 10px; border-top: 2px solid #dfe4f0;
  }
  a.deal-link { color: var(--nice-blue); text-decoration: none; }
  a.deal-link:hover { text-decoration: underline; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10.5px; font-weight: 700;
    color: #fff; margin-right: 4px; white-space: nowrap;
  }
  .badge.smartreach { background: #FF8A00; }
  .badge.ticketing { background: #8A2BE2; }
  .badge.amc { background: #1a9e6a; }
  .hub-badge {
    display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; color: #fff;
  }
  .hub-rt-offline { background: var(--nice-indigo); }
  .hub-offline { background: var(--nice-teal); color: #124d45; }
  .hub-realtime { background: var(--nice-blue); }
  .go-live { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
  .go-live.live { background: #d5f5e5; color: #1a9e6a; }
  .go-live.delayed { background: #ffe3ea; color: #c23a5e; }
  .go-live.eta { background: #dbeafe; color: #1d5fbf; }
  .go-live.tbd { background: #eee; color: #777; }
  .no-results td { text-align: center; padding: 30px; color: #888; }
</style>
</head>

    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

async function sha256(msg) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPw() {
  const val = document.getElementById('pw').value;
  const hash = await sha256(val);
  if (hash === PW_HASH) {
    localStorage.setItem('ehubdash_auth', hash);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password.';
  }
}

window.addEventListener('DOMContentLoaded', () => {
  const stored = localStorage.getItem('ehubdash_auth');
  if (stored === PW_HASH) {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  }
  init();
});

let sortState = null; // {key, dir} or null = default grouping

function fmtMoney(v, ccy) {
  const sym = ccy === 'USD' ? '$' : (ccy + ' ');
  return sym + Number(v).toLocaleString(undefined, {maximumFractionDigits: 0});
}

function golivePillClass(status) {
  return {'Live':'live','Delayed':'delayed','ETA':'eta','TBD':'tbd'}[status] || 'tbd';
}

function golivePillText(row) {
  if (row.GoLiveStatus === 'Live') return 'Live';
  if (row.GoLiveStatus === 'TBD') return 'TBD';
  return row.GoLiveStatus + (row.GoLiveDate ? ' ' + row.GoLiveDate : '');
}

function hubClass(hub) {
  if (hub === 'RT + Offline') return 'hub-rt-offline';
  if (hub === 'Offline') return 'hub-offline';
  return 'hub-realtime';
}

function goliveSortRank(row) {
  // 0 = Live, 1 = Delayed/ETA merged (by date asc), 2 = TBD
  if (row.GoLiveStatus === 'Live') return 0;
  if (row.GoLiveStatus === 'TBD') return 2;
  return 1;
}

function populateFilterOptions() {
  const regions = [...new Set(DATA.map(r => r.Region).filter(Boolean))].sort();
  const regionSel = document.getElementById('regionFilter');
  regions.forEach(r => {
    const opt = document.createElement('option'); opt.value = r; opt.textContent = r;
    regionSel.appendChild(opt);
  });
  const hubs = ['Real-Time', 'Offline', 'RT + Offline'];
  const hubSel = document.getElementById('hubFilter');
  hubs.forEach(h => {
    const opt = document.createElement('option'); opt.value = h; opt.textContent = h;
    hubSel.appendChild(opt);
  });
  const statuses = ['Live', 'Delayed', 'ETA', 'TBD'];
  const golSel = document.getElementById('goliveFilter');
  statuses.forEach(s => {
    const opt = document.createElement('option'); opt.value = s; opt.textContent = s;
    golSel.appendChild(opt);
  });
}

function applyFilters() {
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const region = document.getElementById('regionFilter').value;
  const hub = document.getElementById('hubFilter').value;
  const golive = document.getElementById('goliveFilter').value;
  return DATA.filter(r => {
    if (q && !(r.Account.toLowerCase().includes(q) || r.DealName.toLowerCase().includes(q))) return false;
    if (region && r.Region !== region) return false;
    if (hub && r.Hub !== hub) return false;
    if (golive && r.GoLiveStatus !== golive) return false;
    return true;
  });
}

function renderKpis(rows) {
  document.getElementById('kpiTotal').textContent = rows.length;
  const usdAcv = rows.filter(r => r.Currency === 'USD').reduce((s,r) => s + r.ACV, 0);
  document.getElementById('kpiAcv').textContent = '$' + Math.round(usdAcv).toLocaleString();
  document.getElementById('kpiLive').textContent = rows.filter(r => r.GoLiveStatus === 'Live').length;
  document.getElementById('kpiDelayed').textContent = rows.filter(r => r.GoLiveStatus === 'Delayed').length;
  document.getElementById('kpiEta').textContent = rows.filter(r => r.GoLiveStatus === 'ETA').length;
  document.getElementById('kpiTbd').textContent = rows.filter(r => r.GoLiveStatus === 'TBD').length;
}

function integrationBadges(row) {
  return row.Integration.map(i => `<span class="badge ${i.toLowerCase()}">${i}</span>`).join('');
}

function rowHtml(r) {
  return `<tr>
    <td>${r.Account}</td>
    <td><a class="deal-link" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${r.Id}/view" target="_blank">${r.DealName}</a></td>
    <td>${r.ContractType || ''}</td>
    <td>${integrationBadges(r)}</td>
    <td><span class="hub-badge ${hubClass(r.Hub)}">${r.Hub}</span></td>
    <td>${r.CloseDate}</td>
    <td>${fmtMoney(r.ACV, r.Currency)}</td>
    <td>${r.Agents != null ? r.Agents : ''}</td>
    <td>${r.Region || ''}</td>
    <td><span class="go-live ${golivePillClass(r.GoLiveStatus)}">${golivePillText(r)}</span></td>
    <td>${r.Owner || ''}</td>
  </tr>`;
}

function render() {
  const filtered = applyFilters();
  renderKpis(filtered);
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr class="no-results"><td colspan="11">No deals match the current filters.</td></tr>';
    return;
  }

  if (sortState) {
    let sorted = [...filtered];
    const key = sortState.key;
    sorted.sort((a,b) => {
      let av, bv;
      if (key === 'GoLive') {
        const ra = goliveSortRank(a), rb = goliveSortRank(b);
        if (ra !== rb) return ra - rb;
        if (ra === 1) {
          av = a.GoLiveDate || '9999-99-99'; bv = b.GoLiveDate || '9999-99-99';
          return av < bv ? -1 : av > bv ? 1 : 0;
        }
        return 0;
      }
      if (key === 'Integration') { av = a.Integration.join(','); bv = b.Integration.join(','); }
      else { av = a[key]; bv = b[key]; }
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return av - bv;
      return String(av).localeCompare(String(bv));
    });
    if (sortState.dir === 'desc' && key !== 'GoLive') sorted.reverse();
    tbody.innerHTML = sorted.map(rowHtml).join('');
  } else {
    // default: grouped by TopParent, groups ordered by most recent close date desc, rows within group by close date desc
    const groups = {};
    filtered.forEach(r => {
      const g = r.TopParent || r.Account;
      if (!groups[g]) groups[g] = [];
      groups[g].push(r);
    });
    const groupNames = Object.keys(groups).sort((a,b) => {
      const maxA = Math.max(...groups[a].map(r => new Date(r.CloseDate).getTime()));
      const maxB = Math.max(...groups[b].map(r => new Date(r.CloseDate).getTime()));
      return maxB - maxA;
    });
    let out = '';
    groupNames.forEach(g => {
      const rowsInGroup = groups[g].slice().sort((a,b) => new Date(b.CloseDate) - new Date(a.CloseDate));
      out += `<tr class="group-header"><td colspan="11">${g} (${rowsInGroup.length})</td></tr>`;
      out += rowsInGroup.map(rowHtml).join('');
    });
    tbody.innerHTML = out;
  }
}

function initSortHeaders() {
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (sortState && sortState.key === key) {
        sortState.dir = sortState.dir === 'asc' ? 'desc' : 'asc';
      } else {
        sortState = {key, dir: 'asc'};
      }
      document.querySelectorAll('thead th').forEach(x => x.classList.remove('sorted'));
      th.classList.add('sorted');
      render();
    });
  });
  document.getElementById('resetSortBtn').addEventListener('click', () => {
    sortState = null;
    document.querySelectorAll('thead th').forEach(x => x.classList.remove('sorted'));
    render();
  });
}

function init() {
  populateFilterOptions();
  initSortHeaders();
  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('regionFilter').addEventListener('change', render);
  document.getElementById('hubFilter').addEventListener('change', render);
  document.getElementById('goliveFilter').addEventListener('change', render);
  render();
}
</script>
</body>
