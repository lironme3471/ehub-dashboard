async function sha256(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
async function check(){const v=document.getElementById('pw').value;const h=await sha256(v);if(h===PW_HASH){localStorage.setItem('ehub_ok','1');show();}else{document.getElementById('err').textContent='Incorrect password';}}
function show(){document.getElementById('gate').style.display='none';document.getElementById('app').style.display='block';init();}
if(localStorage.getItem('ehub_ok')==='1'){window.addEventListener('DOMContentLoaded',show);}
let sortKey='glsort',sortDir=1;
function sortBy(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}render();}
function init(){
 const regs=[...new Set(DATA.rows.map(r=>r.region).filter(x=>x))].sort();
 const rs=document.getElementById('region');regs.forEach(r=>{const o=document.createElement('option');o.textContent=r;rs.appendChild(o);});
 const total=DATA.rows.length;
 const live=DATA.rows.filter(r=>r.glcls==='gl-live').length;
 const delayed=DATA.rows.filter(r=>r.glcls==='gl-delayed').length;
 const eta=DATA.rows.filter(r=>r.glcls==='gl-eta').length;
 const tbd=DATA.rows.filter(r=>r.glcls==='gl-tbd').length;
 const usdAcv=DATA.rows.filter(r=>r.cur==='USD').reduce((s,r)=>s+(r.acv||0),0);
 const kpis=document.getElementById('kpis');
 kpis.innerHTML=
  '<div class="kpi"><div class="v">'+total+'</div><div class="l">Total Deals</div></div>'+
  '<div class="kpi"><div class="v">$'+Math.round(usdAcv).toLocaleString()+'</div><div class="l">USD ACV</div></div>'+
  '<div class="kpi"><div class="v">'+live+'</div><div class="l">Live</div></div>'+
  '<div class="kpi"><div class="v">'+delayed+'</div><div class="l">Delayed</div></div>'+
  '<div class="kpi"><div class="v">'+eta+'</div><div class="l">ETA</div></div>'+
  '<div class="kpi"><div class="v">'+tbd+'</div><div class="l">TBD</div></div>';
 render();
}
function fmtACV(r){return r.cur+' '+(r.acv?r.acv.toLocaleString(undefined,{maximumFractionDigits:0}):'0');}
function glCategory(r){if(r.glcls==='gl-live')return 'Live';if(r.glcls==='gl-delayed')return 'Delayed';if(r.glcls==='gl-eta')return 'ETA';return 'TBD';}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const fr=document.getElementById('region').value,fh=document.getElementById('hub').value,fs=document.getElementById('status').value;
 let rows=DATA.rows.filter(r=>{
   if(q&&!(r.acct.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)))return false;
   if(fr&&r.region!==fr)return false;
   if(fh&&r.hub!==fh)return false;
   if(fs&&glCategory(r)!==fs)return false;
   return true;
 });
 rows.sort((a,b)=>{
   let x,y;
   if(sortKey==='glsort'){
     const rank=r=>r.glcls==='gl-live'?0:(r.glcls==='gl-tbd'?2:1);
     const ra=rank(a),rb=rank(b);
     if(ra!==rb)return ra-rb;
     if(ra===1){x=a.glsort||'9999';y=b.glsort||'9999';return x<y?-1:x>y?1:0;}
     return 0;
   }
   x=a[sortKey];y=b[sortKey];
   if(sortKey==='acv'||sortKey==='agents'){x=x||0;y=y||0;return (x-y)*sortDir;}
   x=(x||'').toString().toLowerCase();y=(y||'').toString().toLowerCase();
   return (x<y?-1:x>y?1:0)*sortDir;
 });
 const groups={};rows.forEach(r=>{(groups[r.group]=groups[r.group]||[]).push(r);});
 const gorder=Object.keys(groups).sort((a,b)=>DATA.grp_recent[b].localeCompare(DATA.grp_recent[a]));
 const tb=document.getElementById('tb');tb.innerHTML='';
 if(rows.length===0){tb.innerHTML='<tr><td colspan="11" style="text-align:center;padding:30px;color:#999;">No deals match filters</td></tr>';return;}
 gorder.forEach(g=>{
   const tr=document.createElement('tr');tr.className='grp';
   tr.innerHTML='<td colspan="11">'+esc(g)+' \u00b7 '+groups[g].length+' deal(s)</td>';tb.appendChild(tr);
   groups[g].forEach(r=>{
     const integ=r.integ.map(i=>'<span class="badge" style="background:'+i[1]+'">'+i[0]+'</span>').join('');
     const tr2=document.createElement('tr');
     tr2.innerHTML='<td>'+esc(r.acct)+'</td>'+
      '<td><a href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+r.id+'/view" target="_blank">'+esc(r.name)+'</a></td>'+
      '<td>'+esc(r.type)+'</td><td>'+integ+'</td>'+
      '<td><span class="hub" style="background:'+r.hubcolor+'">'+r.hub+'</span></td>'+
      '<td>'+r.close+'</td><td>'+fmtACV(r)+'</td>'+
      '<td>'+(r.agents!=null?r.agents:'')+'</td><td>'+esc(r.region)+'</td>'+
      '<td class="'+r.glcls+'">'+esc(r.gl)+'</td><td>'+esc(r.owner)+'</td>';
     tb.appendChild(tr2);
   });
 });
}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
