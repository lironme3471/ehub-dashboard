<style>
:root{--blue:#3694FC;--charcoal:#21212B;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f4f6fa;color:var(--charcoal);}
/* ---- password gate ---- */
#gate{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:99;}
#gate .box{background:#fff;padding:40px 44px;border-radius:14px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:360px;width:90%;}
#gate h1{font-size:20px;margin-bottom:6px;}
#gate p{font-size:13px;color:#777;margin-bottom:18px;}
#gate input{width:100%;padding:10px 12px;border:1.5px solid #d8dce4;border-radius:8px;font-size:14px;margin-bottom:12px;}
#gate button{width:100%;padding:10px;border:0;border-radius:8px;background:var(--blue);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
#gate .err{color:var(--coral);font-size:12px;min-height:16px;margin-top:8px;}
/* ---- layout ---- */
#app{display:none;max-width:1440px;margin:0 auto;padding:24px;}
header.top{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;}
header.top h1{font-size:24px;color:var(--charcoal);}
header.top .sub{color:#888;font-size:13px;}
.banner{background:#FFF6D6;border:1px solid #F0DF9A;color:#7a6410;padding:10px 16px;border-radius:8px;font-size:13px;margin-bottom:18px;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border-radius:12px;padding:16px 18px;box-shadow:0 1px 4px rgba(33,33,43,.08);}
.kpi .v{font-size:24px;font-weight:700;color:var(--blue);}
.kpi.live .v{color:#1fa971;}.kpi.delayed .v{color:var(--coral);}.kpi.eta .v{color:var(--blue);}.kpi.tbd .v{color:#8a8f9c;}
.kpi .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:#8a8f9c;margin-top:3px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.filters input,.filters select{padding:9px 12px;border:1.5px solid #d8dce4;border-radius:8px;font-size:13.5px;background:#fff;}
.filters input{flex:1;min-width:220px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(33,33,43,.08);}
thead th{background:var(--charcoal);color:#fff;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:11px 10px;text-align:left;cursor:pointer;user-select:none;white-space:nowrap;}
thead th .arr{opacity:.6;font-size:10px;margin-left:3px;}
tbody td{padding:9px 10px;font-size:13px;border-top:1px solid #eef0f5;vertical-align:middle;}
tr.grp td{background:#e9f2fe;font-weight:700;font-size:12.5px;color:var(--charcoal);letter-spacing:.03em;padding:7px 10px;border-top:2px solid #d3e5fb;}
a.deal{color:var(--blue);text-decoration:none;font-weight:500;}
a.deal:hover{text-decoration:underline;}
.badge{display:inline-block;padding:2.5px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.hub-rt{background:rgba(54,148,252,.14);color:#1668c4;}
.hub-off{background:rgba(54,234,208,.2);color:#0b8d76;}
.hub-both{background:rgba(97,0,255,.1);color:var(--indigo);}
.int-sr{background:rgba(255,153,0,.15);color:#b56a00;margin-right:4px;}
.int-tk{background:rgba(128,0,255,.1);color:#7a1fd0;margin-right:4px;}
.int-amc{background:rgba(31,169,113,.14);color:#158556;margin-right:4px;}
.gl-live{background:rgba(31,169,113,.15);color:#158556;}
.gl-delayed{background:rgba(255,91,138,.15);color:#d63864;}
.gl-eta{background:rgba(54,148,252,.14);color:#1668c4;}
.gl-tbd{background:#eef0f5;color:#8a8f9c;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.nores td{text-align:center;color:#8a8f9c;padding:26px;}
footer{margin:18px 0 6px;color:#a5aab6;font-size:12px;text-align:center;}
@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr);}}
</style>

const KPI={"n": 51, "usd": 19784150.94, "live": 30, "delayed": 10, "eta": 9, "tbd": 2};
const SF="https://niceincontact.lightning.force.com/lightning/r/Opportunity/";

/* ---------- password gate ---------- */
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");}
async function tryPw(){const v=document.getElementById("pw").value;
  if(await sha256(v)===HASH){localStorage.setItem("ehubdash_auth",HASH);unlock();}
  else document.getElementById("pwerr").textContent="Incorrect password";}
function unlock(){document.getElementById("gate").style.display="none";document.getElementById("app").style.display="block";render();}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryPw();});
if(localStorage.getItem("ehubdash_auth")===HASH){unlock();}

/* ---------- helpers ---------- */
const SYM={USD:"$",GBP:"\u00a3",CAD:"CA$",AUD:"A$"};
const fmtACV=x=>(SYM[x.cur]||x.cur+" ")+Math.round(x.acv).toLocaleString("en-US");
const fmtD=s=>{if(!s)return"";const[y,m,dd]=s.split("-");return`${m}/${dd}/${y}`;};
function glLabel(x){
  if(x.gl==="live")return'<span class="badge gl-live">Live</span>';
  if(x.gl==="delayed")return'<span class="badge gl-delayed">Delayed \u2192 '+fmtD(x.gld)+'</span>';
  if(x.gl==="eta")return'<span class="badge gl-eta">ETA '+fmtD(x.gld)+'</span>';
  return'<span class="badge gl-tbd">TBD</span>';}
function hubBadge(h){const c=h==="Offline"?"hub-off":h==="RT + Offline"?"hub-both":"hub-rt";
  return`<span class="badge ${c}">${h}</span>`;}
function intBadges(a){return a.map(i=>`<span class="badge ${i==="SmartReach"?"int-sr":i==="Ticketing"?"int-tk":"int-amc"}">${i}</span>`).join("")||"";}

/* ---------- KPIs ---------- */
document.getElementById("kpis").innerHTML=
 `<div class="kpi"><div class="v">${KPI.n}</div><div class="l">Total Deals</div></div>
  <div class="kpi"><div class="v">$${(KPI.usd/1e6).toFixed(1)}M</div><div class="l">USD ACV</div></div>
  <div class="kpi live"><div class="v">${KPI.live}</div><div class="l">Live</div></div>
  <div class="kpi delayed"><div class="v">${KPI.delayed}</div><div class="l">Delayed</div></div>
  <div class="kpi eta"><div class="v">${KPI.eta}</div><div class="l">ETA</div></div>
  <div class="kpi tbd"><div class="v">${KPI.tbd}</div><div class="l">TBD</div></div>`;

/* region filter options */
[...new Set(DEALS.map(x=>x.region).filter(Boolean))].sort().forEach(r=>{
  const o=document.createElement("option");o.textContent=r;document.getElementById("fRegion").appendChild(o);});

/* ---------- sorting ---------- */
let sortK=null,sortDir=1;
function glKey(x){ // Live first, Delayed+ETA merged by date, TBD last
  if(x.gl==="live")return[0,0];
  if(x.gl==="tbd")return[2,0];
  return[1,new Date(x.gld).getTime()];}
function cmp(a,b,k){
  if(k==="gl"){const A=glKey(a),B=glKey(b);
    if(A[0]!==B[0])return A[0]-B[0];              // Live block / dated / TBD fixed
    return(A[1]-B[1])*sortDir;}                    // dates merge Delayed+ETA
  let va,vb;
  if(k==="acv"){va=a.acv;vb=b.acv;}
  else if(k==="agents"){va=a.agents??-1;vb=b.agents??-1;}
  else if(k==="close"){va=a.close;vb=b.close;}
  else if(k==="integ"){va=a.integ.join(",");vb=b.integ.join(",");}
  else{va=(a[k]||"").toString().toLowerCase();vb=(b[k]||"").toString().toLowerCase();}
  return(va<vb?-1:va>vb?1:0)*sortDir;}

document.querySelectorAll("thead th").forEach(th=>th.addEventListener("click",()=>{
  const k=th.dataset.k;
  if(sortK===k){if(sortDir===1)sortDir=-1;else{sortK=null;sortDir=1;}}
  else{sortK=k;sortDir=1;}
  document.querySelectorAll("thead th .arr").forEach(s=>s.textContent="");
  if(sortK)th.querySelector(".arr").textContent=sortDir===1?"\u25b2":"\u25bc";
  render();}));

/* ---------- render ---------- */
["q","fRegion","fHub","fGl"].forEach(id=>document.getElementById(id).addEventListener("input",render));
function filtered(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const r=document.getElementById("fRegion").value,h=document.getElementById("fHub").value,g=document.getElementById("fGl").value;
  return DEALS.filter(x=>
    (!q||x.acct.toLowerCase().includes(q)||x.name.toLowerCase().includes(q))&&
    (!r||x.region===r)&&(!h||x.hub===h)&&(!g||x.gl===g));}
function rowHtml(x){
  return`<tr><td>${x.acct}</td>
  <td><a class="deal" href="${SF}${x.id}/view" target="_blank" rel="noopener">${x.name}</a></td>
  <td>${x.type}</td><td>${intBadges(x.integ)}</td><td>${hubBadge(x.hub)}</td>
  <td>${fmtD(x.close)}</td><td class="num">${fmtACV(x)}</td>
  <td class="num">${x.agents??""}</td><td>${x.region||""}</td>
  <td>${glLabel(x)}</td><td>${x.owner}</td></tr>`;}
function render(){
  const rows=filtered();const tb=document.getElementById("rows");
  if(!rows.length){tb.innerHTML='<tr class="nores"><td colspan="11">No deals match the current filters.</td></tr>';return;}
  if(sortK){ // flat sorted view
    tb.innerHTML=[...rows].sort((a,b)=>cmp(a,b,sortK)).map(rowHtml).join("");return;}
  // grouped default: groups by most recent close date desc
  const groups={};rows.forEach(x=>{(groups[x.group]=groups[x.group]||[]).push(x);});
  const order=Object.keys(groups).sort((a,b)=>{
    const ma=Math.max(...groups[a].map(x=>new Date(x.close).getTime()));
    const mb=Math.max(...groups[b].map(x=>new Date(x.close).getTime()));
    return mb-ma;});
  tb.innerHTML=order.map(gn=>`<tr class="grp"><td colspan="11">${gn} (${groups[gn].length})</td></tr>`+
    groups[gn].sort((a,b)=>a.close<b.close?1:-1).map(rowHtml).join("")).join("");}
</script>
