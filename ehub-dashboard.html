 default:return String(r[col]==null?'':r[col]).toLowerCase();}}

function setSort(c){if(sortCol===c){if(sortDir===1){sortDir=-1;}else{sortCol=null;sortDir=1;}}else{sortCol=c;sortDir=1;}render();}

function render(){
 var q=document.getElementById('f-q').value.trim().toLowerCase(),reg=document.getElementById('f-region').value,hub=document.getElementById('f-hub').value,gl=document.getElementById('f-gl').value;
 var rows=DATA.filter(function(r){
  if(q&&(r.account+' '+r.name+' '+r.group).toLowerCase().indexOf(q)<0)return false;
  if(reg&&(reg==='__blank__'?(r.region||'')!=='':r.region!==reg))return false;
  if(hub&&r.hub!==hub)return false; if(gl&&r.gl!==gl)return false; return true;});
 // Default view: grouped by top parent, groups ordered by most recent close date desc.
 // When a column sort is active, rows are sorted globally (flat list) so e.g. the Go-Live sort
 // gives Live first, then Delayed+ETA merged by date, then TBD. Third click on a header clears the sort.
 var gl_;
 if(sortCol){
  rows.sort(function(a,b){return cmp(sortKey(a,sortCol),sortKey(b,sortCol))*sortDir||cmp(b.close,a.close);});
  gl_=[{name:null,rows:rows}];
 }else{
  var groups={};rows.forEach(function(r){(groups[r.group]=groups[r.group]||[]).push(r);});
  gl_=Object.keys(groups).map(function(k){return{name:k,rows:groups[k]};});
  gl_.forEach(function(g){g.rows.sort(function(a,b){return cmp(b.close,a.close);});g.latest=g.rows[0].close;});
  gl_.sort(function(a,b){return cmp(b.latest,a.latest)||cmp(a.name,b.name);});
 }
 VIEW=[];var h='';
 gl_.forEach(function(g){if(g.name!==null)h+='<tr class="grp"><td colspan="11">'+esc(g.name)+'<span class="gc">'+g.rows.length+' deal'+(g.rows.length>1?'s':'')+'</span></td></tr>';
  g.rows.forEach(function(r){VIEW.push(r);
   h+='<tr><td>'+esc(r.account)+'</td><td><a class="deal" target="_blank" rel="noopener" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+r.id+'/view">'+esc(r.name)+'</a></td><td>'+esc(r.type)+'</td><td>'+r.badges.map(badgeHtml).join('')+'</td><td><span class="b '+hubCls(r.hub)+'">'+esc(r.hub)+'</span></td><td class="num">'+esc(r.close)+'</td><td class="num">'+esc(fmtAcv(r))+'</td><td class="num">'+(r.agents==null?'—':fmtNum(r.agents))+'</td><td>'+(esc(r.region)||'—')+'</td><td><span class="gl gl-'+r.gl+'">'+esc(glText(r))+'</span></td><td>'+esc(r.owner)+'</td></tr>';});});
 if(!VIEW.length)h='<tr class="nores"><td colspan="11">No deals match the current filters.</td></tr>';
 document.getElementById('tbody').innerHTML=h;
 document.getElementById('hdr').innerHTML=COLS.map(function(c){return '<th title="Click to sort (3rd click returns to grouped view)" onclick="setSort(\''+c[0]+'\')">'+c[1]+(sortCol===c[0]?'<span class="arr">'+(sortDir>0?'▲':'▼')+'</span>':'')+'</th>';}).join('');
 var usd=VIEW.filter(function(r){return r.cur==='USD';}).reduce(function(s,r){return s+r.acv;},0);
 document.getElementById('k-total').textContent=VIEW.length;
 document.getElementById('k-acv').textContent='$'+(usd>=1e6?(usd/1e6).toFixed(2)+'M':fmtNum(Math.round(usd)));
 ['Live','Delayed','ETA','TBD'].forEach(function(s){document.getElementById('k-'+s.toLowerCase()).textContent=VIEW.filter(function(r){return r.gl===s;}).length;});
 document.getElementById('count').textContent=VIEW.length+' of '+DATA.length+' deals';
}

function exportExcel(){
 var head=['Account','Deal Name','Type','Integration','Hub','Close Date','ACV','Currency','Agents','Region','Go-Live','Owner','Salesforce Link'];
 var body=VIEW.map(function(r){return[r.account,r.name,r.type,r.badges.join(', '),r.hub,r.close,Math.round(r.acv*100)/100,r.cur,r.agents==null?'':r.agents,r.region,glText(r),r.owner,'https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+r.id+'/view'];});
 var d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 if(window.XLSX){var ws=XLSX.utils.aoa_to_sheet([head].concat(body));ws['!cols']=[30,60,22,24,14,12,14,9,9,14,18,22,40].map(function(w){return{wch:w};});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'eHub Deals');XLSX.writeFile(wb,'ehub-closed-won-'+ds+'.xlsx');return;}
 var csv=[head].concat(body).map(function(row){return row.map(function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',');}).join('\r\n');
 var blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ehub-closed-won-'+ds+'.csv';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
