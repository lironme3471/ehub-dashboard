async function checkPwd() {
  const val = document.getElementById('pwInput').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if (hex === PWD_HASH) {
    try { localStorage.setItem('ehubAuth', hex); } catch(e) {}
    document.getElementById('pwOverlay').style.display='none';
    document.getElementById('app').style.display='block';
    render();
  } else {
    document.getElementById('pwErr').textContent = 'Incorrect password';
  }
}

const INTEG_COLORS = {SmartReach:'#FF9900', Ticketing:'#8B5CF6', AMC:'#22C55E'};
const ACD_COLORS = {Cisco:'#049FD9', Avaya:'#CC0000', 'Genesys SIPREC':'#6A1B9A', 'MS Teams':'#5059C9', 'Cisco + MS Teams':'#4a6fa5'};

function badgeIntegOrAcd(d) {
  let out = '';
  if (d.hub === 'Real-Time' || d.hub === 'RT + Offline') {
    if (d.acd) out += `<span class="badge" style="background:${ACD_COLORS[d.acd]||'#999'}">${d.acd}</span>`;
  } else {
    (d.integ||[]).forEach(i => out += `<span class="badge" style="background:${INTEG_COLORS[i]||'#999'}">${i}</span>`);
  }
  return out;
}

function hubBadge(hub) {
  if (hub === 'RT + Offline') return `<span class="badge hub-both">RT + Offline</span>`;
  if (hub === 'Offline') return `<span class="badge hub-offline">Offline</span>`;
  return `<span class="badge hub-rt">Real-Time</span>`;
}

function statusBadge(d) {
  const cls = {Live:'status-live', Delayed:'status-delayed', ETA:'status-eta', TBD:'status-tbd'}[d.status] || '';
  let label = d.status;
  if (d.gdate && (d.status==='Delayed' || d.status==='ETA')) label += ' ' + d.gdate;
  return `<span class="${cls}">${label}</span>`;
}

function fmtMoney(d) { return d.cur + ' ' + Math.round(d.acv).toLocaleString(); }

function golSortKey(d) {
  // Live first (date -Infinity), then by date asc (Delayed+ETA merged), TBD last
  if (d.status === 'Live') return -8640000000000000;
  if (d.status === 'TBD') return 8640000000000000;
  return new Date(d.gdate).getTime();
}

function filtered() {
  const q = document.getElementById('fSearch').value.toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const gl = document.getElementById('fGoLive').value;
  return DATA.filter(d => {
    if (q && !(d.account.toLowerCase().includes(q) || d.name.toLowerCase().includes(q))) return false;
    if (region && d.region !== region) return false;
    if (hub && d.hub !== hub) return false;
    if (gl && d.status !== gl) return false;
    return true;
  });
}

function populateFilters() {
  const regions = [...new Set(DATA.map(d=>d.region).filter(Boolean))].sort();
  const rs = document.getElementById('fRegion');
  regions.forEach(r => rs.innerHTML += `<option value="${r}">${r}</option>`);
  const hs = document.getElementById('fHub');
  ['Offline','Real-Time','RT + Offline'].forEach(h => hs.innerHTML += `<option value="${h}">${h}</option>`);
  const gs = document.getElementById('fGoLive');
  ['Live','Delayed','ETA','TBD'].forEach(s => gs.innerHTML += `<option value="${s}">${s}</option>`);
  ['fSearch','fRegion','fHub','fGoLive'].forEach(id => document.getElementById(id).addEventListener('input', render));
}

      let av, bv;
      if (sortCol === 'gdate') { av = golSortKey(a); bv = golSortKey(b); }
      else if (sortCol === 'acv') { av = a.acv; bv = b.acv; }
      else if (sortCol === 'close') { av = a.close; bv = b.close; }
      else if (sortCol === 'integ') { av = (a.acd||a.integ.join(',')); bv = (b.acd||b.integ.join(',')); }
      else { av = (a[sortCol]||'').toString().toLowerCase(); bv = (b[sortCol]||'').toString().toLowerCase(); }
      if (av < bv) return -1*sortDir;
      if (av > bv) return 1*sortDir;
      return 0;
    });
    let html = '';
    list.forEach(d => { html += dealRow(d, true); });
    tbody.innerHTML = html;
    return;
  }
  // grouped by top account, sorted by group total ACV desc
  const groups = {};
  list.forEach(d => { groups[d.top] = groups[d.top] || []; groups[d.top].push(d); });
  const groupArr = Object.entries(groups).map(([k,v]) => {
    const total = v.reduce((a,d)=>a + (d.cur==='USD'?d.acv:0), 0);
    return {name:k, deals:v.sort((a,b)=>a.close.localeCompare(b.close)), total};
  }).sort((a,b) => b.total - a.total);
  let html = '';
  groupArr.forEach((g,gi) => {
    const acds = [...new Set(g.deals.map(d=>d.acd).filter(Boolean))];
    const integs = [...new Set(g.deals.flatMap(d=>d.integ))];
    const badges = acds.map(a=>`<span class="badge" style="background:${ACD_COLORS[a]||'#999'}">${a}</span>`).concat(
                   integs.map(i=>`<span class="badge" style="background:${INTEG_COLORS[i]||'#999'}">${i}</span>`)).join('');
    html += `<tr class="group-header" onclick="toggleGroup(${gi})"><td colspan="11">${g.name} &nbsp; (${g.deals.length} deals) ${badges} &nbsp; <strong>$${Math.round(g.total).toLocaleString()}</strong></td></tr>`;
    g.deals.forEach(d => { html += dealRow(d, false, gi); });
  });
  if (groupArr.length === 0) html = `<tr><td colspan="11" style="text-align:center;padding:20px;color:#999;">No deals match your filters.</td></tr>`;
  tbody.innerHTML = html;
}

function dealRow(d, showAccount, gi) {
  const accCell = showAccount ? `<td>${d.account}</td>` : `<td class="indent-account">${d.account !== d.top ? d.account : ''}</td>`;
  return `<tr class="deal-row" data-g="${gi}">
    ${accCell}
    <td><a class="dealLink" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view">${d.name}</a></td>
    <td>${d.contract||''}</td>
    <td>${badgeIntegOrAcd(d)}</td>
    <td>${hubBadge(d.hub)}</td>
    <td>${d.close}</td>
    <td>${fmtMoney(d)}</td>
    <td>${d.agents!=null?d.agents:''}</td>
    <td>${d.region||''}</td>
    <td>${statusBadge(d)}</td>
    <td>${d.owner}</td>
  </tr>`;
}

function toggleGroup(gi) {
  document.querySelectorAll(`tr.deal-row[data-g="${gi}"]`).forEach(r => {
    r.style.display = r.style.display === 'none' ? '' : 'none';
  });
}

document.querySelectorAll('th[data-k]').forEach(th => {
  th.addEventListener('click', () => {
    const k = th.dataset.k;
    if (sortCol === k) {
      if (sortDir === 1) sortDir = -1;
      else { sortCol = null; sortDir = 1; }
    } else { sortCol = k; sortDir = 1; }
    document.querySelectorAll('th[data-k]').forEach(t=>t.textContent=t.textContent.replace(/ [▲▼]$/,''));
    if (sortCol) th.textContent += sortDir===1?' ▲':' ▼';
    render();
  });
});

function render() {
  const list = filtered();
  renderStats(list);
  renderSidebar(list);
  renderRows(list);
}

populateFilters();
</script>
</body>
</html>
