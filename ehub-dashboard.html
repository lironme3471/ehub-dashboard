<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>eHub Closed Won Dashboard</title>
<style>
  :root { --nice-blue:#3694FC; --charcoal:#21212B; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background:#f4f6f9; color:var(--charcoal); }
  #lockscreen { position:fixed; inset:0; background:linear-gradient(135deg,#21212B,#3694FC); display:flex; align-items:center; justify-content:center; z-index:999; }
  #lockbox { background:#fff; border-radius:12px; padding:40px; width:320px; box-shadow:0 20px 60px rgba(0,0,0,.3); text-align:center; }
  #lockbox h2 { margin-top:0; color:var(--charcoal); }
  #lockbox input { width:100%; padding:10px; font-size:15px; border:1px solid #ccc; border-radius:6px; margin-bottom:12px; }
  #lockbox button { width:100%; padding:10px; font-size:15px; border:none; border-radius:6px; background:var(--nice-blue); color:#fff; cursor:pointer; }
  #lockerror { color:#d33; font-size:13px; height:18px; }
  #app { display:none; padding:24px; max-width:1500px; margin:0 auto; }
  .banner { background:#FFD23F; color:#3a2e00; padding:10px 16px; border-radius:8px; margin-bottom:16px; font-size:14px; font-weight:600; }
  h1 { font-size:22px; margin:0 0 16px; }
  .kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin-bottom:18px; }
  .kpi { background:#fff; border-radius:10px; padding:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); text-align:center; }
  .kpi .v { font-size:22px; font-weight:700; color:var(--charcoal); }
  .kpi .l { font-size:11px; color:#666; text-transform:uppercase; letter-spacing:.03em; }
  .filters { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
  .filters input, .filters select { padding:8px 10px; border:1px solid #ccc; border-radius:6px; font-size:13px; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  th, td { padding:8px 10px; font-size:12.5px; border-bottom:1px solid #eee; text-align:left; white-space:nowrap; }
  th { background:var(--charcoal); color:#fff; cursor:pointer; user-select:none; position:sticky; top:0; }
  th:hover { background:#33334a; }
  tr.group-row td { background:#e9edf3; font-weight:700; color:var(--charcoal); }
  tr:hover td:not(.group-row) { background:#f7fbff; }
  .badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:10.5px; color:#fff; margin-right:3px; font-weight:600; }
  .hub-badge { padding:3px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .go-live { padding:2px 7px; border-radius:6px; font-size:11px; font-weight:600; }
  .go-live.live { background:#d4f8e8; color:#0a7a45; }
  .go-live.delayed { background:#ffe1ea; color:#c0195a; }
  .go-live.eta { background:#dbeeff; color:#1259a3; }
  .go-live.tbd { background:#eee; color:#666; }
  a.deal-link { color:var(--nice-blue); text-decoration:none; font-weight:600; }
  a.deal-link:hover { text-decoration:underline; }
  #noresults td { text-align:center; padding:20px; color:#888; }
</style>
</head>
<body>

<div id="lockscreen">
  <div id="lockbox">
    <h2>eHub Dashboard</h2>
    <input id="pwd" type="password" placeholder="Password" onkeydown="if(event.key==='Enter') checkPwd()">
    <button onclick="checkPwd()">Unlock</button>
    <div id="lockerror"></div>
  </div>
</div>

<div id="app">
  <h1>eHub Closed Won Dashboard</h1>
  <div class="banner" id="banner"></div>

  <div class="kpis">
    <div class="kpi"><div class="v" id="kpiTotal">-</div><div class="l">Total Deals</div></div>
    <div class="kpi"><div class="v" id="kpiAcv">-</div><div class="l">USD ACV</div></div>
    <div class="kpi"><div class="v" id="kpiLive">-</div><div class="l">Live</div></div>
    <div class="kpi"><div class="v" id="kpiDelayed">-</div><div class="l">Delayed</div></div>
    <div class="kpi"><div class="v" id="kpiEta">-</div><div class="l">ETA</div></div>
    <div class="kpi"><div class="v" id="kpiTbd">-</div><div class="l">TBD</div></div>
  </div>

  <div class="filters">
    <input id="fSearch" type="text" placeholder="Search account / deal name..." oninput="render()" style="flex:1; min-width:220px;">
    <select id="fRegion" onchange="render()"><option value="">All Regions</option></select>
    <select id="fHub" onchange="render()">
      <option value="">All Hub Types</option>
      <option value="offline">Offline</option>
      <option value="rt">Real-Time</option>
      <option value="both">RT + Offline</option>
    </select>
    <select id="fGo" onchange="render()">
      <option value="">All Go-Live Statuses</option>
      <option value="Live">Live</option>
      <option value="Delayed">Delayed</option>
      <option value="ETA">ETA</option>
      <option value="TBD">TBD</option>
    </select>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="sortBy('account')">Account</th>
        <th onclick="sortBy('name')">Deal Name</th>
        <th onclick="sortBy('type')">Type</th>
        <th>Integration</th>
        <th onclick="sortBy('hub')">Hub</th>
        <th onclick="sortBy('close')">Close Date</th>
        <th onclick="sortBy('acv')">ACV</th>
        <th onclick="sortBy('agents')">Agents</th>
        <th onclick="sortBy('region')">Region</th>
        <th onclick="sortBy('golive')">Go-Live</th>
        <th onclick="sortBy('owner')">Owner</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

async function sha256(msg){
  const enc = new TextEncoder().encode(msg);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function checkPwd(){
  const val = document.getElementById('pwd').value;
  const hash = await sha256(val);
  if (hash === PWD_HASH) {
    localStorage.setItem('ehub_auth', hash);
    document.getElementById('lockscreen').style.display='none';
    document.getElementById('app').style.display='block';
    init();
  } else {
    document.getElementById('lockerror').textContent = 'Incorrect password';
  }
}

function fmtDate(s){
  if(!s) return '';
  const d = new Date(s+'T00:00:00');
  return d.toLocaleDateString('en-US', {year:'numeric', month:'short', day:'numeric'});
}

function fmtAcv(d){
  const sym = d.ccy === 'USD' ? '$' : d.ccy === 'GBP' ? '£' : d.ccy === 'CAD' ? 'C$' : d.ccy === 'AUD' ? 'A$' : d.ccy+' ';
  return sym + Number(d.acv).toLocaleString('en-US', {maximumFractionDigits:0});
}

function goLiveDisplay(d){
  if (d.go === 'Live') return {label:'Live', cls:'live', sortDate:'0000-00-00'};
  if (d.go === 'TBD') return {label:'TBD', cls:'tbd', sortDate:'9999-99-99'};
  if (d.go === 'Delayed') return {label:'Delayed → '+fmtDate(d.go_date), cls:'delayed', sortDate:d.go_date};
  if (d.go === 'ETA') return {label:'ETA '+fmtDate(d.go_date), cls:'eta', sortDate:d.go_date};
  return {label:'TBD', cls:'tbd', sortDate:'9999-99-99'};
}

    if (go && d.go !== go) return false;
    return true;
  });

  // KPIs computed on full dataset, not filtered
  document.getElementById('kpiTotal').textContent = DATA.length;
  const usdAcv = DATA.filter(d=>d.ccy==='USD').reduce((s,d)=>s+Number(d.acv),0);
  document.getElementById('kpiAcv').textContent = '$' + usdAcv.toLocaleString('en-US',{maximumFractionDigits:0});
  document.getElementById('kpiLive').textContent = DATA.filter(d=>d.go==='Live').length;
  document.getElementById('kpiDelayed').textContent = DATA.filter(d=>d.go==='Delayed').length;
  document.getElementById('kpiEta').textContent = DATA.filter(d=>d.go==='ETA').length;
  document.getElementById('kpiTbd').textContent = DATA.filter(d=>d.go==='TBD').length;

  // group by top_parent, group order = most recent close date desc within group
  const groups = {};
  rows.forEach(d=>{
    const key = d.top_parent || d.account;
    if(!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const groupKeys = Object.keys(groups).sort((a,b)=>{
    const maxA = Math.max(...groups[a].map(d=>new Date(d.close).getTime()));
    const maxB = Math.max(...groups[b].map(d=>new Date(d.close).getTime()));
    return maxB - maxA;
  });

  function sortRows(list){
    if (!sortCol) return list;
    return [...list].sort((a,b)=>{
      let va, vb;
      if (sortCol === 'golive') {
        va = goLiveDisplay(a).sortDate; vb = goLiveDisplay(b).sortDate;
      } else if (sortCol === 'acv' || sortCol === 'agents') {
        va = Number(a[sortCol])||0; vb = Number(b[sortCol])||0;
      } else if (sortCol === 'close') {
        va = a.close; vb = b.close;
      } else {
        va = (a[sortCol]||'').toString().toLowerCase(); vb = (b[sortCol]||'').toString().toLowerCase();
      }
      if (va < vb) return -1*sortDir;
      if (va > vb) return 1*sortDir;
      return 0;
    });
  }

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (rows.length === 0) {
    tbody.innerHTML = '<tr id="noresults"><td colspan="11">No deals match the current filters.</td></tr>';
    return;
  }

  groupKeys.forEach(key=>{
    const grRow = document.createElement('tr');
    grRow.className = 'group-row';
    grRow.innerHTML = '<td colspan="11">' + key + ' (' + groups[key].length + ')</td>';
    tbody.appendChild(grRow);

    sortRows(groups[key]).forEach(d=>{
      const hubMeta = HUB_META[d.hub];
      const badgesHtml = (d.badges||[]).map(b=>'<span class="badge" style="background:'+b[1]+'">'+b[0]+'</span>').join('');
      const gl = goLiveDisplay(d);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${d.account}</td>
        <td><a class="deal-link" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/${d.id}/view">${d.name}</a></td>
        <td>${d.type||''}</td>
        <td>${badgesHtml}</td>
        <td><span class="hub-badge" style="background:${hubMeta[1]};color:${hubMeta[2]}">${hubMeta[0]}</span></td>
        <td>${fmtDate(d.close)}</td>
        <td>${fmtAcv(d)}</td>
        <td>${d.agents!=null? d.agents : ''}</td>
        <td>${d.region||''}</td>
        <td><span class="go-live ${gl.cls}">${gl.label}</span></td>
        <td>${d.owner||''}</td>
      `;
      tbody.appendChild(tr);
    });
  });
}
</script>
</body>
</html>
