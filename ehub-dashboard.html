<style>
:root{--blue:#3694FC;--charcoal:#21212B;--indigo:#6100FF;--teal:#36EAD0;--coral:#FF5B8A;}
*{box-sizing:border-box;}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f4f5f7;color:var(--charcoal);margin:0;padding:0;}
#overlay{position:fixed;inset:0;background:var(--charcoal);display:flex;align-items:center;justify-content:center;z-index:999;}
#overlay .card{background:#fff;border-radius:12px;padding:40px;width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);}
#overlay h2{margin:0 0 6px;color:var(--blue);}
#overlay input{width:100%;padding:10px;margin:16px 0;border:1px solid #ccc;border-radius:6px;font-size:14px;}
#overlay button{width:100%;padding:10px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;}
#overlay .err{color:var(--coral);font-size:12px;margin-top:4px;}
.hide{display:none !important;}
header{background:var(--charcoal);color:#fff;padding:18px 24px;}
header h1{margin:0;font-size:20px;}
.banner{background:#fff3cd;color:#664d03;padding:8px 24px;font-size:13px;}
.wrap{display:flex;gap:16px;padding:16px 24px;align-items:flex-start;}
.main{flex:1;min-width:0;}
.sidebar{width:260px;flex-shrink:0;}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px;}
.stat{background:#fff;border-radius:8px;padding:12px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.stat .num{font-size:20px;font-weight:700;color:var(--blue);}
.stat .lbl{font-size:11px;color:#666;text-transform:uppercase;}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.filters input,.filters select{padding:7px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;}
.filters input{flex:1;min-width:180px;}
.count{font-size:12px;color:#666;margin-bottom:6px;}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13px;}
th{background:var(--charcoal);color:#fff;text-align:left;padding:9px 8px;cursor:pointer;white-space:nowrap;user-select:none;}
th:hover{background:#333340;}
td{padding:7px 8px;border-bottom:1px solid #eee;}
tr.group-row td{background:#eef3fb;font-weight:600;cursor:pointer;}
tr.deal-row.child-hidden{display:none;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;color:#fff;margin-right:3px;white-space:nowrap;}
.muted{color:#999;}
a.dealink{color:var(--blue);text-decoration:none;}
a.dealink:hover{text-decoration:underline;}
.side-card{background:#fff;border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.side-card h3{margin:0 0 8px;font-size:13px;color:var(--charcoal);}
.side-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid #f2f2f2;}
.sort-arrow{font-size:10px;}
</style>

async function checkPwd(){
  const val = document.getElementById('pwd').value;
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
  const hex = Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  if (hex === PWD_HASH) {
    try { sessionStorage.setItem('ehub_auth','1'); } catch(e) {}
    document.getElementById('overlay').classList.add('hide');
    render();
  } else {
    document.getElementById('pwderr').classList.remove('hide');
  }
}

}

function populateFilters(){
  const regions = [...new Set(DATA.map(r=>r.Region).filter(Boolean))].sort();
  const sel = document.getElementById('fRegion');
  regions.forEach(r=>{ const o=document.createElement('option'); o.value=r; o.textContent=r; sel.appendChild(o); });
  const hubs = [...new Set(DATA.map(r=>r.Hub))].sort();
  const selH = document.getElementById('fHub');
  hubs.forEach(h=>{ const o=document.createElement('option'); o.value=h; o.textContent=h; selH.appendChild(o); });
  const gos = [...new Set(DATA.map(r=>r.GoLiveStatus))].sort();

function goliveSortKey(r){
  // merge Live/Delayed/ETA by actual date, TBD last
  if (r.GoLiveStatus === 'TBD') return 9999999999;
  let d = r.GoLiveDetail;
  if (r.GoLiveStatus === 'Live') return -1; // lives first
  if (d) return new Date(d).getTime();
  return 9999999998;
}

function stageBadge(r){
  const c = GOLIVE_COLORS[r.GoLiveStatus] || '#999';
  let label = r.GoLiveStatus;
  if (r.GoLiveStatus === 'ETA' || r.GoLiveStatus === 'Delayed') label += ' ' + (r.GoLiveDetail||'');
  return '<span class="badge" style="background:'+c+'">'+label+'</span>';
}

function hubBadge(r){
  const c = HUB_COLORS[r.Hub] || '#999';
  return '<span class="badge" style="background:'+c+'">'+r.Hub+'</span>';
}

function intBadges(r){
  if (!r.Badges || !r.Badges.length) return '';
  return r.Badges.map(b=>{
    const c = ACD_COLORS[b] || '#777';
    return '<span class="badge" style="background:'+c+'">'+b+'</span>';
  }).join(' ');
}

const COLS = [
 {key:'Account', label:'Account'},
 {key:'Name', label:'Deal Name'},
 {key:'ContractType', label:'Type'},
 {key:'Badges', label:'Integration'},
 {key:'Hub', label:'Hub'},
 {key:'CloseDate', label:'Close Date'},
 {key:'ACV', label:'ACV'},
 {key:'Agents', label:'Agents'},
 {key:'Region', label:'Region'},
 {key:'GoLiveStatus', label:'Go-Live'},
 {key:'Owner', label:'Owner'},
];

function buildHead(){
  const tr = document.getElementById('headRow');
  tr.innerHTML = '';
  COLS.forEach(c=>{
    const th = document.createElement('th');
    let arrow = '';
    if (sortCol === c.key) arrow = ' <span class="sort-arrow">' + (sortDir===1?'▲':'▼') + '</span>';
    th.innerHTML = c.label + arrow;
    th.onclick = ()=>{
      if (sortCol === c.key) {
        if (sortDir === 1) { sortDir = -1; }
        else { sortCol = null; sortDir = 1; }
      } else {
        sortCol = c.key; sortDir = 1;
      }
      render();
    };
    tr.appendChild(th);
  });
}

function matchesFilter(r, q, region, hub, go){
  if (region && r.Region !== region) return false;
  if (hub && r.Hub !== hub) return false;
  if (go && r.GoLiveStatus !== go) return false;
  if (q) {
    const hay = (r.Account+' '+r.TopParent+' '+r.Name).toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const region = document.getElementById('fRegion').value;
  const hub = document.getElementById('fHub').value;
  const go = document.getElementById('fGo').value;

  const filtered = DATA.filter(r=>matchesFilter(r,q,region,hub,go));

  buildHead();
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (sortCol) {
    const rows = filtered.slice();
    rows.sort((a,b)=>{
      let av, bv;
      if (sortCol === 'GoLiveStatus') { av = goliveSortKey(a); bv = goliveSortKey(b); }
      else if (sortCol === 'ACV') { av = a.ACV; bv = b.ACV; }
      else if (sortCol === 'CloseDate') { av = a.CloseDate; bv = b.CloseDate; }
      else if (sortCol === 'Badges') { av = (a.Badges||[]).join(','); bv = (b.Badges||[]).join(','); }
      else { av = (a[sortCol]||'').toString().toLowerCase(); bv = (b[sortCol]||'').toString().toLowerCase(); }
      if (av < bv) return -1*sortDir;
      if (av > bv) return 1*sortDir;
      return 0;
    });
    rows.forEach(r=>tbody.appendChild(buildRow(r, true)));
  } else {
    // grouped by TopParent, sorted by total ACV desc
    const groups = {};
    filtered.forEach(r=>{
      const k = r.TopParent || r.Account;
      if (!groups[k]) groups[k] = [];
      groups[k].push(r);
    });
    const groupKeys = Object.keys(groups).sort((a,b)=>{
      const ta = groups[a].reduce((s,r)=>s+ (r.Cur==='USD'?r.ACV:0),0);
      const tb = groups[b].reduce((s,r)=>s+ (r.Cur==='USD'?r.ACV:0),0);
      return tb-ta;
    });
    groupKeys.forEach(k=>{
      const rows = groups[k].slice().sort((a,b)=>a.CloseDate.localeCompare(b.CloseDate));
      const gtotalUSD = rows.reduce((s,r)=> s + (r.Cur==='USD'?r.ACV:0), 0);
      const acds = [...new Set(rows.flatMap(r=>r.Badges||[]).concat(rows.map(r=>r.Hub==='Real-Time'||r.Hub==='RT + Offline'?null:null).filter(Boolean)))];
      const gtr = document.createElement('tr');
      gtr.className = 'group-row';
      gtr.innerHTML = '<td colspan="11">&#9656; '+k+' &mdash; '+rows.length+' deal'+(rows.length>1?'s':'')+' &mdash; USD $'+Math.round(gtotalUSD).toLocaleString()+'</td>';
      gtr.onclick = ()=>{ collapsed[k] = !collapsed[k]; render(); };
      tbody.appendChild(gtr);
      if (!collapsed[k]) {
        rows.forEach(r=>tbody.appendChild(buildRow(r, false)));
      }
    });
    if (groupKeys.length===0) {
      const tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="11" style="text-align:center;padding:20px;color:#999;">No deals match your filters.</td>';
      tbody.appendChild(tr);
    }
  }

  document.getElementById('count').textContent = filtered.length + ' deals · ' +
    new Set(filtered.map(r=>r.TopParent||r.Account)).size + ' accounts';

  renderStats(filtered);
  renderSidebar(filtered);
}

function buildRow(r, showAccount){
  const tr = document.createElement('tr');
  tr.className = 'deal-row';
  const acctCell = showAccount ? (r.Account) : '';
  tr.innerHTML =
    '<td>'+(acctCell||'')+'</td>'+
    '<td><a class="dealink" target="_blank" href="https://niceincontact.lightning.force.com/lightning/r/Opportunity/'+r.Id+'/view">'+r.Name+'</a></td>'+
    '<td>'+(r.ContractType||'')+'</td>'+
    '<td>'+intBadges(r)+'</td>'+
    '<td>'+hubBadge(r)+'</td>'+
    '<td>'+r.CloseDate+'</td>'+
    '<td>'+fmtUSDlike(r)+'</td>'+
    '<td>'+(r.Agents!=null?r.Agents:'')+'</td>'+
    '<td>'+(r.Region||'')+'</td>'+
    '<td>'+stageBadge(r)+'</td>'+
    '<td>'+(r.Owner||'')+'</td>';
  return tr;
}

function renderStats(filtered){
  const usdAcv = filtered.reduce((s,r)=> s + (r.Cur==='USD'?r.ACV:0), 0);
  const accounts = new Set(filtered.map(r=>r.TopParent||r.Account)).size;
  const live = filtered.filter(r=>r.GoLiveStatus==='Live').length;
  const delayed = filtered.filter(r=>r.GoLiveStatus==='Delayed').length;
  const eta = filtered.filter(r=>r.GoLiveStatus==='ETA').length;
  const tbd = filtered.filter(r=>r.GoLiveStatus==='TBD').length;
  const stats = [
    ['Open Deals', filtered.length],
    ['Accounts', accounts],
    ['USD Pipeline ACV', '$'+Math.round(usdAcv).toLocaleString()],
    ['Live', live],
    ['Delayed / ETA / TBD', delayed+' / '+eta+' / '+tbd],
  ];
  const el = document.getElementById('stats');
  el.innerHTML = stats.map(s=>'<div class="stat"><div class="num">'+s[1]+'</div><div class="lbl">'+s[0]+'</div></div>').join('');
}

function renderSidebar(filtered){
  const byStatus = {};
  filtered.forEach(r=>{ byStatus[r.GoLiveStatus] = (byStatus[r.GoLiveStatus]||0)+1; });
  document.getElementById('byStatus').innerHTML = Object.entries(byStatus).map(([k,v])=>
    '<div class="side-row"><span>'+k+'</span><span>'+v+'</span></div>').join('');

  const byAcd = {};
  filtered.forEach(r=>{ (r.Badges||[]).forEach(b=>{ byAcd[b]=(byAcd[b]||0)+1; }); if(!r.Badges || !r.Badges.length) byAcd['(none)']=(byAcd['(none)']||0)+1; });
  document.getElementById('byAcd').innerHTML = Object.entries(byAcd).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    '<div class="side-row"><span>'+k+'</span><span>'+v+'</span></div>').join('');

  const byRegion = {};
  filtered.forEach(r=>{ const k = r.Region||'(none)'; byRegion[k]=(byRegion[k]||0)+1; });
  document.getElementById('byRegion').innerHTML = Object.entries(byRegion).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
    '<div class="side-row"><span>'+k+'</span><span>'+v+'</span></div>').join('');
}

populateFilters();
</script>
